<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YARI MENU</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --red:      #DC1E1E;
  --red-glow: #FF3232;
  --red-dark: #8C0A0A;
  --bg:       #0A0A0A;
  --dimmed:   #B0B0B0;
  --sep:      rgba(50,15,15,0.9);
}
html, body { width:100%; height:100%; background:transparent; overflow:hidden; font-family:'Rajdhani',sans-serif; }

#app {
  position:fixed; top:150px; left:200px; width:350px;
  display:none; flex-direction:column;
  background:var(--bg);
  border-top:3px solid var(--red);
  border-bottom:3px solid var(--red);
  box-shadow:0 0 20px rgba(220,30,30,0.4),0 0 6px rgba(220,30,30,0.3) inset;
  user-select:none;
}

#banner {
  position:relative; height:90px; flex-shrink:0;
  background:linear-gradient(180deg,rgba(40,5,5,0.95) 0%,rgba(10,10,10,1) 100%);
  display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:5px; overflow:hidden;
}
#banner::before { content:''; position:absolute; left:0; top:0; bottom:0; width:5px; background:linear-gradient(180deg,var(--red),var(--red-dark)); }
#banner::after  { content:''; position:absolute; right:0; top:0; bottom:0; width:5px; background:linear-gradient(180deg,var(--red),var(--red-dark)); opacity:0.7; }
.banner-main { font-size:30px; font-weight:700; letter-spacing:6px; color:#fff; text-shadow:0 0 14px var(--red-glow),0 0 30px rgba(220,30,30,0.45),2px 2px 0 rgba(140,10,10,0.5); }
.banner-sub  { font-size:10px; letter-spacing:3px; color:var(--dimmed); font-family:'Share Tech Mono',monospace; }

#subbanner { height:18px; flex-shrink:0; background:rgba(5,5,5,0.98); display:flex; align-items:center; justify-content:center; font-size:9px; letter-spacing:3px; color:rgba(200,200,200,0.6); font-family:'Share Tech Mono',monospace; border-top:1px solid rgba(30,5,5,0.7); }

#tabs { height:28px; flex-shrink:0; display:flex; border-bottom:2px solid var(--red); }
.tab { flex:1; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600; letter-spacing:2px; color:var(--dimmed); background:rgba(12,12,12,0.98); border-right:1px solid rgba(60,60,60,0.35); cursor:pointer; }
.tab:last-child { border-right:none; }
.tab.active { background:rgba(220,30,30,0.88); color:#fff; }

#cat-header { padding:4px 14px; font-size:10px; letter-spacing:2px; color:var(--dimmed); font-family:'Share Tech Mono',monospace; background:rgba(10,10,10,0.95); border-bottom:1px solid rgba(60,20,20,0.5); flex-shrink:0; display:none; }
#cat-header.show { display:block; }

#items-list { flex-shrink:0; }
.menu-item { height:30px; display:flex; align-items:center; padding:0 16px 0 28px; position:relative; border-bottom:1px solid var(--sep); }
.menu-item .bar { position:absolute; left:0; top:3px; bottom:3px; width:3px; background:var(--red); box-shadow:0 0 6px var(--red-glow); display:none; }
.menu-item.sel { background:rgba(220,30,30,0.13); }
.menu-item.sel .bar { display:block; }
.item-name { flex:1; font-size:13px; font-weight:500; color:rgba(255,255,255,0.85); letter-spacing:0.4px; }
.menu-item.sel .item-name { color:#fff; font-weight:600; }
.item-ind { font-size:13px; font-weight:700; color:var(--red); margin-left:6px; }
.menu-item.sel .item-ind { opacity:1; }
.menu-item:not(.sel) .item-ind { opacity:0.65; }

.tog { width:34px; height:14px; border-radius:7px; background:#333; position:relative; flex-shrink:0; }
.tog.on { background:var(--red); box-shadow:0 0 7px rgba(220,30,30,0.55); }
.tog::after { content:''; position:absolute; top:2px; left:2px; width:10px; height:10px; border-radius:50%; background:#fff; transition:left 0.12s; }
.tog.on::after { left:calc(100% - 12px); }

#footer { height:36px; flex-shrink:0; display:flex; align-items:center; justify-content:center; gap:16px; background:rgba(8,8,8,0.99); border-top:1px solid rgba(40,10,10,0.6); }
.kh { display:flex; align-items:center; gap:4px; font-size:10px; color:var(--dimmed); font-family:'Share Tech Mono',monospace; }
.k { display:inline-flex; align-items:center; justify-content:center; width:18px; height:14px; border:1px solid rgba(220,30,30,0.5); border-radius:2px; font-size:9px; color:var(--red); font-weight:700; background:rgba(220,30,30,0.07); }
</style>
</head>
<body>
<div id="app">
  <div id="banner">
    <span class="banner-main">YARI MENU</span>
    <span class="banner-sub">LAPSUS EXECUTOR</span>
  </div>
  <div id="subbanner">YARI MENU</div>
  <div id="tabs">
    <div class="tab active" id="tab-main">MAIN</div>
    <div class="tab"        id="tab-cfg">CONFIG</div>
  </div>
  <div id="cat-header"></div>
  <div id="items-list"></div>
  <div id="footer">
    <div class="kh"><span class="k">↑</span><span class="k">↓</span> Nav</div>
    <div class="kh"><span class="k">↵</span> OK</div>
    <div class="kh"><span class="k">⌫</span> Back</div>
    <div class="kh"><span class="k">Q</span><span class="k">E</span> Tab</div>
  </div>
</div>

<script>
// ── State (miroir du Lua, mis à jour par messages) ──
const CATEGORIES = [
  {name:"Player",        items:["Noclip","God Mode","No Ragdoll","No Collision","Fast Run","Revive","Teleporte To Waypoint","Max Heal","Max Armor","Invisible","Super Jump","Infinite Stamina"]},
  {name:"Online",        items:[]},
  {name:"Weapon",        items:["Give Weapons","Give Weapon by Name","Remove All Weapons"]},
  {name:"Combat",        items:["Laser Eye","Fast Punch"]},
  {name:"Vehicle",       items:["Spawn Véhicule Personnalisé","Porter/Lancer Véhicule","Full Performance","Delete Close Véhicule","Réparer Véhicule","Vehicle God Mode","Shift Boost","Unlock Vehicle","Lock Vehicle"]},
  {name:"Misc",          items:["Warp to Explode","Warp to Vehicle","Afficher liste spectateurs","Ragdoll Player","Ragdoll All Players","Anti Aim"]},
  {name:"Server",        items:["Bypass Sunlife","Prime Bypass"]},
  {name:"Settings",      items:["Auto Load Config"]},
  {name:"Keybind",       items:["Delete All Keybinds"]},
  {name:"Sunlife/Prime", items:["Buy Phone/radio"]},
  {name:"Protection",    items:["Anti-teleport","Panic Button"]},
  {name:"Destroyer",     items:["Delete All Vehicles","Explode All Vehicles","Cage All Players","Bug All Players BMX","Vehicle Chaos"]},
];
const CONFIG_ITEMS = ["Save Config","Load Config"];

// toggleStates[key] = bool  — key = "CategoryName_itemIndex1Based"
// Mis à jour exclusivement par des messages Lua (setToggleStates)
const toggleStates = {};

// Items qui ont un toggle (doivent correspondre à configurableToggles côté Lua)
const TOGGLE_KEYS = new Set([
  "Player_1","Player_2","Player_3","Player_4","Player_5",
  "Player_8","Player_9","Player_10","Player_11","Player_12",
  "Vehicle_2","Vehicle_6","Vehicle_7",
  "Misc_1","Misc_2","Misc_3","Misc_4",
  "Combat_1","Combat_2",
  "Protection_1",
  "Settings_1",
  "Destroyer_5",
]);

// ── UI state (miroir de la navigation Lua) ──
// Le Lua est maître — le HTML ne fait que refléter ce qu'il lui dit.
// Les nav keys du HTML sont désactivées : c'est le Lua qui envoie nav via sendNav().
let tab        = 'main';
let selIdx     = 0, scrollOff = 0;
let curCatName = null;   // null = liste des catégories
let catSel     = 0, catScroll = 0;
const MAX_VIS  = 10;

const appEl     = document.getElementById('app');
const tabMain   = document.getElementById('tab-main');
const tabCfg    = document.getElementById('tab-cfg');
const catHeader = document.getElementById('cat-header');
const itemsList = document.getElementById('items-list');

  let onlineSubMenu = null;   // null | 'Players' | 'Troll'
let onlineSubSel  = 0;      // index root (0=Players, 1=Troll)
let nearbyPlayers = [];     // [{serverId, name, distance}]
let selectedPlayers = {};   // {serverId: true}
let trollActions  = [
    "Teleport","Ragdoll","Silent Kill","Stun Player","Spectate","Revive",
    "Smash Attack","Launch Player","Cage Player","Cage Player M2",
    "Stop Cage Player M2","Bug Player BMX","Bug Player Avenger",
    "Block Player Vehicle","Rain Vehicle","Stop Rain Vehicle"
];
let trollSel = 0;
let playerSel = 0;

function getCurCat() {
  if (!curCatName) return null;
  return CATEGORIES.find(c => c.name === curCatName) || null;
}

function render() {
    itemsList.innerHTML = '';
    const cat = getCurCat();

    if (tab === 'config') {
        catHeader.className = '';
        renderList(CONFIG_ITEMS, selIdx, scrollOff, null);
        return;
    }
    if (cat) {
        catHeader.className = '';
        if (cat.name === 'Online') {
            renderOnline();
            return;
        }
        catHeader.textContent = cat.name.toUpperCase();
        catHeader.className = 'show';
        renderList(cat.items, catSel, catScroll, cat.name);
    } else {
        catHeader.className = '';
        renderCategories();
    }
}

function renderOnline() {
    if (onlineSubMenu === null) {
        // Root : Players / Troll
        ['Players', 'Troll'].forEach((name, i) => {
            const el = document.createElement('div');
            el.className = 'menu-item' + (i === onlineSubSel ? ' sel' : '');
            el.innerHTML = `<div class="bar"></div>
                <span class="item-name">${name}</span>
                <span class="item-ind">›</span>`;
            itemsList.appendChild(el);
        });
    } else if (onlineSubMenu === 'Players') {
        // Header avec compteur
        const selCount = Object.keys(selectedPlayers).length;
        if (selCount > 0) {
            const hd = document.createElement('div');
            hd.style.cssText = 'padding:2px 14px;font-size:10px;color:#32c832;font-family:"Share Tech Mono",monospace;';
            hd.textContent = `● ${selCount} sélectionné(s)`;
            itemsList.appendChild(hd);
        }
        if (nearbyPlayers.length === 0) {
            const el = document.createElement('div');
            el.className = 'menu-item';
            el.innerHTML = '<span class="item-name" style="color:var(--dimmed);font-size:11px">Aucun joueur à proximité</span>';
            itemsList.appendChild(el);
        } else {
            nearbyPlayers.slice(0, 10).forEach((p, i) => {
                const isOn = selectedPlayers[p.serverId] === true;
                const el = document.createElement('div');
                el.className = 'menu-item' + (i === playerSel ? ' sel' : '');
                el.innerHTML = `<div class="bar"></div>
                    <span class="item-name" style="font-size:11px">[${p.serverId}] ${p.name} <span style="color:var(--dimmed)">${p.distance}m</span></span>
                    <div class="tog${isOn ? ' on' : ''}"></div>`;
                itemsList.appendChild(el);
            });
        }
    } else if (onlineSubMenu === 'Troll') {
        const selCount = Object.keys(selectedPlayers).length;
        const hd = document.createElement('div');
        hd.style.cssText = 'padding:2px 14px;font-size:10px;font-family:"Share Tech Mono",monospace;';
        hd.style.color = selCount > 0 ? '#32c832' : '#dc821e';
        hd.textContent = selCount > 0 ? `● ${selCount} joueur(s) ciblé(s)` : '⚠ Aucun joueur sélectionné';
        itemsList.appendChild(hd);

        trollActions.forEach((name, i) => {
            const el = document.createElement('div');
            el.className = 'menu-item' + (i === trollSel ? ' sel' : '');
            el.innerHTML = `<div class="bar"></div>
                <span class="item-name">${name}</span>
                <span class="item-ind">▶</span>`;
            itemsList.appendChild(el);
        });
    }
}

function renderCategories() {
  for (let i = 0; i < MAX_VIS; i++) {
    const idx = i + scrollOff;
    if (idx >= CATEGORIES.length) break;
    const c   = CATEGORIES[idx];
    const has = c.items.length > 0 || c.name === 'Online';
    makeItem(c.name, idx === selIdx, has ? '›' : '', null);
  }
}

function renderList(items, si, so, catName) {
  if (items.length === 0) {
    const d = document.createElement('div');
    d.className = 'menu-item';
    d.innerHTML = '<span class="item-name" style="color:var(--dimmed);font-size:11px">Aucun élément</span>';
    itemsList.appendChild(d);
    return;
  }
  for (let i = 0; i < MAX_VIS; i++) {
    const idx = i + so;
    if (idx >= items.length) break;
    const name = items[idx];
    const key  = catName ? catName + '_' + (idx + 1) : null;
    const isTog = key !== null && TOGGLE_KEYS.has(key);
    const togVal = isTog ? (toggleStates[key] === true) : null;
    makeItem(name, idx === si, isTog ? null : '+', togVal);
  }
}

function makeItem(name, selected, ind, togState) {
  const el = document.createElement('div');
  el.className = 'menu-item' + (selected ? ' sel' : '');

  const bar = document.createElement('div');
  bar.className = 'bar';
  el.appendChild(bar);

  const nm = document.createElement('span');
  nm.className = 'item-name';
  nm.textContent = name;
  el.appendChild(nm);

  if (togState !== null && togState !== undefined) {
    const t = document.createElement('div');
    t.className = 'tog' + (togState ? ' on' : '');
    el.appendChild(t);
  } else if (ind) {
    const s = document.createElement('span');
    s.className = 'item-ind';
    s.textContent = ind;
    el.appendChild(s);
  }
  itemsList.appendChild(el);
}

function setTab(t) {
  tab = t; curCatName = null; selIdx = 0; scrollOff = 0;
  tabMain.className = 'tab' + (t === 'main'   ? ' active' : '');
  tabCfg.className  = 'tab' + (t === 'config' ? ' active' : '');
  render();
}

// ── Messages entrants depuis Lua ─────────────────────
window.addEventListener('message', function(e) {
    let d = e.data;
    if (typeof d === 'string') { try { d = JSON.parse(d); } catch(_) { return; } }
    if (!d || !d.type) return;

    if (d.type === 'showMenu') { appEl.style.display = 'flex'; return; }
    if (d.type === 'hideMenu') { appEl.style.display = 'none';  return; }

    if (d.type === 'sync') {
    if (d.toggles) Object.assign(toggleStates, d.toggles);
    if (d.tab) {
        tab = d.tab;
        tabMain.className = 'tab' + (tab === 'main'   ? ' active' : '');
        tabCfg.className  = 'tab' + (tab === 'config' ? ' active' : '');
    }
    curCatName = d.curCatName || null;
    if (d.selIdx    !== undefined) { if (curCatName) catSel = d.selIdx; else selIdx = d.selIdx; }
    if (d.scrollOff !== undefined) { if (curCatName) catScroll = d.scrollOff; else scrollOff = d.scrollOff; }

    // Online data
    if ('onlineSubMenu' in d) onlineSubMenu = d.onlineSubMenu;
    if (d.onlineSubSel   !== undefined) onlineSubSel   = d.onlineSubSel;
    if (d.nearbyPlayers  !== undefined) nearbyPlayers  = d.nearbyPlayers;
    if (d.selectedPlayers!== undefined) selectedPlayers= d.selectedPlayers;
    if (d.trollSel       !== undefined) trollSel       = d.trollSel;
    if (d.playerSel      !== undefined) playerSel      = d.playerSel;

    render();
}
});

function moveSelection(dir) {
  const cat = getCurCat();
  if (tab === 'config') {
    selIdx = clamp(selIdx + dir, 0, CONFIG_ITEMS.length - 1);
    adjustScroll(selIdx, CONFIG_ITEMS.length, 'main');
  } else if (cat) {
    catSel = clamp(catSel + dir, 0, cat.items.length - 1);
    adjustScroll(catSel, cat.items.length, 'cat');
  } else {
    selIdx = clamp(selIdx + dir, 0, CATEGORIES.length - 1);
    adjustScroll(selIdx, CATEGORIES.length, 'main');
  }
}

function adjustScroll(si, total, mode) {
  if (mode === 'cat') {
    if (si < catScroll) catScroll = si;
    if (si >= catScroll + MAX_VIS) catScroll = si - MAX_VIS + 1;
  } else {
    if (si < scrollOff) scrollOff = si;
    if (si >= scrollOff + MAX_VIS) scrollOff = si - MAX_VIS + 1;
  }
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// ── Init ─────────────────────────────────────────────
// Menu caché par défaut, affiché par le Lua via showMenu
render();
</script>
</body>
</html>

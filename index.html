<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YARI MENU</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap');

#spec-hud {
  display: none;
  position: fixed;
  top: 40px;
  left: 18px;
  width: 260px;
  font-family: 'Share Tech Mono', monospace;
  z-index: 9999;
  pointer-events: none;
}
#spec-hud.visible { display: block; }

.spec-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 3px 10px;
  background: rgba(0,0,0,0.82);
  border-left: 3px solid var(--accent);
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.spec-header .spec-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent-glow);
  animation: blink 1.2s ease-in-out infinite;
}
.spec-header .spec-count {
  font-size: 11px;
  color: var(--accent);
  letter-spacing: 1px;
  font-weight: 700;
}
.spec-header .spec-label {
  font-size: 10px;
  color: rgba(200,200,200,0.55);
  letter-spacing: 2px;
  margin-left: auto;
}

@keyframes blink {
  0%,100% { opacity:1; }
  50%      { opacity:0.3; }
}

.spec-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
  padding: 3px 10px 3px 13px;
  background: rgba(0,0,0,0.72);
  border-left: 3px solid transparent;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  transition: border-color 0.15s;
}
.spec-row.noclip { border-left-color: var(--accent); }
.spec-row.admin  { border-left-color: #dcaa1e; }

.spec-sid {
  font-size: 10px;
  color: var(--accent);
  min-width: 26px;
}
.spec-name {
  font-size: 11px;
  color: #e8e8e8;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.spec-dist {
  font-size: 10px;
  color: rgba(180,180,180,0.6);
  white-space: nowrap;
}
.spec-type {
  font-size: 9px;
  letter-spacing: 1px;
  padding: 1px 4px;
  border-radius: 2px;
  white-space: nowrap;
}
.spec-type.noclip { color: var(--accent); background: rgba(220,30,30,0.15); }
.spec-type.admin  { color: #dcaa1e;       background: rgba(220,170,30,0.12); }
.spec-type.both   { color: #ff9900;       background: rgba(255,153,0,0.13); }

.spec-empty {
  padding: 5px 13px;
  font-size: 10px;
  color: rgba(180,180,180,0.4);
  background: rgba(0,0,0,0.72);
  border-left: 3px solid transparent;
  letter-spacing: 1px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent:      #DC1E1E;
  --accent-glow: #FF3232;
  --accent-dark: #8C0A0A;
  --accent-l:    #DC1E1E;
  --accent-r:    #8B1FDC;
  --bg:          #0A0A0A;
  --dimmed:      #B0B0B0;
  --sep:         rgba(50,15,15,0.9);
}

.theme-red    { --accent:#DC1E1E; --accent-glow:#FF3232; --accent-dark:#8C0A0A; --sep:rgba(50,15,15,0.9); }
.theme-purple { --accent:#8B1FDC; --accent-glow:#AA44FF; --accent-dark:#4A0A8C; --sep:rgba(35,10,50,0.9); }
.theme-blue   { --accent:#1E5ADC; --accent-glow:#3278FF; --accent-dark:#0A2A8C; --sep:rgba(10,20,50,0.9); }
.theme-green  { --accent:#1EDC4A; --accent-glow:#32FF6E; --accent-dark:#0A8C26; --sep:rgba(10,40,20,0.9); }

html, body { width:100%; height:100%; background:transparent; overflow:hidden; font-family:'Rajdhani',sans-serif; }

/* ── MENU WRAPPER (permet d'aligner menu + panel côte à côte) ── */
#menu-wrapper {
  position: fixed;
  top: 150px;
  left: 200px;
  display: none;
  flex-direction: row;
  align-items: flex-start;
  gap: 8px;
}
#menu-wrapper.visible { display: flex; }

#app {
  width: 350px;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  border-top: 3px solid var(--accent);
  border-bottom: 3px solid var(--accent);
  box-shadow: 0 0 20px rgba(0,0,0,0.45), 0 0 6px rgba(0,0,0,0.3) inset;
  user-select: none;
  transition: border-color 0.25s;
}

/* ── TWO-TONE ── */
#app.twotone {
  border-top-color: transparent;
  border-bottom-color: transparent;
  border-top: none;
  border-bottom: none;
}
#top-border, #bot-border {
  display: none; height: 3px; flex-shrink: 0; width: 100%;
  background: linear-gradient(90deg, var(--accent-l) 0%, var(--accent-l) 38%, var(--accent-r) 62%, var(--accent-r) 100%);
}
#app.twotone #top-border,
#app.twotone #bot-border { display: block; }

/* ── INFO PANEL ── */
#info-panel {
  width: 220px;
  display: none;
  flex-direction: column;
  background: var(--bg);
  border-top: 3px solid var(--accent);
  border-bottom: 3px solid var(--accent);
  box-shadow: 0 0 20px rgba(0,0,0,0.45);
  font-family: 'Share Tech Mono', monospace;
  transition: border-color 0.25s;
  overflow: hidden;
}
#info-panel.visible { display: flex; }

/* two-tone info panel borders */
#app.twotone ~ #info-panel {
  border-top-color: var(--accent-l);
  border-bottom-color: var(--accent-r);
}

.ip-header {
  padding: 6px 12px;
  background: rgba(15,5,5,0.98);
  border-bottom: 1px solid rgba(var(--accent), 0.3);
  display: flex;
  align-items: center;
  gap: 8px;
}
.ip-header-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 5px var(--accent-glow);
  flex-shrink: 0;
}
.ip-player-name {
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}
.ip-sid {
  font-size: 10px;
  color: var(--accent);
  white-space: nowrap;
}

/* health bar */
.ip-bars {
  padding: 7px 12px 5px;
  background: rgba(10,5,5,0.95);
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.ip-bar-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 5px;
}
.ip-bar-row:last-child { margin-bottom: 0; }
.ip-bar-label {
  font-size: 9px;
  color: var(--dimmed);
  letter-spacing: 1px;
  width: 40px;
  flex-shrink: 0;
}
.ip-bar-track {
  flex: 1;
  height: 5px;
  background: rgba(255,255,255,0.08);
  border-radius: 3px;
  overflow: hidden;
}
.ip-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.3s ease;
}
.ip-bar-fill.health { background: linear-gradient(90deg, #c81e1e, #32c832); }
.ip-bar-fill.armor  { background: linear-gradient(90deg, #1e5adc, #32aaff); }
.ip-bar-val {
  font-size: 10px;
  color: #fff;
  width: 30px;
  text-align: right;
  flex-shrink: 0;
}

/* info rows */
.ip-section {
  padding: 5px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.ip-row {
  display: flex;
  align-items: center;
  padding: 3px 12px;
  gap: 6px;
}
.ip-icon {
  font-size: 11px;
  width: 16px;
  text-align: center;
  flex-shrink: 0;
  opacity: 0.7;
}
.ip-key {
  font-size: 10px;
  color: rgba(180,180,180,0.55);
  letter-spacing: 1px;
  flex: 1;
}
.ip-val {
  font-size: 11px;
  color: #e8e8e8;
  text-align: right;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 110px;
}
.ip-val.accent  { color: var(--accent); }
.ip-val.warning { color: #dcaa1e; }
.ip-val.ok      { color: #32c832; }
.ip-val.danger  { color: #dc321e; }

/* coords block */
.ip-coords {
  padding: 5px 12px 7px;
  background: rgba(5,5,5,0.6);
}
.ip-coords-label {
  font-size: 9px;
  color: rgba(180,180,180,0.4);
  letter-spacing: 2px;
  margin-bottom: 3px;
}
.ip-coords-val {
  font-size: 10px;
  color: rgba(220,220,220,0.7);
  letter-spacing: 0.5px;
}

/* ── BANNER ── */
#banner {
  position: relative; height: 90px; flex-shrink: 0;
  background: linear-gradient(180deg,rgba(40,5,5,0.95) 0%,rgba(10,10,10,1) 100%);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 5px; overflow: hidden;
}
#banner::before {
  content:''; position:absolute; left:0; top:0; bottom:0; width:5px;
  background: linear-gradient(180deg,var(--accent-l),var(--accent-dark));
  transition: background 0.25s;
}
#banner::after {
  content:''; position:absolute; right:0; top:0; bottom:0; width:5px;
  background: linear-gradient(180deg,var(--accent-r),var(--accent-dark));
  opacity:0.7; transition: background 0.25s;
}
#app:not(.twotone) #banner::before { background:linear-gradient(180deg,var(--accent),var(--accent-dark)); }
#app:not(.twotone) #banner::after  { background:linear-gradient(180deg,var(--accent),var(--accent-dark)); opacity:0.7; }

.banner-main { font-size:30px; font-weight:700; letter-spacing:6px; color:#fff; text-shadow:0 0 14px var(--accent-glow),0 0 30px rgba(220,30,30,0.45),2px 2px 0 rgba(140,10,10,0.5); }
.banner-sub  { font-size:10px; letter-spacing:3px; color:var(--dimmed); font-family:'Share Tech Mono',monospace; }

#subbanner {
  height:18px; flex-shrink:0; background:rgba(5,5,5,0.98);
  display:flex; align-items:center; justify-content:center;
  font-size:9px; letter-spacing:3px; color:rgba(200,200,200,0.6);
  font-family:'Share Tech Mono',monospace;
  border-top:1px solid rgba(30,5,5,0.7);
}

#tabs { height:28px; flex-shrink:0; display:flex; border-bottom:2px solid var(--accent); transition: border-color 0.25s; }
#app.twotone #tabs {
  border-bottom: none; position: relative;
}
#app.twotone #tabs::after {
  content:''; position:absolute; bottom:0; left:0; right:0; height:2px;
  background: linear-gradient(90deg, var(--accent-l) 0%, var(--accent-l) 38%, var(--accent-r) 62%, var(--accent-r) 100%);
}

.tab {
  flex:1; display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:600; letter-spacing:2px; color:var(--dimmed);
  background:rgba(12,12,12,0.98); border-right:1px solid rgba(60,60,60,0.35); cursor:pointer;
  transition: background 0.2s;
}
.tab:last-child { border-right:none; }
.tab.active { background:var(--accent); color:#fff; }
#app.twotone .tab.active { background:var(--accent-l); }

#cat-header {
  padding:4px 14px; font-size:10px; letter-spacing:2px; color:var(--dimmed);
  font-family:'Share Tech Mono',monospace; background:rgba(10,10,10,0.95);
  border-bottom:1px solid rgba(60,20,20,0.5); flex-shrink:0; display:none;
}
#cat-header.show { display:block; }

#items-list { flex-shrink:0; }
.menu-item {
  height:30px; display:flex; align-items:center;
  padding:0 16px 0 28px; position:relative;
  border-bottom:1px solid var(--sep);
}
.menu-item .bar {
  position:absolute; left:0; top:3px; bottom:3px; width:3px;
  background:var(--accent); box-shadow:0 0 6px var(--accent-glow); display:none;
  transition: background 0.2s;
}
.menu-item.sel { background:rgba(220,30,30,0.07); }
.menu-item.sel .bar { display:block; }
.item-name { flex:1; font-size:13px; font-weight:500; color:rgba(255,255,255,0.85); letter-spacing:0.4px; }
.menu-item.sel .item-name { color:#fff; font-weight:600; }
.item-ind { font-size:13px; font-weight:700; color:var(--accent); margin-left:6px; }
.menu-item.sel .item-ind { opacity:1; }
.menu-item:not(.sel) .item-ind { opacity:0.65; }

#app.twotone .menu-item.sel .bar {
  background: linear-gradient(180deg, var(--accent-l), var(--accent-r));
  box-shadow: 0 0 6px var(--accent-l);
}
#app.twotone .menu-item.sel .item-name { color:#fff; }
#app.twotone .item-ind { color: var(--accent-r); }

.tog {
  width:34px; height:14px; border-radius:7px;
  background:#333; position:relative; flex-shrink:0;
  transition: background 0.15s;
}
.tog.on { background:var(--accent); box-shadow:0 0 7px var(--accent-glow); }
#app.twotone .tog.on { background: linear-gradient(90deg, var(--accent-l), var(--accent-r)); box-shadow:0 0 7px var(--accent-l); }
.tog::after {
  content:''; position:absolute; top:2px; left:2px;
  width:10px; height:10px; border-radius:50%; background:#fff; transition:left 0.12s;
}
.tog.on::after { left:calc(100% - 12px); }

#footer {
  height:36px; flex-shrink:0; display:flex;
  align-items:center; justify-content:center; gap:16px;
  background:rgba(8,8,8,0.99);
  border-top:1px solid rgba(40,10,10,0.6);
}
.kh { display:flex; align-items:center; gap:4px; font-size:10px; color:var(--dimmed); font-family:'Share Tech Mono',monospace; }
.k {
  display:inline-flex; align-items:center; justify-content:center;
  width:18px; height:14px;
  border:1px solid rgba(220,30,30,0.5); border-radius:2px;
  font-size:9px; color:var(--accent); font-weight:700;
  background:rgba(220,30,30,0.07);
}

.color-strip {
  display:flex; gap:6px; align-items:center; padding:4px 14px 0;
  flex-shrink:0;
}
.color-dot {
  width:14px; height:14px; border-radius:50%; cursor:pointer;
  border:2px solid transparent; transition:border-color 0.15s, transform 0.1s;
  flex-shrink:0;
}
.color-dot.active { border-color:#fff; transform:scale(1.25); }
.color-dot.red    { background:#DC1E1E; }
.color-dot.purple { background:#8B1FDC; }
.color-dot.blue   { background:#1E5ADC; }
.color-dot.green  { background:#1EDC4A; }
</style>
</head>
<body>

<!-- WRAPPER : menu + info panel côte à côte -->
<div id="menu-wrapper">

  <div id="app" class="theme-red">
    <div id="top-border"></div>
    <div id="banner">
      <img src="yari_menu_banniere_rouge.png" alt="banner"
           style="width:100%; height:90px; object-fit:cover; object-position:center; display:block;" />
    </div>
    <div id="subbanner">YARI MENU</div>
    <div id="tabs">
      <div class="tab active" id="tab-main">MAIN</div>
      <div class="tab"        id="tab-cfg">CONFIG</div>
    </div>
    <div id="cat-header"></div>
    <div id="items-list"></div>
    <div id="bot-border"></div>
    <div id="footer">
      <div class="kh"><span class="k">↑</span><span class="k">↓</span> Nav</div>
      <div class="kh"><span class="k">↵</span> OK</div>
      <div class="kh"><span class="k">⌫</span> Back</div>
      <div class="kh"><span class="k">Q</span><span class="k">E</span> Tab</div>
    </div>
  </div>

  <!-- INFO PANEL -->
  <div id="info-panel">
    <!-- dynamically filled -->
  </div>

</div><!-- /menu-wrapper -->

<div id="spec-hud"></div>

<script>
// ── THEME ────────────────────────────────────────────────────────────
const THEMES = {
  red:    { accent:'#DC1E1E', glow:'#FF3232', dark:'#8C0A0A', sep:'rgba(50,15,15,0.9)' },
  purple: { accent:'#8B1FDC', glow:'#AA44FF', dark:'#4A0A8C', sep:'rgba(35,10,50,0.9)' },
  blue:   { accent:'#1E5ADC', glow:'#3278FF', dark:'#0A2A8C', sep:'rgba(10,20,50,0.9)' },
  green:  { accent:'#1EDC4A', glow:'#32FF6E', dark:'#0A8C26', sep:'rgba(10,40,20,0.9)' },
};
const TWOTONE_LEFT  = '#DC1E1E';
const TWOTONE_RIGHT = '#8B1FDC';

let currentTheme   = 'red';
let twoToneEnabled = false;

const appEl      = document.getElementById('app');
const wrapperEl  = document.getElementById('menu-wrapper');
const infoPanelEl = document.getElementById('info-panel');
const root       = document.documentElement;

function applyTheme(name, twotone) {
  currentTheme   = name;
  twoToneEnabled = twotone;

  appEl.classList.remove('theme-red','theme-purple','theme-blue','theme-green','twotone');

  if (twotone) {
    appEl.classList.add('twotone');
    root.style.setProperty('--accent-l',    TWOTONE_LEFT);
    root.style.setProperty('--accent-r',    TWOTONE_RIGHT);
    root.style.setProperty('--accent',      TWOTONE_LEFT);
    root.style.setProperty('--accent-glow', '#FF3232');
    root.style.setProperty('--accent-dark', '#8C0A0A');
    root.style.setProperty('--sep', 'rgba(50,10,40,0.9)');
    infoPanelEl.style.borderTopColor    = TWOTONE_LEFT;
    infoPanelEl.style.borderBottomColor = TWOTONE_RIGHT;
  } else {
    appEl.classList.add('theme-' + name);
    const t = THEMES[name];
    root.style.setProperty('--accent',      t.accent);
    root.style.setProperty('--accent-glow', t.glow);
    root.style.setProperty('--accent-dark', t.dark);
    root.style.setProperty('--sep',         t.sep);
    root.style.setProperty('--accent-l',    t.accent);
    root.style.setProperty('--accent-r',    t.accent);
    infoPanelEl.style.borderTopColor    = t.accent;
    infoPanelEl.style.borderBottomColor = t.accent;
  }
}

// ── BANNER ───────────────────────────────────────────────────────────
const BANNERS = [
  "yari_menu_banniere_rouge.png",
  "banniere.gif","banniere1.png","banniere2.png","banniere2giff.gif",
];
let bannerIdx = 0;
const bannerImg = document.querySelector('#banner img');

function cycleBanner() {
  bannerIdx = (bannerIdx + 1) % BANNERS.length;
  sendToLua({ type: 'bannerChange', index: bannerIdx });
  const next = BANNERS[bannerIdx];
  const test = new Image();
  test.onload  = () => { bannerImg.src = next; };
  test.onerror = () => { bannerIdx = 0; bannerImg.src = BANNERS[0]; sendToLua({ type: 'bannerChange', index: 0 }); };
  test.src = next;
}

// ── MENU DATA ────────────────────────────────────────────────────────
const CATEGORIES = [
  {name:"Player",        items:["Noclip","God Mode","No Ragdoll","No Collision","Fast Run","Revive","Teleporte To Waypoint","Max Heal","Max Armor","Invisible","Super Jump","Infinite Stamina"]},
  {name:"Online",        items:[]},
  {name:"Weapon",        items:["Give Weapons","Give Weapon by Name","Remove All Weapons"]},
  {name:"Combat",        items:["Laser Eye","Fast Punch"]},
  {name:"Vehicle",       items:["Spawn Véhicule Personnalisé","Porter/Lancer Véhicule","Full Performance","Delete Close Véhicule","Réparer Véhicule","Vehicle God Mode","Shift Boost","Unlock Vehicle","Lock Vehicle"]},
  {name:"Construction",  items:["Wing Vehicle","Tower Vehicle","Ramp Vehicle","Transformer Vehicle","Detach Vehicle"]},
  {name:"Misc",          items:["Warp to Explode","Warp to Vehicle","Afficher liste spectateurs","Ragdoll Player","Ragdoll All Players","Anti Aim"]},
  {name:"Server",        items:["Bypass Sunlife","Prime Bypass"]},
  {name:"Settings",      items:["Auto Load Config","Change Banner","Couleur du Menu","Activer Deux Couleurs"]},
  {name:"Keybind",       items:["Delete All Keybinds"]},
  {name:"Sunlife/Prime", items:["Buy Phone/radio"]},
  {name:"Protection",    items:["Anti-teleport","Panic Button"]},
  {name:"Destroyer",     items:["Delete All Vehicles","Explode All Vehicles","Cage All Players","Bug All Players BMX","Vehicle Chaos"]},
];
const CONFIG_ITEMS = ["Save Config","Load Config"];

const toggleStates = {};
const TOGGLE_KEYS = new Set([
  "Player_1","Player_2","Player_3","Player_4","Player_5",
  "Player_8","Player_9","Player_10","Player_11","Player_12",
  "Vehicle_2","Vehicle_6","Vehicle_7",
  "Misc_1","Misc_2","Misc_3","Misc_4",
  "Combat_1","Combat_2",
  "Protection_1",
  "Settings_1",
  "Settings_4",
  "Destroyer_5",
]);

// ── UI STATE ─────────────────────────────────────────────────────────
let tab         = 'main';
let selIdx      = 0, scrollOff = 0;
let curCatName  = null;
let catSel      = 0, catScroll = 0;
const MAX_VIS   = 10;

let onlineSubMenu   = null;
let onlineSubSel    = 0;
let nearbyPlayers   = [];
let selectedPlayers = {};
let trollActions    = [
  "Teleport","Ragdoll","Silent Kill","Stun Player","Spectate","Revive",
  "Smash Attack","Launch Player","Cage Player","Cage Player M2",
  "Stop Cage Player M2","Bug Player BMX","Bug Player Avenger",
  "Block Player Vehicle","Rain Vehicle","Stop Rain Vehicle"
];
let trollSel = 0, playerSel = 0;

const tabMainEl  = document.getElementById('tab-main');
const tabCfgEl   = document.getElementById('tab-cfg');
const catHeader  = document.getElementById('cat-header');
const itemsList  = document.getElementById('items-list');

// ── INFO PANEL ───────────────────────────────────────────────────────
function getSelectedPlayer() {
  if (!nearbyPlayers.length) return null;
  // priority: joueur sélectionné dans selectedPlayers; sinon playerSel courant
  for (let i = 0; i < nearbyPlayers.length; i++) {
    const p = nearbyPlayers[i];
    if (selectedPlayers[p.serverId]) return p;
  }
  // fallback: joueur sous le curseur dans Players subMenu
  if (onlineSubMenu === 'Players' && nearbyPlayers[playerSel]) {
    return nearbyPlayers[playerSel];
  }
  return null;
}

function shouldShowInfoPanel() {
  return curCatName === 'Online' &&
         (onlineSubMenu === 'Players' || onlineSubMenu === 'Troll' || onlineSubMenu === null) &&
         nearbyPlayers.length > 0;
}

function renderInfoPanel() {
  if (!shouldShowInfoPanel()) {
    infoPanelEl.classList.remove('visible');
    infoPanelEl.innerHTML = '';
    return;
  }

  // Choisir le joueur à afficher
  let p = null;
  if (onlineSubMenu === 'Players' && nearbyPlayers[playerSel]) {
    p = nearbyPlayers[playerSel];
  } else {
    p = getSelectedPlayer();
  }
  if (!p) {
    // Montrer le premier joueur en liste si aucune sélection
    p = nearbyPlayers[0];
  }
  if (!p) {
    infoPanelEl.classList.remove('visible');
    infoPanelEl.innerHTML = '';
    return;
  }

  infoPanelEl.classList.add('visible');

  const hp     = p.health    !== undefined ? p.health    : 100;
  const maxHp  = p.maxHealth !== undefined ? p.maxHealth : 100;
  const armor  = p.armor     !== undefined ? p.armor     : 0;
  const hpPct  = Math.max(0, Math.min(100, Math.round((hp / maxHp) * 100)));
  const arPct  = Math.max(0, Math.min(100, armor));

  // Health gradient: red below 30%, yellow 30-60%, green above
  let hpColor = '#32c832';
  if (hpPct < 30)       hpColor = '#dc321e';
  else if (hpPct < 60)  hpColor = '#dcaa1e';

  const veh       = p.vehicle || 'on foot';
  const speed     = p.speed   !== undefined ? p.speed + ' km/h' : '—';
  const dist      = p.distance !== undefined ? p.distance + 'm' : '—';
  const inVeh     = veh !== 'on foot';
  const isInvis   = p.invisible === true;
  const isGod     = p.godMode   === true;
  const coords    = p.coords    || null;
  const isSelected = selectedPlayers[p.serverId] === true;

  // Couleur distance
  let distClass = 'ok';
  if (p.distance > 500)       distClass = 'warning';
  if (p.distance > 1000)      distClass = 'danger';

  infoPanelEl.innerHTML = `
    <div class="ip-header">
      <div class="ip-header-dot"></div>
      <span class="ip-player-name">${escHtml(p.name)}</span>
      <span class="ip-sid">#${p.serverId}</span>
    </div>

    <div class="ip-bars">
      <div class="ip-bar-row">
        <span class="ip-bar-label">HP</span>
        <div class="ip-bar-track">
          <div class="ip-bar-fill health" style="width:${hpPct}%; background:${hpColor};"></div>
        </div>
        <span class="ip-bar-val">${hpPct}%</span>
      </div>
      <div class="ip-bar-row">
        <span class="ip-bar-label">ARMOR</span>
        <div class="ip-bar-track">
          <div class="ip-bar-fill armor" style="width:${arPct}%;"></div>
        </div>
        <span class="ip-bar-val">${arPct}%</span>
      </div>
    </div>

    <div class="ip-section">
      <div class="ip-row">
        <span class="ip-icon">📍</span>
        <span class="ip-key">DIST</span>
        <span class="ip-val ${distClass}">${dist}</span>
      </div>
      <div class="ip-row">
        <span class="ip-icon">🚗</span>
        <span class="ip-key">VEHICLE</span>
        <span class="ip-val ${inVeh ? 'warning' : ''}">${escHtml(veh)}</span>
      </div>
      <div class="ip-row">
        <span class="ip-icon">⚡</span>
        <span class="ip-key">SPEED</span>
        <span class="ip-val">${speed}</span>
      </div>
    </div>

    <div class="ip-section">
      <div class="ip-row">
        <span class="ip-icon">👁</span>
        <span class="ip-key">INVIS</span>
        <span class="ip-val ${isInvis ? 'danger' : 'ok'}">${isInvis ? 'OUI' : 'NON'}</span>
      </div>
      <div class="ip-row">
        <span class="ip-icon">🛡</span>
        <span class="ip-key">GOD</span>
        <span class="ip-val ${isGod ? 'danger' : 'ok'}">${isGod ? 'OUI' : 'NON'}</span>
      </div>
      <div class="ip-row">
        <span class="ip-icon">✔</span>
        <span class="ip-key">SELECT</span>
        <span class="ip-val ${isSelected ? 'accent' : ''}">${isSelected ? 'OUI' : 'NON'}</span>
      </div>
    </div>

    ${coords ? `
    <div class="ip-coords">
      <div class="ip-coords-label">COORDS</div>
      <div class="ip-coords-val">X ${coords.x}  Y ${coords.y}  Z ${coords.z}</div>
    </div>` : ''}
  `;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── RENDER ───────────────────────────────────────────────────────────
function getCurCat() {
  if (!curCatName) return null;
  return CATEGORIES.find(c => c.name === curCatName) || null;
}

function render() {
  itemsList.innerHTML = '';
  const cat = getCurCat();

  if (tab === 'config') {
    catHeader.className = '';
    renderList(CONFIG_ITEMS, selIdx, scrollOff, null);
    renderInfoPanel();
    return;
  }
  if (cat) {
    catHeader.className = '';
    if (cat.name === 'Online') { renderOnline(); renderInfoPanel(); return; }
    catHeader.textContent = cat.name.toUpperCase();
    catHeader.className = 'show';
    renderList(cat.items, catSel, catScroll, cat.name);
  } else {
    catHeader.className = '';
    renderCategories();
  }
  renderInfoPanel();
}

function renderOnline() {
  if (onlineSubMenu === null) {
    ['Players','Troll'].forEach((name,i) => {
      const el = document.createElement('div');
      el.className = 'menu-item' + (i === onlineSubSel ? ' sel' : '');
      el.innerHTML = `<div class="bar"></div><span class="item-name">${name}</span><span class="item-ind">›</span>`;
      itemsList.appendChild(el);
    });
  } else if (onlineSubMenu === 'Players') {
    const selCount = Object.keys(selectedPlayers).length;
    if (selCount > 0) {
      const hd = document.createElement('div');
      hd.style.cssText = 'padding:2px 14px;font-size:10px;color:#32c832;font-family:"Share Tech Mono",monospace;';
      hd.textContent = `● ${selCount} sélectionné(s)`;
      itemsList.appendChild(hd);
    }
    if (nearbyPlayers.length === 0) {
      const el = document.createElement('div');
      el.className = 'menu-item';
      el.innerHTML = '<span class="item-name" style="color:var(--dimmed);font-size:11px">Aucun joueur à proximité</span>';
      itemsList.appendChild(el);
    } else {
      nearbyPlayers.slice(0,10).forEach((p,i) => {
        const isOn = selectedPlayers[p.serverId] === true;
        const el = document.createElement('div');
        el.className = 'menu-item' + (i === playerSel ? ' sel' : '');
        el.innerHTML = `<div class="bar"></div>
          <span class="item-name" style="font-size:11px">[${p.serverId}] ${escHtml(p.name)} <span style="color:var(--dimmed)">${p.distance}m</span></span>
          <div class="tog${isOn ? ' on' : ''}"></div>`;
        itemsList.appendChild(el);
      });
    }
  } else if (onlineSubMenu === 'Troll') {
    const selCount = Object.keys(selectedPlayers).length;
    const hd = document.createElement('div');
    hd.style.cssText = 'padding:2px 14px;font-size:10px;font-family:"Share Tech Mono",monospace;';
    hd.style.color = selCount > 0 ? '#32c832' : '#dc821e';
    hd.textContent = selCount > 0 ? `● ${selCount} joueur(s) ciblé(s)` : '⚠ Aucun joueur sélectionné';
    itemsList.appendChild(hd);
    trollActions.forEach((name,i) => {
      const el = document.createElement('div');
      el.className = 'menu-item' + (i === trollSel ? ' sel' : '');
      el.innerHTML = `<div class="bar"></div><span class="item-name">${name}</span><span class="item-ind">▶</span>`;
      itemsList.appendChild(el);
    });
  }
}

function renderCategories() {
  for (let i = 0; i < MAX_VIS; i++) {
    const idx = i + scrollOff;
    if (idx >= CATEGORIES.length) break;
    const c   = CATEGORIES[idx];
    const has = c.items.length > 0 || c.name === 'Online';
    makeItem(c.name, idx === selIdx, has ? '›' : '', null);
  }
}

function renderList(items, si, so, catName) {
  if (items.length === 0) {
    const d = document.createElement('div');
    d.className = 'menu-item';
    d.innerHTML = '<span class="item-name" style="color:var(--dimmed);font-size:11px">Aucun élément</span>';
    itemsList.appendChild(d);
    return;
  }
  for (let i = 0; i < MAX_VIS; i++) {
    const idx  = i + so;
    if (idx >= items.length) break;
    const name = items[idx];
    const key  = catName ? catName + '_' + (idx + 1) : null;
    const isTog = key !== null && TOGGLE_KEYS.has(key);
    if (catName === 'Settings' && name === 'Couleur du Menu') {
      const el = document.createElement('div');
      el.className = 'menu-item' + (idx === si ? ' sel' : '');
      el.style.height = 'auto'; el.style.padding = '4px 14px 4px 28px';
      el.style.flexWrap = 'wrap'; el.style.gap = '6px';
      el.innerHTML = `<div class="bar"></div><span class="item-name" style="font-size:12px">Couleur</span>`;
      const strip = document.createElement('div');
      strip.style.cssText = 'display:flex;gap:6px;align-items:center;margin-left:auto;';
      ['red','purple','blue','green'].forEach(c => {
        const dot = document.createElement('div');
        dot.className = 'color-dot ' + c + (currentTheme === c && !twoToneEnabled ? ' active' : '');
        dot.style.cursor = 'pointer';
        dot.addEventListener('click', () => {
          applyTheme(c, false);
          sendToLua({ type:'colorChange', theme:c, twotone:false });
          render();
        });
        strip.appendChild(dot);
      });
      el.appendChild(strip);
      itemsList.appendChild(el);
      continue;
    }
    if (catName === 'Settings' && name === 'Activer Deux Couleurs') {
      makeItem(name, idx === si, null, twoToneEnabled);
      continue;
    }
    const togVal = isTog ? (toggleStates[key] === true) : null;
    makeItem(name, idx === si, isTog ? null : '+', togVal);
  }
}

function makeItem(name, selected, ind, togState) {
  const el = document.createElement('div');
  el.className = 'menu-item' + (selected ? ' sel' : '');
  const bar = document.createElement('div');
  bar.className = 'bar';
  el.appendChild(bar);
  const nm = document.createElement('span');
  nm.className = 'item-name';
  nm.textContent = name;
  el.appendChild(nm);
  if (togState !== null && togState !== undefined) {
    const t = document.createElement('div');
    t.className = 'tog' + (togState ? ' on' : '');
    el.appendChild(t);
  } else if (ind) {
    const s = document.createElement('span');
    s.className = 'item-ind';
    s.textContent = ind;
    el.appendChild(s);
  }
  itemsList.appendChild(el);
}

function setTab(t) {
  tab = t; curCatName = null; selIdx = 0; scrollOff = 0;
  tabMainEl.className = 'tab' + (t === 'main'   ? ' active' : '');
  tabCfgEl.className  = 'tab' + (t === 'config' ? ' active' : '');
  render();
}

// ── LUA BRIDGE ───────────────────────────────────────────────────────
function sendToLua(obj) {
  if (!window.__yariCallback) return;
  try { window.__yariCallback(JSON.stringify(obj)); } catch(_) {}
}

window.addEventListener('message', function(e) {
  let d = e.data;
  if (typeof d === 'string') { try { d = JSON.parse(d); } catch(_) { return; } }
  if (!d || !d.type) return;

  if (d.type === 'showMenu') {
    wrapperEl.classList.add('visible');
    render(); return;
  }
  if (d.type === 'hideMenu') {
    wrapperEl.classList.remove('visible');
    infoPanelEl.classList.remove('visible');
    infoPanelEl.innerHTML = '';
    return;
  }
  if (d.type === 'cycleBanner') { cycleBanner(); return; }

  if (d.type === 'spectatorToggle') {
    document.getElementById('spec-hud').className = d.enabled ? 'visible' : '';
    if (!d.enabled) document.getElementById('spec-hud').innerHTML = '';
    return;
  }

  if (d.type === 'spectatorUpdate') {
    const hud = document.getElementById('spec-hud');
    if (!d.enabled) { hud.className = ''; hud.innerHTML = ''; return; }
    hud.className = 'visible';
    const list = d.list || [];
    let html = `
      <div class="spec-header">
        <div class="spec-dot"></div>
        <span class="spec-count">${list.length}</span>
        <span class="spec-label">SPECTATEURS</span>
      </div>`;
    if (list.length === 0) {
      html += `<div class="spec-empty">Aucun spectateur détecté</div>`;
    } else {
      list.forEach(p => {
        const isNoclip = p.type.includes('Noclip');
        const isAdmin  = p.type.includes('Admin');
        const rowCls   = (isNoclip && isAdmin) ? 'both' : isNoclip ? 'noclip' : 'admin';
        const typeLabel = p.type.replace(/[\[\]]/g, '');
        html += `
          <div class="spec-row ${isNoclip ? 'noclip' : 'admin'}">
            <span class="spec-sid">${p.serverId}</span>
            <span class="spec-name">${escHtml(p.name)}</span>
            <span class="spec-dist">${p.distance}m</span>
            <span class="spec-type ${rowCls}">${typeLabel}</span>
          </div>`;
      });
    }
    hud.innerHTML = html;
    return;
  }

  if (d.type === 'setBanner') {
    const idx = (typeof d.index === 'number') ? d.index : 0;
    bannerIdx = idx;
    bannerImg.src = BANNERS[bannerIdx] || BANNERS[0];
    bannerImg.onerror = () => { bannerImg.src = BANNERS[0]; };
    return;
  }

  if (d.type === 'applyTheme') {
    applyTheme(d.theme || currentTheme, d.twotone === true);
    render(); return;
  }

  if (d.type === 'setToggleStates') {
    if (d.states) Object.assign(toggleStates, d.states);
    if ('Settings_4' in (d.states || {})) {
      twoToneEnabled = d.states['Settings_4'] === true;
      applyTheme(currentTheme, twoToneEnabled);
    }
    render(); return;
  }

  if (d.type === 'sync') {
    if (d.toggles) {
      Object.assign(toggleStates, d.toggles);
      if ('Settings_4' in d.toggles) {
        twoToneEnabled = d.toggles['Settings_4'] === true;
        applyTheme(currentTheme, twoToneEnabled);
      }
    }
    if (d.tab) {
      tab = d.tab;
      tabMainEl.className = 'tab' + (tab === 'main'   ? ' active' : '');
      tabCfgEl.className  = 'tab' + (tab === 'config' ? ' active' : '');
    }
    curCatName = d.curCatName || null;
    if (d.selIdx    !== undefined) { if (curCatName) catSel    = d.selIdx;    else selIdx    = d.selIdx; }
    if (d.scrollOff !== undefined) { if (curCatName) catScroll = d.scrollOff; else scrollOff = d.scrollOff; }
    if ('onlineSubMenu' in d)          onlineSubMenu   = d.onlineSubMenu === false ? null : d.onlineSubMenu;
    if (d.onlineSubSel   !== undefined) onlineSubSel    = d.onlineSubSel;
    if (d.nearbyPlayers  !== undefined) nearbyPlayers   = d.nearbyPlayers;
    if (d.selectedPlayers!== undefined) selectedPlayers = d.selectedPlayers;
    if (d.trollSel       !== undefined) trollSel        = d.trollSel;
    if (d.playerSel      !== undefined) playerSel       = d.playerSel;
    render(); return;
  }
});

render();
</script>
</body>
</html>

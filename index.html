<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YARI MENU</title>
<style>
  /* ── RESET & BASE ───────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --accent:    #DC1E1E;
    --accent-dim:#8C0A0A;
    --bg:        #0A0A0A;
    --bg-item:   #111111;
    --bg-sel:    rgba(220,30,30,0.14);
    --border:    rgba(220,30,30,0.55);
    --text:      #FFFFFF;
    --text-dim:  #B0B0B0;
    --glow:      rgba(220,30,30,0.22);
    --sep:       rgba(50,15,15,0.7);
    --w: 350px;
  }

  body {
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 20px;
    min-height: 100vh;
    font-family: 'Segoe UI', 'Arial', sans-serif;
    overflow-y: auto;
    overflow-x: hidden;
    user-select: none;
  }

  /* ── MENU SHELL ─────────────────────────────────────────────── */
  #menu {
    width: var(--w);
    background: var(--bg);
    border-top:    3px solid var(--accent);
    border-bottom: 3px solid var(--accent);
    display: flex;
    flex-direction: column;
    max-height: 580px;
    box-shadow:
      0 0 18px rgba(220,30,30,.35),
      0 0 40px rgba(220,30,30,.1);
    transition: opacity .12s;
  }

  #menu.hidden { opacity: 0; pointer-events: none; }

  /* ── BANNER ─────────────────────────────────────────────────── */
  #banner {
    height: 90px;
    background:
      linear-gradient(to bottom, rgba(40,5,5,.9) 0%, rgba(10,10,10,1) 100%);
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #banner::before, #banner::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    width: 5px;
    background: rgba(220,30,30,.55);
  }
  #banner::before { left: 0; }
  #banner::after  { right: 0; }

  .banner-title {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 4px;
    color: #fff;
    text-shadow:
      0 0  8px rgba(220,30,30,.9),
      0 0 18px rgba(220,30,30,.5),
      2px 2px 0 rgba(140,10,10,.6);
    line-height: 1;
  }

  .banner-sub {
    font-size: 10px;
    letter-spacing: 5px;
    color: var(--text-dim);
    margin-top: 6px;
    text-transform: uppercase;
  }

  /* ── TABS ───────────────────────────────────────────────────── */
  #tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: 28px;
    border-bottom: 2px solid var(--accent);
    flex-shrink: 0;
  }

  .tab-btn {
    background: #0C0C0C;
    border: none;
    color: var(--text-dim);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    transition: background .1s, color .1s;
  }

  .tab-btn.active {
    background: var(--accent);
    color: #fff;
  }

  .tab-sep {
    width: 1px;
    background: rgba(60,60,60,.7);
  }

  /* ── CATEGORY HEADER ────────────────────────────────────────── */
  #cat-header {
    padding: 4px 14px 3px;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
    border-bottom: 1px solid rgba(60,20,20,.6);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 22px;
  }

  #cat-header .back-arrow {
    color: var(--accent);
    font-size: 14px;
    cursor: pointer;
    line-height: 1;
    flex-shrink: 0;
  }

  #cat-header .back-arrow:hover { opacity: .7; }

  /* ── ITEM LIST ──────────────────────────────────────────────── */
  #item-list {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: none;
  }

  #item-list::-webkit-scrollbar { display: none; }

  .menu-item {
    display: flex;
    align-items: center;
    height: 30px;
    padding: 0 8px 0 14px;
    border-bottom: 1px solid var(--sep);
    cursor: pointer;
    position: relative;
    transition: background .07s;
  }

  .menu-item::before {
    content: '';
    position: absolute;
    left: 0; top: 2px; bottom: 2px;
    width: 3px;
    background: transparent;
    transition: background .07s;
  }

  .menu-item.selected {
    background: var(--bg-sel);
  }

  .menu-item.selected::before {
    background: var(--accent);
  }

  .item-label {
    flex: 1;
    font-size: 12px;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding-left: 16px;
  }

  .item-indicator {
    flex-shrink: 0;
    font-size: 13px;
    color: var(--accent);
    width: 18px;
    text-align: right;
  }

  /* toggle switch */
  .toggle {
    width: 35px;
    height: 14px;
    border-radius: 7px;
    background: #333;
    position: relative;
    flex-shrink: 0;
    transition: background .15s, box-shadow .15s;
  }

  .toggle.on {
    background: var(--accent);
    box-shadow: 0 0 6px rgba(220,30,30,.55);
  }

  .toggle::after {
    content: '';
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #fff;
    top: 2px;
    left: 2px;
    transition: left .15s;
  }

  .toggle.on::after { left: 23px; }

  /* ── FOOTER ─────────────────────────────────────────────────── */
  #footer {
    height: 36px;
    background: #080808;
    border-top: 2px solid var(--accent);
    display: flex;
    align-items: center;
    padding: 0 10px;
    flex-shrink: 0;
    gap: 0;
  }

  .footer-avatar {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: rgba(220,60,60,.8);
    flex-shrink: 0;
  }

  .footer-user {
    font-size: 11px;
    color: #fff;
    margin-left: 6px;
    flex: 1;
  }

  .footer-logo {
    font-size: 13px;
    font-weight: 900;
    color: var(--accent);
    text-shadow: 0 0 6px rgba(220,30,30,.6);
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
  }

  .footer-page {
    font-size: 11px;
    color: var(--accent);
    font-weight: 700;
  }

  /* ── ONLINE SUB-PANEL ───────────────────────────────────────── */
  .online-player-row {
    display: flex;
    align-items: center;
    height: 30px;
    padding: 0 8px 0 14px;
    border-bottom: 1px solid var(--sep);
    cursor: pointer;
    position: relative;
  }

  .online-player-row.selected { background: var(--bg-sel); }
  .online-player-row.selected::before {
    content: ''; position: absolute; left: 0; top: 2px; bottom: 2px;
    width: 4px; background: rgba(220,20,60,.9);
  }

  .player-name { font-size: 11px; color: #CCC; flex: 1; padding-left: 4px; }
  .player-dist { font-size: 10px; color: #888; }

  /* ── WEAPON PANEL ───────────────────────────────────────────── */
  .weapon-cat-nav {
    display: flex;
    align-items: center;
    padding: 6px 8px;
    gap: 6px;
    border-bottom: 1px solid var(--sep);
    flex-shrink: 0;
  }

  .weapon-cat-label {
    flex: 1;
    text-align: center;
    font-size: 11px;
    color: var(--accent);
    font-weight: 700;
  }

  .nav-arrow {
    font-size: 16px;
    color: var(--text-dim);
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
  }
  .nav-arrow:hover { color: var(--accent); }

  /* ── NOTIFICATION TOAST ─────────────────────────────────────── */
  #toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(10,10,10,.92);
    border: 1px solid var(--accent);
    color: #fff;
    font-size: 12px;
    padding: 6px 16px;
    border-radius: 3px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
    white-space: nowrap;
    z-index: 999;
    box-shadow: 0 0 10px rgba(220,30,30,.3);
  }

  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── ONLINE TROLL SECTION ───────────────────────────────────── */
  .troll-row {
    display: flex;
    align-items: center;
    height: 30px;
    padding: 0 8px 0 18px;
    border-bottom: 1px solid var(--sep);
    cursor: pointer;
    position: relative;
  }

  .troll-row.selected { background: var(--bg-sel); }
  .troll-row.selected::before {
    content: ''; position: absolute; left: 0; top: 2px; bottom: 2px;
    width: 4px; background: var(--accent);
  }

  .troll-label { flex: 1; font-size: 12px; color: #CCC; }
  .troll-arrow { color: rgba(220,20,60,.8); font-size: 10px; }

  /* ── INPUT OVERLAY (for Give Weapon by Name, etc.) ──────────── */
  #input-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.65);
    align-items: center;
    justify-content: center;
    z-index: 500;
  }

  #input-overlay.show { display: flex; }

  .input-box {
    background: #111;
    border: 1px solid var(--accent);
    padding: 16px;
    width: 300px;
    box-shadow: 0 0 18px rgba(220,30,30,.35);
  }

  .input-box label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .input-box input {
    width: 100%;
    background: #0A0A0A;
    border: 1px solid var(--border);
    color: #fff;
    font-size: 13px;
    padding: 6px 8px;
    outline: none;
  }

  .input-box input:focus { border-color: var(--accent); }

  .input-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  .input-actions button {
    flex: 1;
    background: var(--accent);
    border: none;
    color: #fff;
    padding: 6px;
    font-size: 12px;
    cursor: pointer;
    font-weight: 700;
  }

  .input-actions button.cancel {
    background: #2A2A2A;
  }

  /* ── VEHICLE SPAWN INPUT ─────────────────────────────────────── */
  #spawn-overlay { display: none; }
  #spawn-overlay.show { display: flex; }

  /* dark theme for @media prefers-color-scheme: nothing needed — always dark */
</style>
</head>
<body>

<!-- ═══════════════ MENU WRAPPER ══════════════════════════════════ -->
<div id="menu">

  <!-- BANNER -->
  <div id="banner">
    <div class="banner-title">YARI MENU</div>
    <div class="banner-sub">YARI MENU</div>
  </div>

  <!-- TABS -->
  <div id="tabs">
    <button class="tab-btn active" id="tab-main" onclick="switchTab('main')">MAIN</button>
    <button class="tab-btn"        id="tab-cfg"  onclick="switchTab('config')">CONFIG</button>
  </div>

  <!-- CATEGORY HEADER -->
  <div id="cat-header" style="display:none;">
    <span class="back-arrow" onclick="goBack()">‹</span>
    <span id="cat-header-label">—</span>
  </div>

  <!-- ITEM LIST -->
  <div id="item-list"></div>

  <!-- FOOTER -->
  <div id="footer" style="position:relative;">
    <div class="footer-avatar"></div>
    <span class="footer-user">Shinto2733</span>
    <span class="footer-logo">Y</span>
    <span class="footer-page" id="footer-page">1 / 12</span>
  </div>

</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- INPUT OVERLAY (Give Weapon by Name / Vehicle Name) -->
<div id="input-overlay">
  <div class="input-box">
    <label id="input-label">Nom :</label>
    <input type="text" id="input-field" />
    <div class="input-actions">
      <button onclick="inputConfirm()">Confirmer</button>
      <button class="cancel" onclick="inputCancel()">Annuler</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════
   MENU DATA  (mirrors menu_structure from Lua)
   ═══════════════════════════════════════════════════════════════ */
const MENU_STRUCTURE = [
  { name: "Player",     items: ["Noclip","God Mode","No Ragdoll","No Collision","Fast Run","Revive","Teleporte To Waypoint","Max Heal","Max Armor","Invisible","Super Jump","Infinite Stamina"] },
  { name: "Online",     items: [] },  // handled specially
  { name: "Weapon",     items: ["Give Weapons","Give Weapon by Name","Remove All Weapons"] },
  { name: "Combat",     items: ["Laser Eye","Fast Punch"] },
  { name: "Vehicle",    items: ["Spawn Véhicule Personnalisé","Porter/Lancer Véhicule","Full Performance","Delete Close Véhicule","Réparer Véhicule","Vehicle God Mode","Shift Boost","Unlock Vehicle","Lock Vehicle"] },
  { name: "Misc",       items: ["Warp to Explode","Warp to Vehicle","Afficher liste spectateurs","Ragdoll Player","Ragdoll All Players","Anti Aim"] },
  { name: "Server",     items: ["Bypass Sunlife","Prime Bypass"] },
  { name: "Settings",   items: ["Auto Load Config"] },
  { name: "Keybind",    items: ["Delete All Keybinds"] },
  { name: "Sunlife/Prime", items: ["Buy Phone/radio"] },
  { name: "Protection", items: ["Anti-teleport","Panic Button"] },
  { name: "Destroyer",  items: ["Delete All Vehicles","Explode All Vehicles","Cage All Players","Bug All Players BMX","Vehicle Chaos"] },
];

const CONFIG_ITEMS = ["Save Config", "Load Config"];

// Keys that are toggles (category → 1-based indices)
const TOGGLE_KEYS = {
  "Player":    [1,2,3,4,5,8,9,10,11,12],
  "Vehicle":   [2,6,7],
  "Misc":      [1,2,3],
  "Combat":    [2],
  "Settings":  [1],
  "Protection":[1],
  "Destroyer": [5],
};

const WEAPON_CATEGORIES = ["Pistol","SMG","Rifle","Shotgun","Sniper","Machine Gun","Melee","Heavy","Throwables","Tools","Stun"];

const TROLL_ACTIONS = [
  "Teleport","Ragdoll","Silent Kill","Stun Player","Spectate",
  "Revive","Smash Attack","Launch Player","Cage Player",
  "Cage Player M2","Stop Cage Player M2","Bug Player BMX",
  "Bug Player Avenger","Block Player Vehicle",
  "Rain Vehicle","Stop Rain Vehicle"
];

/* ═══════════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════════ */
let menuVisible    = false;
let currentTab     = 'main';          // 'main' | 'config'
let currentCat     = null;            // null = root list
let selectedIndex  = 0;

// Online sub-state
let onlineSubMenu  = null;            // null | 'Players' | 'Troll'
let nearbyPlayers  = [];              // [{id, name, dist, serverId}]
let selectedOnlinePlayers = {};       // serverId → true
let selectedPlayerIdx = 0;
let trollSelectedIdx = 0;

// Weapon sub-state
let weaponMenuOpen  = false;
let weaponCatIdx    = 0;
let weaponSelIdx    = 0;

// Toggle state cache (synced from Lua)
let toggleStates = {};

// Input callback
let inputCallback = null;

/* ═══════════════════════════════════════════════════════════════
   BRIDGE: send action to Lua via postMessage (Lapsus.CreateNui)
   ═══════════════════════════════════════════════════════════════ */
function sendToLua(data) {
  // Lapsus NUI bridge – postMessage to parent window
  if (window.invokeNative) {
    window.invokeNative('nuiCallback', JSON.stringify(data));
  } else {
    // FiveM NUI standard: fetch back to game
    fetch(`https://menu_yari/${data.type}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    }).catch(() => {});
    // Also try postMessage for Lapsus NUI
    window.parent.postMessage(data, '*');
  }
}

function execAction(category, index) {
  sendToLua({ type: 'executeAction', category, index });
}

/* ═══════════════════════════════════════════════════════════════
   RECEIVE from Lua
   ═══════════════════════════════════════════════════════════════ */
window.addEventListener('message', function(e) {
  const d = e.data;
  if (!d || !d.type) return;

  switch (d.type) {
    case 'showMenu':
      showMenu();
      break;
    case 'hideMenu':
      hideMenu();
      break;
    case 'toggleMenu':
      menuVisible ? hideMenu() : showMenu();
      break;
    case 'updateToggle':
      // { type, category, index, state }
      const tKey = d.category + '_' + d.index;
      toggleStates[tKey] = d.state;
      renderList();
      break;
    case 'updatePlayers':
      // { type, players: [{id, name, dist, serverId}] }
      nearbyPlayers = d.players || [];
      if (currentCat && currentCat.name === 'Online' && onlineSubMenu === 'Players') {
        renderList();
      }
      break;
    case 'notification':
      showToast(d.message || '');
      break;
    case 'setToggleStates':
      // bulk: { type, states: { 'Player_1': true, ... } }
      toggleStates = Object.assign(toggleStates, d.states || {});
      renderList();
      break;
    case 'inputRequest':
      // { type, label, defaultValue, callback_id }
      showInput(d.label || 'Entrez une valeur', d.defaultValue || '', function(val) {
        sendToLua({ type: 'inputResult', callback_id: d.callback_id, value: val });
      });
      break;
  }
});

/* ═══════════════════════════════════════════════════════════════
   SHOW / HIDE
   ═══════════════════════════════════════════════════════════════ */
function showMenu() {
  menuVisible = true;
  document.getElementById('menu').classList.remove('hidden');
  sendToLua({ type: 'menuOpened' });
  renderList();
}

function hideMenu() {
  menuVisible = false;
  document.getElementById('menu').classList.add('hidden');
  sendToLua({ type: 'menuClosed' });
}

/* ═══════════════════════════════════════════════════════════════
   TAB SWITCH
   ═══════════════════════════════════════════════════════════════ */
function switchTab(tab) {
  currentTab = tab;
  currentCat = null;
  selectedIndex = 0;
  weaponMenuOpen = false;
  onlineSubMenu = null;
  document.getElementById('tab-main').classList.toggle('active', tab === 'main');
  document.getElementById('tab-cfg').classList.toggle('active', tab === 'config');
  renderList();
}

/* ═══════════════════════════════════════════════════════════════
   NAVIGATION
   ═══════════════════════════════════════════════════════════════ */
function goBack() {
  if (weaponMenuOpen) {
    weaponMenuOpen = false;
    renderList();
    return;
  }
  if (onlineSubMenu !== null) {
    onlineSubMenu = null;
    selectedIndex = 0;
    renderList();
    return;
  }
  if (currentCat) {
    currentCat = null;
    selectedIndex = 0;
    renderList();
    return;
  }
}

/* ═══════════════════════════════════════════════════════════════
   RENDER
   ═══════════════════════════════════════════════════════════════ */
function renderList() {
  const list = document.getElementById('item-list');
  const catHeader = document.getElementById('cat-header');
  const catLabel  = document.getElementById('cat-header-label');

  list.innerHTML = '';

  // ── CONFIG tab ───────────────────────────────────────────────
  if (currentTab === 'config' && !currentCat) {
    catHeader.style.display = 'none';
    updateFooterPage('CFG');
    CONFIG_ITEMS.forEach((name, i) => {
      const el = makeItem(name, null, i === selectedIndex);
      el.addEventListener('click', () => handleConfigSelect(i));
      list.appendChild(el);
    });
    return;
  }

  // ── MAIN tab, root ───────────────────────────────────────────
  if (!currentCat) {
    catHeader.style.display = 'none';
    updateFooterPage((selectedIndex + 1) + ' / ' + MENU_STRUCTURE.length);
    MENU_STRUCTURE.forEach((cat, i) => {
      const hasItems = cat.items.length > 0 || cat.name === 'Online';
      const el = makeItem(cat.name, hasItems ? '>' : null, i === selectedIndex);
      el.addEventListener('click', () => openCategory(i));
      list.appendChild(el);
    });
    return;
  }

  // ── CATEGORY open ────────────────────────────────────────────
  catHeader.style.display = 'flex';
  catLabel.textContent = currentCat.name;

  // ONLINE special
  if (currentCat.name === 'Online') {
    renderOnline(list);
    return;
  }

  // WEAPON special
  if (currentCat.name === 'Weapon') {
    renderWeapon(list);
    return;
  }

  // Generic items
  updateFooterPage('');
  currentCat.items.forEach((name, i) => {
    const idx1 = i + 1;
    const isToggle = TOGGLE_KEYS[currentCat.name] && TOGGLE_KEYS[currentCat.name].includes(idx1);
    const key = currentCat.name + '_' + idx1;
    const state = isToggle ? (toggleStates[key] || false) : null;
    const indicator = isToggle ? null : ('+');
    const el = makeItem(name, indicator, i === selectedIndex, state);
    el.addEventListener('click', () => activateItem(i));
    list.appendChild(el);
  });
}

function renderOnline(list) {
  updateFooterPage('');
  if (onlineSubMenu === null) {
    // Root online menu
    ['Players', 'Troll'].forEach((name, i) => {
      const el = makeItem(name, '>', i === selectedIndex);
      el.addEventListener('click', () => openOnlineSubMenu(name));
      list.appendChild(el);
    });
    return;
  }

  if (onlineSubMenu === 'Players') {
    if (nearbyPlayers.length === 0) {
      const el = document.createElement('div');
      el.style.cssText = 'color:#888;font-size:12px;padding:14px 18px;';
      el.textContent = 'Aucun joueur à proximité';
      list.appendChild(el);
      return;
    }
    nearbyPlayers.forEach((p, i) => {
      const row = document.createElement('div');
      row.className = 'online-player-row' + (i === selectedPlayerIdx ? ' selected' : '');
      const isOn = selectedOnlinePlayers[p.serverId] === true;
      row.innerHTML = `
        <span class="player-name">[${p.serverId}] ${p.name}</span>
        <span class="player-dist">${p.dist}m</span>
        <div class="toggle${isOn ? ' on' : ''}" style="margin-left:8px;"></div>
      `;
      row.addEventListener('click', () => toggleOnlinePlayer(p.serverId, i));
      list.appendChild(row);
    });
    return;
  }

  if (onlineSubMenu === 'Troll') {
    const selCount = Object.keys(selectedOnlinePlayers).length;
    if (selCount > 0) {
      const badge = document.createElement('div');
      badge.style.cssText = 'font-size:10px;color:#32C832;padding:3px 14px;border-bottom:1px solid var(--sep);';
      badge.textContent = `● ${selCount} joueur(s) ciblé(s)`;
      list.appendChild(badge);
    }
    TROLL_ACTIONS.forEach((name, i) => {
      const row = document.createElement('div');
      row.className = 'troll-row' + (i === trollSelectedIdx ? ' selected' : '');
      row.innerHTML = `<span class="troll-label">${name}</span><span class="troll-arrow">▶</span>`;
      row.addEventListener('click', () => executeTrollAction(i));
      list.appendChild(row);
    });
  }
}

function renderWeapon(list) {
  updateFooterPage('');
  // Category selector
  const nav = document.createElement('div');
  nav.className = 'weapon-cat-nav';
  nav.innerHTML = `
    <span class="nav-arrow" onclick="weaponCatPrev()">◄</span>
    <span class="weapon-cat-label">${WEAPON_CATEGORIES[weaponCatIdx]}</span>
    <span class="nav-arrow" onclick="weaponCatNext()">►</span>
  `;
  list.appendChild(nav);

  if (!weaponMenuOpen) {
    // Show weapon sub-actions
    currentCat.items.forEach((name, i) => {
      const el = makeItem(name, '+', i === selectedIndex);
      el.addEventListener('click', () => activateItem(i));
      list.appendChild(el);
    });
    return;
  }

  // Weapon list in category — tell Lua via message
  const hint = document.createElement('div');
  hint.style.cssText = 'font-size:10px;color:#888;padding:4px 14px;border-bottom:1px solid var(--sep);text-align:center;';
  hint.textContent = "Cliquer pour donner l\u2019arme";
  list.appendChild(hint);

  sendToLua({ type: 'getWeaponList', category: WEAPON_CATEGORIES[weaponCatIdx] });
}

function makeItem(label, indicator, selected, toggleState) {
  const el = document.createElement('div');
  el.className = 'menu-item' + (selected ? ' selected' : '');
  const indicatorHTML = toggleState !== null && toggleState !== undefined
    ? `<div class="toggle${toggleState ? ' on' : ''}"></div>`
    : (indicator ? `<span class="item-indicator">${indicator}</span>` : '');
  el.innerHTML = `<span class="item-label">${label}</span>${indicatorHTML}`;
  return el;
}

/* ═══════════════════════════════════════════════════════════════
   ACTIONS
   ═══════════════════════════════════════════════════════════════ */
function openCategory(i) {
  const cat = MENU_STRUCTURE[i];
  if (!cat) return;
  if (cat.items.length === 0 && cat.name !== 'Online') {
    showToast('Catégorie vide : ' + cat.name);
    return;
  }
  currentCat = cat;
  selectedIndex = 0;
  weaponMenuOpen = false;
  onlineSubMenu = null;
  renderList();
  sendToLua({ type: 'openCategory', category: cat.name });
}

function openOnlineSubMenu(name) {
  onlineSubMenu = name;
  selectedPlayerIdx = 0;
  trollSelectedIdx = 0;
  renderList();
}

function toggleOnlinePlayer(serverId, idx) {
  selectedPlayerIdx = idx;
  if (selectedOnlinePlayers[serverId]) {
    delete selectedOnlinePlayers[serverId];
  } else {
    selectedOnlinePlayers[serverId] = true;
  }
  sendToLua({ type: 'togglePlayerSelection', serverId, selected: !!selectedOnlinePlayers[serverId] });
  renderList();
}

function executeTrollAction(idx) {
  trollSelectedIdx = idx;
  renderList();
  sendToLua({ type: 'trollAction', actionIndex: idx + 1 });
  showToast('Action : ' + TROLL_ACTIONS[idx]);
}

function activateItem(i) {
  if (!currentCat) return;
  selectedIndex = i;
  const idx1 = i + 1;
  const name = currentCat.items[i];

  // Special: weapon Give Weapons opens weapon browser
  if (currentCat.name === 'Weapon' && idx1 === 1) {
    weaponMenuOpen = true;
    renderList();
    return;
  }

  // Special: Give Weapon by Name — show input
  if (currentCat.name === 'Weapon' && idx1 === 2) {
    showInput('Nom de l\'arme (ex: weapon_pistol)', 'weapon_', function(val) {
      if (val) sendToLua({ type: 'executeAction', category: 'Weapon_ByName', weapon: val });
    });
    return;
  }

  // Special: Spawn Véhicule Personnalisé — show input
  if (currentCat.name === 'Vehicle' && idx1 === 1) {
    showInput('Nom du véhicule (ex: adder)', '', function(val) {
      if (val) sendToLua({ type: 'executeAction', category: 'Vehicle_SpawnCustom', vehicleName: val });
    });
    return;
  }

  renderList();
  execAction(currentCat.name, idx1);
  showToast('Sélectionné : ' + name);
}

function handleConfigSelect(i) {
  selectedIndex = i;
  renderList();
  const actions = ['saveConfig', 'loadConfig'];
  sendToLua({ type: actions[i] });
  showToast(CONFIG_ITEMS[i]);
}

function weaponCatPrev() {
  weaponCatIdx = (weaponCatIdx - 1 + WEAPON_CATEGORIES.length) % WEAPON_CATEGORIES.length;
  weaponSelIdx = 0;
  renderList();
  sendToLua({ type: 'weaponCatChange', catIndex: weaponCatIdx, catName: WEAPON_CATEGORIES[weaponCatIdx] });
}

function weaponCatNext() {
  weaponCatIdx = (weaponCatIdx + 1) % WEAPON_CATEGORIES.length;
  weaponSelIdx = 0;
  renderList();
  sendToLua({ type: 'weaponCatChange', catIndex: weaponCatIdx, catName: WEAPON_CATEGORIES[weaponCatIdx] });
}

/* ═══════════════════════════════════════════════════════════════
   KEYBOARD NAVIGATION
   ═══════════════════════════════════════════════════════════════ */
document.addEventListener('keydown', function(e) {
  if (!menuVisible) return;

  if (document.getElementById('input-overlay').classList.contains('show')) return;

  const key = e.key;

  if (key === 'ArrowUp'   || key === 'Up')   { moveUp();    e.preventDefault(); }
  if (key === 'ArrowDown' || key === 'Down')  { moveDown();  e.preventDefault(); }
  if (key === 'ArrowLeft' || key === 'Left')  { moveLeft();  e.preventDefault(); }
  if (key === 'ArrowRight'|| key === 'Right') { moveRight(); e.preventDefault(); }
  if (key === 'Enter')                         { confirm();   e.preventDefault(); }
  if (key === 'Backspace' || key === 'Escape') { goBack();    e.preventDefault(); }
  if (key === 'PageUp'  || key === 'q' || key === 'Q') { prevPage(); e.preventDefault(); }
  if (key === 'PageDown'|| key === 'e' || key === 'E') { nextPage(); e.preventDefault(); }
});

function currentItemCount() {
  if (!currentCat) {
    return currentTab === 'config' ? CONFIG_ITEMS.length : MENU_STRUCTURE.length;
  }
  if (currentCat.name === 'Online') {
    if (onlineSubMenu === null)      return 2;
    if (onlineSubMenu === 'Players') return Math.max(1, nearbyPlayers.length);
    if (onlineSubMenu === 'Troll')   return TROLL_ACTIONS.length;
  }
  return currentCat.items.length;
}

function moveUp() {
  const n = currentItemCount();
  if (n <= 0) return;
  selectedIndex = (selectedIndex - 1 + n) % n;
  renderList();
  sendToLua({ type: 'navigate', direction: 'up', index: selectedIndex });
}

function moveDown() {
  const n = currentItemCount();
  if (n <= 0) return;
  selectedIndex = (selectedIndex + 1) % n;
  renderList();
  sendToLua({ type: 'navigate', direction: 'down', index: selectedIndex });
}

function moveLeft() {
  if (currentCat && currentCat.name === 'Weapon' && weaponMenuOpen) {
    weaponCatPrev();
  }
}

function moveRight() {
  if (currentCat && currentCat.name === 'Weapon' && weaponMenuOpen) {
    weaponCatNext();
  }
}

function confirm() {
  if (!currentCat) {
    if (currentTab === 'config') { handleConfigSelect(selectedIndex); return; }
    openCategory(selectedIndex);
    return;
  }
  if (currentCat.name === 'Online') {
    if (onlineSubMenu === null) {
      openOnlineSubMenu(['Players','Troll'][selectedIndex]);
      return;
    }
    if (onlineSubMenu === 'Troll') {
      executeTrollAction(selectedIndex);
      return;
    }
    if (onlineSubMenu === 'Players' && nearbyPlayers.length > 0) {
      const p = nearbyPlayers[selectedIndex];
      if (p) toggleOnlinePlayer(p.serverId, selectedIndex);
      return;
    }
    return;
  }
  if (currentCat.name === 'Weapon' && weaponMenuOpen) {
    sendToLua({ type: 'giveWeaponFromList', catName: WEAPON_CATEGORIES[weaponCatIdx], weaponIndex: selectedIndex });
    showToast('Arme sélectionnée');
    return;
  }
  activateItem(selectedIndex);
}

function prevPage() {
  if (currentCat || currentTab === 'config') return;
  selectedIndex = (selectedIndex - 1 + MENU_STRUCTURE.length) % MENU_STRUCTURE.length;
  renderList();
  sendToLua({ type: 'navigate', direction: 'prevPage', index: selectedIndex });
}

function nextPage() {
  if (currentCat || currentTab === 'config') return;
  selectedIndex = (selectedIndex + 1) % MENU_STRUCTURE.length;
  renderList();
  sendToLua({ type: 'navigate', direction: 'nextPage', index: selectedIndex });
}

/* ═══════════════════════════════════════════════════════════════
   FOOTER PAGE COUNTER
   ═══════════════════════════════════════════════════════════════ */
function updateFooterPage(text) {
  document.getElementById('footer-page').textContent = text;
}

/* ═══════════════════════════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════════════════════════ */
let toastTimer = null;
function showToast(msg) {
  // Strip GTA color tags (~g~, ~r~, etc.)
  msg = msg.replace(/~[a-z]~/g, '');
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ═══════════════════════════════════════════════════════════════
   INPUT OVERLAY
   ═══════════════════════════════════════════════════════════════ */
function showInput(label, defaultVal, callback) {
  inputCallback = callback;
  document.getElementById('input-label').textContent = label;
  const field = document.getElementById('input-field');
  field.value = defaultVal || '';
  document.getElementById('input-overlay').classList.add('show');
  setTimeout(() => field.focus(), 50);
}

function inputConfirm() {
  const val = document.getElementById('input-field').value.trim();
  document.getElementById('input-overlay').classList.remove('show');
  if (inputCallback) { inputCallback(val); inputCallback = null; }
}

function inputCancel() {
  document.getElementById('input-overlay').classList.remove('show');
  inputCallback = null;
}

document.getElementById('input-field').addEventListener('keydown', function(e) {
  if (e.key === 'Enter')  { e.preventDefault(); inputConfirm(); }
  if (e.key === 'Escape') { e.preventDefault(); inputCancel();  }
});

/* ═══════════════════════════════════════════════════════════════
   INIT — tell Lua the NUI is ready
   ═══════════════════════════════════════════════════════════════ */
window.addEventListener('load', function() {
  sendToLua({ type: 'nuiReady' });
});

</script>

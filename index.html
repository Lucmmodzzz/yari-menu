<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YARI MENU</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap');

/* ═══════════════════════════════════════════════
   THEME VARIABLES
═══════════════════════════════════════════════ */
:root {
  --accent:      #DC1E1E;
  --accent-glow: #FF3232;
  --accent-dark: #8C0A0A;
  --accent-l:    #DC1E1E;
  --accent-r:    #8B1FDC;
  --bg:          #0A0A0A;
  --bg2:         #0f0f0f;
  --bg3:         #141414;
  --dimmed:      #B0B0B0;
  --sep:         rgba(50,15,15,0.9);
  --radius:      6px;
  --radius-sm:   4px;
}

.theme-red    { --accent:#DC1E1E; --accent-glow:#FF3232; --accent-dark:#8C0A0A; --sep:rgba(50,15,15,0.9); }
.theme-purple { --accent:#8B1FDC; --accent-glow:#AA44FF; --accent-dark:#4A0A8C; --sep:rgba(35,10,50,0.9); }
.theme-blue   { --accent:#1E5ADC; --accent-glow:#3278FF; --accent-dark:#0A2A8C; --sep:rgba(10,20,50,0.9); }
.theme-green  { --accent:#1EDC4A; --accent-glow:#32FF6E; --accent-dark:#0A8C26; --sep:rgba(10,40,20,0.9); }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width:100%; height:100%; background:transparent; overflow:hidden; font-family:'Rajdhani',sans-serif; }

/* ═══════════════════════════════════════════════
   FREECAM HUD
═══════════════════════════════════════════════ */
#freecam-hud {
  position:fixed; top:50%; right:28px; transform:translateY(-50%);
  width:220px;
  background:rgba(8,8,8,0.93);
  border-left:3px solid var(--accent);
  border-top:1px solid rgba(255,255,255,0.06);
  border-bottom:1px solid rgba(255,255,255,0.06);
  box-shadow:-4px 0 24px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03);
  font-family:'Share Tech Mono',monospace;
  z-index:9999; pointer-events:none;
  max-height:70vh; overflow:hidden;
  flex-direction:column; display:none;
}
#freecam-hud.visible { display:flex; }

#fc-center-hud {
  display:none; position:fixed; bottom:32px; left:50%; transform:translateX(-50%);
  text-align:center; z-index:9999; pointer-events:none;
  font-family:'Share Tech Mono',monospace;
}
#fc-center-hud.visible { display:block; }

#fc-center-aimed {
  font-size:11px; letter-spacing:2px; color:#32ff6e; margin-bottom:4px;
  text-shadow:0 0 8px rgba(50,255,110,0.6); min-height:16px;
}
#fc-center-action {
  display:inline-block; padding:4px 18px;
  background:rgba(8,8,8,0.88);
  border:1px solid var(--accent); border-bottom:3px solid var(--accent);
  box-shadow:0 0 12px rgba(0,0,0,0.5), 0 0 8px var(--accent-glow);
  font-size:12px; font-weight:700; letter-spacing:3px; color:#fff; text-transform:uppercase;
}

.fc-header { padding:8px 12px 6px; background:rgba(15,5,5,0.99); border-bottom:1px solid rgba(255,255,255,0.07); flex-shrink:0; }
.fc-title-row { display:flex; align-items:center; gap:8px; font-family:'Rajdhani',sans-serif; font-size:13px; font-weight:700; letter-spacing:3px; color:#fff; }
.fc-dot { width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 7px var(--accent-glow); animation:blink 1s ease-in-out infinite; flex-shrink:0; }
.fc-aimed-row { margin-top:5px; font-size:10px; letter-spacing:1.5px; color:rgba(180,180,180,0.5); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fc-aimed-row.locked { color:#32ff6e; }
.fc-list { overflow:hidden; flex:1; display:flex; flex-direction:column; padding:4px 0; }
.fc-item { display:flex; align-items:center; gap:8px; padding:0 10px 0 12px; height:32px; flex-shrink:0; border-left:3px solid transparent; border-bottom:1px solid rgba(255,255,255,0.04); transition:background 0.08s; position:relative; }
.fc-item:last-child { border-bottom:none; }
.fc-item.active { background:rgba(220,30,30,0.1); border-left-color:var(--accent); }
.fc-item.active .fc-item-name { color:#fff; font-weight:700; }
.fc-item-idx { font-size:9px; color:rgba(160,160,160,0.35); min-width:16px; flex-shrink:0; }
.fc-item-name { flex:1; font-size:11px; letter-spacing:1px; color:rgba(200,200,200,0.65); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fc-item.dimmed .fc-item-name { color:rgba(130,130,130,0.35); }
.fc-item-exec { font-size:9px; color:var(--accent); opacity:0; letter-spacing:1px; flex-shrink:0; }
.fc-item.active .fc-item-exec { opacity:1; }
.fc-scrollbar { position:absolute; right:3px; top:0; bottom:0; width:2px; background:rgba(255,255,255,0.05); border-radius:1px; }
.fc-scrollbar-thumb { position:absolute; width:100%; border-radius:1px; background:var(--accent); opacity:0.5; transition:top 0.1s, height 0.1s; }
.fc-footer { padding:4px 12px 5px; font-size:9px; letter-spacing:1px; color:rgba(130,130,130,0.45); border-top:1px solid rgba(255,255,255,0.05); flex-shrink:0; display:flex; gap:12px; flex-wrap:wrap; }
.fc-footer span { color:var(--accent); }

/* ═══════════════════════════════════════════════
   PLAYER PANEL
═══════════════════════════════════════════════ */
#player-panel {
  display:none; position:fixed; top:150px; left:560px; width:260px;
  border-top:3px solid var(--accent); border-bottom:3px solid var(--accent);
  border-left:1px solid rgba(255,255,255,0.06);
  background:var(--bg); box-shadow:0 0 22px rgba(0,0,0,0.55);
  font-family:'Share Tech Mono',monospace; z-index:9998; pointer-events:none;
  border-radius:0 var(--radius) var(--radius) 0;
}
#player-panel.visible { display:block; }
.pp-header { position:relative; overflow:hidden; display:flex; align-items:center; gap:12px; height:84px; background:transparent; border-bottom:1px solid rgba(255,255,255,0.07); }
.pp-avatar { flex-shrink:0; width:64px; height:64px; margin-left:10px; box-sizing:border-box; border:2px solid var(--accent); border-radius:var(--radius); background:transparent; box-shadow:0 0 0 300px var(--bg), 0 0 12px var(--accent-glow); }
.pp-id { position:relative; display:flex; flex-direction:column; gap:3px; min-width:0; }
.pp-name { font-family:'Rajdhani',sans-serif; font-size:17px; font-weight:700; letter-spacing:1.5px; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-shadow:0 0 10px var(--accent-glow); }
.pp-sid  { font-size:10px; letter-spacing:2px; color:var(--accent); }
.pp-bar-wrap { padding:8px 12px 6px; }
.pp-bar-row  { display:flex; align-items:center; gap:8px; margin-bottom:7px; }
.pp-bar-ico  { width:14px; height:14px; flex-shrink:0; color:var(--accent); }
.pp-bar-track { flex:1; height:7px; background:rgba(255,255,255,0.07); border-radius:4px; overflow:hidden; }
.pp-bar-fill  { height:100%; border-radius:4px; transition:width .3s ease; }
.pp-bar-fill.health { background:linear-gradient(90deg,#1edc4a,#32ff6e); box-shadow:0 0 8px rgba(50,255,110,.45); }
.pp-bar-fill.health.mid { background:linear-gradient(90deg,#dc8c1e,#ffaa32); box-shadow:0 0 8px rgba(255,170,50,.45); }
.pp-bar-fill.health.low { background:linear-gradient(90deg,#dc1e1e,#ff3232); box-shadow:0 0 8px rgba(255,50,50,.5); }
.pp-bar-fill.armor  { background:linear-gradient(90deg,#1e5adc,#3278ff); box-shadow:0 0 8px rgba(50,120,255,.45); }
.pp-bar-pct { font-size:10px; color:#e8e8e8; min-width:34px; text-align:right; }
.pp-section { padding:4px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
.pp-section:last-child { border-bottom:none; }
.pp-row { display:flex; align-items:center; gap:9px; padding:4px 12px; min-height:26px; }
.pp-icon { width:22px; height:22px; flex-shrink:0; display:flex; align-items:center; justify-content:center; border-radius:5px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.06); color:var(--accent); }
.pp-icon svg { width:13px; height:13px; }
.pp-label { font-size:10px; letter-spacing:1.5px; color:rgba(180,180,180,0.6); min-width:64px; }
.pp-value { flex:1; font-size:11px; color:#e8e8e8; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-transform:uppercase; }
.pp-value.danger { color:#ff4444; }
.pp-value.warn   { color:#ff9900; }
.pp-value.ok     { color:#32ff6e; }
.pp-coords { padding:6px 12px 8px; font-size:9px; letter-spacing:1px; color:rgba(160,160,160,0.65); border-top:1px solid rgba(255,255,255,0.05); text-align:center; }

/* ═══════════════════════════════════════════════
   SPEC HUD
═══════════════════════════════════════════════ */
#spec-hud { display:none; position:fixed; top:40px; left:18px; width:260px; font-family:'Share Tech Mono',monospace; z-index:9999; pointer-events:none; }
#spec-hud.visible { display:block; }
.spec-header { display:flex; align-items:center; gap:8px; padding:3px 10px; background:rgba(0,0,0,0.82); border-left:3px solid var(--accent); border-bottom:1px solid rgba(255,255,255,0.06); }
.spec-header .spec-dot { width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 6px var(--accent-glow); animation:blink 1.2s ease-in-out infinite; }
.spec-header .spec-count { font-size:11px; color:var(--accent); letter-spacing:1px; font-weight:700; }
.spec-header .spec-label { font-size:10px; color:rgba(200,200,200,0.55); letter-spacing:2px; margin-left:auto; }
.spec-row { display:flex; align-items:baseline; gap:6px; padding:3px 10px 3px 13px; background:rgba(0,0,0,0.72); border-left:3px solid transparent; border-bottom:1px solid rgba(255,255,255,0.04); }
.spec-row.noclip { border-left-color:var(--accent); }
.spec-row.admin  { border-left-color:#dcaa1e; }
.spec-sid  { font-size:10px; color:var(--accent); min-width:26px; }
.spec-name { font-size:11px; color:#e8e8e8; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.spec-dist { font-size:10px; color:rgba(180,180,180,0.6); white-space:nowrap; }
.spec-type { font-size:9px; letter-spacing:1px; padding:1px 4px; border-radius:2px; white-space:nowrap; }
.spec-type.noclip { color:var(--accent); background:rgba(220,30,30,0.15); }
.spec-type.admin  { color:#dcaa1e; background:rgba(220,170,30,0.12); }
.spec-type.both   { color:#ff9900; background:rgba(255,153,0,0.13); }
.spec-empty { padding:5px 13px; font-size:10px; color:rgba(180,180,180,0.4); background:rgba(0,0,0,0.72); border-left:3px solid transparent; letter-spacing:1px; }

/* ═══════════════════════════════════════════════
   KEYBIND HUD
═══════════════════════════════════════════════ */
#kb-hud {
  display:none; position:fixed; bottom:24px; right:24px; width:250px;
  background:var(--bg); border-top:3px solid var(--accent); border-bottom:3px solid var(--accent);
  box-shadow:0 0 20px rgba(0,0,0,0.45);
  font-family:'Share Tech Mono',monospace; z-index:9999; pointer-events:none;
  border-radius:var(--radius);
}
#kb-hud.visible { display:block; }
.kb-title { display:flex; align-items:center; gap:8px; padding:6px 12px; background:rgba(20,5,5,0.95); border-bottom:1px solid rgba(255,255,255,0.07); font-family:'Rajdhani',sans-serif; font-size:13px; font-weight:700; letter-spacing:3px; color:#fff; }
.kb-title .kb-dot { width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 6px var(--accent-glow); }
.kb-row { display:flex; align-items:center; gap:6px; padding:4px 12px; border-bottom:1px solid var(--sep); }
.kb-row:last-child { border-bottom:none; }
.kb-name { flex:1; font-size:11px; color:rgba(255,255,255,0.85); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.kb-sep  { color:rgba(180,180,180,0.4); font-size:11px; }
.kb-key  { font-size:11px; font-weight:700; color:var(--accent); white-space:nowrap; }
.kb-ind  { width:10px; height:3px; border-radius:2px; background:rgba(255,255,255,0.12); flex-shrink:0; }
.kb-ind.on  { background:#32ff6e; box-shadow:0 0 5px #32ff6e; }
.kb-ind.off { background:#ff3232; box-shadow:0 0 5px #ff3232; }
.kb-empty { padding:8px 12px; font-size:10px; letter-spacing:1px; color:rgba(180,180,180,0.4); }

/* ═══════════════════════════════════════════════
   ANIMATIONS
═══════════════════════════════════════════════ */
@keyframes blink { 0%,100%{opacity:1}50%{opacity:0.3} }
@keyframes slideIn { from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)} }

/* ═══════════════════════════════════════════════
   MAIN APP SHELL  (Synaps-proportioned)
═══════════════════════════════════════════════ */
#app {
  position:fixed; top:150px; left:200px; width:360px;
  display:none; flex-direction:column;
  background:var(--bg);
  border-radius:var(--radius);
  overflow:hidden;
  border-top:3px solid var(--accent);
  border-bottom:3px solid var(--accent);
  box-shadow:0 8px 40px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
  user-select:none;
  transition:border-color 0.25s, box-shadow 0.25s;
}
#app.twotone { border-top:none; border-bottom:none; }
#top-border, #bot-border {
  display:none; height:3px; flex-shrink:0; width:100%;
  background:linear-gradient(90deg, var(--accent-l) 0%, var(--accent-l) 38%, var(--accent-r) 62%, var(--accent-r) 100%);
}
#app.twotone #top-border,
#app.twotone #bot-border { display:block; }

/* ── BANNER ── */
#banner {
  position:relative; height:96px; flex-shrink:0; overflow:hidden;
  background:linear-gradient(180deg,rgba(40,5,5,0.95) 0%,rgba(10,10,10,1) 100%);
  display:flex; align-items:center; justify-content:center; flex-direction:column; gap:5px;
}
#banner img { width:100%; height:96px; object-fit:cover; object-position:center; display:block; }
#banner::before {
  content:''; position:absolute; left:0; top:0; bottom:0; width:4px;
  background:linear-gradient(180deg,var(--accent-l),var(--accent-dark));
  transition:background 0.25s; z-index:1;
}
#banner::after {
  content:''; position:absolute; right:0; top:0; bottom:0; width:4px;
  background:linear-gradient(180deg,var(--accent-r),var(--accent-dark));
  opacity:0.7; transition:background 0.25s; z-index:1;
}
#app:not(.twotone) #banner::before { background:linear-gradient(180deg,var(--accent),var(--accent-dark)); }
#app:not(.twotone) #banner::after  { background:linear-gradient(180deg,var(--accent),var(--accent-dark)); opacity:0.7; }

.banner-main { font-size:30px; font-weight:700; letter-spacing:6px; color:#fff; text-shadow:0 0 14px var(--accent-glow),0 0 30px rgba(220,30,30,0.45),2px 2px 0 rgba(140,10,10,0.5); }
.banner-sub  { font-size:10px; letter-spacing:3px; color:var(--dimmed); font-family:'Share Tech Mono',monospace; }

#subbanner {
  height:18px; flex-shrink:0; background:rgba(5,5,5,0.98);
  display:flex; align-items:center; justify-content:center;
  font-size:9px; letter-spacing:3px; color:rgba(200,200,200,0.6);
  font-family:'Share Tech Mono',monospace;
  border-top:1px solid rgba(30,5,5,0.7);
}

/* ── TABS (top-level MAIN / CONFIG) ── */
#tabs {
  height:32px; flex-shrink:0; display:flex;
  border-bottom:2px solid var(--accent);
  transition:border-color 0.25s;
  background:var(--bg3);
}
#app.twotone #tabs { border-bottom:none; position:relative; }
#app.twotone #tabs::after {
  content:''; position:absolute; bottom:0; left:0; right:0; height:2px;
  background:linear-gradient(90deg, var(--accent-l) 0%, var(--accent-l) 38%, var(--accent-r) 62%, var(--accent-r) 100%);
}

.tab {
  flex:1; display:flex; align-items:center; justify-content:center; gap:5px;
  font-size:11px; font-weight:700; letter-spacing:2px; color:rgba(180,180,180,0.5);
  background:transparent; border-right:1px solid rgba(255,255,255,0.05);
  transition:color 0.15s, background 0.15s; position:relative;
}
.tab:last-child { border-right:none; }
.tab.active { color:#fff; }
.tab.active::after {
  content:''; position:absolute; bottom:-2px; left:8px; right:8px; height:2px;
  background:var(--accent); border-radius:2px 2px 0 0;
  box-shadow:0 0 6px var(--accent-glow);
}
#app.twotone .tab.active::after { background:linear-gradient(90deg,var(--accent-l),var(--accent-r)); }

/* ── SUB-TABS ── */
#sub-tabs {
  display:none; height:28px; flex-shrink:0;
  background:var(--bg2);
  border-bottom:1px solid rgba(255,255,255,0.06);
  flex-direction:row;
}
#sub-tabs.show { display:flex; }
.sub-tab {
  flex:1; display:flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:700; letter-spacing:2px; color:rgba(160,160,160,0.4);
  background:transparent; border-right:1px solid rgba(255,255,255,0.04);
  font-family:'Share Tech Mono',monospace; position:relative; transition:color 0.15s;
}
.sub-tab:last-child { border-right:none; }
.sub-tab.active { color:var(--accent); }
.sub-tab.active::after {
  content:''; position:absolute; bottom:0; left:6px; right:6px; height:2px;
  background:var(--accent); border-radius:2px 2px 0 0;
}
#app.twotone .sub-tab.active { color:var(--accent-l); }
#app.twotone .sub-tab.active::after { background:var(--accent-l); }

/* ── CAT HEADER ── */
#cat-header {
  padding:5px 14px 5px 14px;
  font-size:9px; letter-spacing:2.5px; color:rgba(180,180,180,0.5);
  font-family:'Share Tech Mono',monospace;
  background:rgba(8,8,8,0.95);
  border-bottom:1px solid rgba(255,255,255,0.05);
  flex-shrink:0; display:none;
  text-transform:uppercase;
}
#cat-header.show { display:flex; align-items:center; gap:6px; }
#cat-header::before {
  content:''; width:3px; height:3px; border-radius:50%;
  background:var(--accent); flex-shrink:0; opacity:0.8;
}

/* ── ITEMS LIST ── */
#items-list { flex-shrink:0; animation:slideIn 0.1s ease; }

/* ── MENU ITEM (Synaps-style: icon-accent-dot + clean row) ── */
.menu-item {
  height:34px; display:flex; align-items:center;
  padding:0 14px 0 0; position:relative;
  border-bottom:1px solid rgba(255,255,255,0.04);
  transition:background 0.08s;
}
.menu-item:last-child { border-bottom:none; }

/* left accent bar */
.menu-item .bar {
  width:3px; height:100%; flex-shrink:0; margin-right:12px;
  background:transparent; transition:background 0.15s, box-shadow 0.15s;
}
.menu-item.sel .bar {
  background:var(--accent);
  box-shadow:0 0 8px var(--accent-glow);
}
.menu-item.sel { background:rgba(255,255,255,0.03); }

.item-name {
  flex:1; font-size:13px; font-weight:500;
  color:rgba(220,220,220,0.8); letter-spacing:0.3px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.menu-item.sel .item-name { color:#fff; font-weight:600; }
.menu-item.dimmed .item-name { color:rgba(130,130,130,0.35); }

.item-ind { font-size:13px; font-weight:700; color:var(--accent); margin-left:6px; flex-shrink:0; }

.item-chev {
  width:16px; height:16px; margin-left:6px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  color:rgba(160,160,160,0.4); transition:color 0.12s, transform 0.12s;
}
.item-chev svg { width:16px; height:16px; }
.menu-item.sel .item-chev { color:var(--accent); transform:translateX(2px); }
#app.twotone .menu-item.sel .bar { background:linear-gradient(180deg,var(--accent-l),var(--accent-r)); box-shadow:0 0 8px var(--accent-l); }
#app.twotone .item-ind { color:var(--accent-r); }
#app.twotone .menu-item.sel .item-chev { color:var(--accent-r); }

/* ── TOGGLE ── */
.tog {
  width:36px; height:16px; border-radius:8px;
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.08);
  position:relative; flex-shrink:0;
  transition:background 0.15s, border-color 0.15s;
}
.tog.on { background:var(--accent); border-color:var(--accent); box-shadow:0 0 8px var(--accent-glow); }
#app.twotone .tog.on { background:linear-gradient(90deg,var(--accent-l),var(--accent-r)); border-color:var(--accent-l); box-shadow:0 0 8px var(--accent-l); }
.tog::after {
  content:''; position:absolute; top:2px; left:2px;
  width:10px; height:10px; border-radius:50%; background:#fff;

const THEMES = {
  red:    {accent:'#DC1E1E',glow:'#FF3232',dark:'#8C0A0A',sep:'rgba(50,15,15,0.9)'},
  purple: {accent:'#8B1FDC',glow:'#AA44FF',dark:'#4A0A8C',sep:'rgba(35,10,50,0.9)'},
  blue:   {accent:'#1E5ADC',glow:'#3278FF',dark:'#0A2A8C',sep:'rgba(10,20,50,0.9)'},
  green:  {accent:'#1EDC4A',glow:'#32FF6E',dark:'#0A8C26',sep:'rgba(10,40,20,0.9)'},
};
const TWOTONE_LEFT  = '#DC1E1E';
const TWOTONE_RIGHT = '#8B1FDC';
let currentTheme   = 'red';
let twoToneEnabled = false;
const appEl = document.getElementById('app');
const root  = document.documentElement;

function applyTheme(name, twotone) {
  currentTheme   = name;
  twoToneEnabled = twotone;
  appEl.classList.remove('theme-red','theme-purple','theme-blue','theme-green','twotone');
  if (twotone) {
    appEl.classList.add('twotone');
    root.style.setProperty('--accent-l',    TWOTONE_LEFT);
    root.style.setProperty('--accent-r',    TWOTONE_RIGHT);
    root.style.setProperty('--accent',       TWOTONE_LEFT);
    root.style.setProperty('--accent-glow',  '#FF3232');
    root.style.setProperty('--accent-dark',  '#8C0A0A');
    root.style.setProperty('--sep',          'rgba(50,10,40,0.9)');
  } else {
    appEl.classList.add('theme-'+name);
    const t = THEMES[name];
    root.style.setProperty('--accent',       t.accent);
    root.style.setProperty('--accent-glow',  t.glow);
    root.style.setProperty('--accent-dark',  t.dark);
    root.style.setProperty('--sep',          t.sep);
    root.style.setProperty('--accent-l',     t.accent);
    root.style.setProperty('--accent-r',     t.accent);
  }
}

function updatePlayerPanel(player) {
  if (!player) { playerPanel.classList.remove('visible'); return; }
  playerPanel.classList.add('visible');
  document.getElementById('pp-name').textContent = player.name || '—';
  document.getElementById('pp-sid').textContent  = '#'+(player.serverId||'—');
  const hp = Math.max(0,Math.min(100,player.health??100));
  const hpBar = document.getElementById('pp-hp-bar');
  hpBar.style.width = hp+'%';
  hpBar.className = 'pp-bar-fill health'+(hp<30?' low':hp<60?' mid':'');
  document.getElementById('pp-hp-pct').textContent = hp+'%';
  const arm = Math.max(0,Math.min(100,player.armor??0));
  document.getElementById('pp-arm-bar').style.width = arm+'%';
  document.getElementById('pp-arm-pct').textContent = arm+'%';
  document.getElementById('pp-dist').textContent = (player.distance??'—')+'m';
  const veh = document.getElementById('pp-veh');
  veh.textContent  = player.vehicle||'on foot';
  veh.className    = 'pp-value'+(player.vehicle&&player.vehicle!=='on foot'?' warn':'');
  document.getElementById('pp-spd').textContent = (player.speed??'—')+' km/h';
  const wpn = document.getElementById('pp-wpn');
  wpn.textContent  = (player.weapon||'unarmed').replace('weapon_','').replace(/_/g,' ');
  wpn.className    = 'pp-value'+(player.weapon&&player.weapon!=='weapon_unarmed'?' danger':'');
  const inv = document.getElementById('pp-inv');
  inv.textContent  = player.invisible?'yes':'no';
  inv.className    = 'pp-value'+(player.invisible?' danger':' ok');
  document.getElementById('pp-job').textContent   = player.job||'—';
  document.getElementById('pp-radio').textContent = player.radio||'None';
  if (player.coords) {
    document.getElementById('pp-coords').textContent = 'X '+Math.floor(player.coords.x)+'  Y '+Math.floor(player.coords.y)+'  Z '+Math.floor(player.coords.z);
  } else {
    document.getElementById('pp-coords').textContent = 'X —  Y —  Z —';
  }
}

// RENDER SUB-TABS BAR
// ─────────────────────────────────────────────────────────
function renderSubTabs(cat) {
  if (!cat || cat.subTabs.length <= 1) {
    subTabsEl.innerHTML = ''; subTabsEl.className = ''; return;
  }
  subTabsEl.className = 'show';
  subTabsEl.innerHTML = '';
  cat.subTabs.forEach((st, i) => {
    const el = document.createElement('div');
    el.className = 'sub-tab'+(i===subTabIdx?' active':'');
    el.textContent = st.name;
    subTabsEl.appendChild(el);
  });
}

// ─────────────────────────────────────────────────────────
// MAIN RENDER ROUTER
// ─────────────────────────────────────────────────────────
function render() {
  itemsList.innerHTML = '';
  if (tab === 'config') { subTabsEl.innerHTML=''; subTabsEl.className=''; catHeader.className=''; renderConfigList(); return; }
  if (curCatIdx === null) { subTabsEl.innerHTML=''; subTabsEl.className=''; catHeader.className=''; renderCategoryRoot(); return; }
  const cat = CAT_STRUCTURE[curCatIdx];
  renderSubTabs(cat);
  if (cat.name === 'Vehicle' && subTabIdx === 3) {
    catHeader.textContent = 'VEHICLE › RADAR'; catHeader.className='show';
    if (!radarMode) renderRadarList(); else renderRadarActions(); return;
  }
  if (cat.special === 'online') { renderOnline(cat); return; }
  if (cat.special === 'search') { renderSearch(cat); return; }
  if (cat.name === 'Weapon' && weaponMenuOpen) {
    catHeader.textContent = '← '+(WEAPON_CAT_ORDER[weaponCatIdx]||'Pistol').toUpperCase()+' → ('+(weaponCatIdx+1)+'/'+WEAPON_CAT_ORDER.length+')';
    catHeader.className = 'show';
    renderWeaponList(); return;
  }
  const stab = cat.subTabs[subTabIdx];
  catHeader.textContent = cat.name.toUpperCase()+' › '+(stab?stab.name:'');
  catHeader.className = 'show';
  if (stab) renderItemList(stab.items, cat.name);
}

function renderCategoryRoot() {
  for (let i=0; i<MAX_VIS; i++) {
    const idx = i+scrollOff;
    if (idx>=CAT_STRUCTURE.length) break;
    makeItem(CAT_STRUCTURE[idx].name, idx===selIdx, '›', null);
  }
}

function renderConfigList() {
  CONFIG_ITEMS.forEach((name,i) => makeItem(name, i===selIdx, '+', null));
}

// WARDROBE RENDERER — Synaps-style
// ─────────────────────────────────────────────────────────
function renderWardrobe() {
  catHeader.textContent = 'PLAYER › WARDROBE'; catHeader.className='show';
  if (wardrobeMode==='save'||wardrobeMode==='load') { renderWardrobeSlots(); return; }

  const def  = WARDROBE_CATS[wardrobeCatIdx];
  const rows = [
    {type:'category'},
    {type:'drawable'},
    {type:'texture'},
    {type:'save'},
    {type:'load'},
    {type:'localped'},
  ];
  if (def && def.type==='prop') rows.push({type:'removeprop'});

  for (let i=0; i<MAX_VIS; i++) {
    const idx  = i+itemScrollOff;
    if (idx>=rows.length) break;
    const row  = rows[idx];
    const isSel = idx===itemSelIdx;

    if (row.type==='category') {
      // ── Category selector ──────────────────────────────
      const el = document.createElement('div');
      el.className = 'wd-cat-row'+(isSel?' sel':'');
      const bar = document.createElement('div'); bar.className='bar'; el.appendChild(bar);
      const nm = document.createElement('span'); nm.className='wd-cat-name'; nm.textContent=(def?def.label:'—'); el.appendChild(nm);
      const badge = document.createElement('span'); badge.className='wd-cat-badge'; badge.textContent=(def&&def.type==='prop'?'PROP':'COMP'); el.appendChild(badge);
      const cnt = document.createElement('span'); cnt.className='wd-cat-counter'; cnt.textContent=(wardrobeCatIdx+1)+'/'+WARDROBE_CATS.length; el.appendChild(cnt);
      const arr = document.createElement('span'); arr.className='wd-cat-arrows'; arr.textContent='← →'; el.appendChild(arr);
      itemsList.appendChild(el);

    } else if (row.type==='drawable'||row.type==='texture') {
      // ── Synaps-style slider ────────────────────────────
      const isDraw = row.type==='drawable';
      const val    = isDraw?wardrobeDrawIdx:wardrobeTexIdx;
      const maxVal = isDraw?wardrobeMaxDraw:wardrobeMaxTex;
      const pct    = maxVal>0?Math.min(100,(val/maxVal)*100):0;
      const thumbPct = pct;
      const label  = isDraw?'DRAWABLE':'TEXTURE';

      const el = document.createElement('div');
      el.className = 'wd-slider-row'+(isSel?' sel':'');

      const bar = document.createElement('div'); bar.className='bar'; el.appendChild(bar);

      const hdr = document.createElement('div'); hdr.className='wd-sl-header';
      const lbl = document.createElement('span'); lbl.className='wd-sl-label'; lbl.textContent=label; hdr.appendChild(lbl);
      const valEl = document.createElement('span'); valEl.className='wd-sl-value'; valEl.textContent=val+' / '+maxVal; hdr.appendChild(valEl);
      el.appendChild(hdr);

      const tw = document.createElement('div'); tw.className='wd-sl-track-wrap';
      const tr = document.createElement('div'); tr.className='wd-sl-track';
      const fill = document.createElement('div'); fill.className='wd-sl-fill'; fill.style.width=pct+'%';
      const thumb = document.createElement('div'); thumb.className='wd-sl-thumb'; thumb.style.left=thumbPct+'%';
      tr.appendChild(fill); tr.appendChild(thumb);
      tw.appendChild(tr); el.appendChild(tw);

      if (isSel) {
        const hint = document.createElement('div'); hint.className='wd-sl-hint'; hint.textContent='← → AJUSTER';
        el.appendChild(hint);
      }
      itemsList.appendChild(el);

    } else if (row.type==='save') {
      const el = document.createElement('div'); el.className='wd-action-row'+(isSel?' sel':'');
      const bar = document.createElement('div'); bar.className='bar'; el.appendChild(bar);
      const nm = document.createElement('span'); nm.className='wd-action-name'; nm.textContent='Save Outfit'; el.appendChild(nm);
      const ind = document.createElement('span'); ind.className='wd-action-ind'; ind.style.color='#32ff6e'; ind.textContent='+'; el.appendChild(ind);
      itemsList.appendChild(el);

    } else if (row.type==='load') {
      const el = document.createElement('div'); el.className='wd-action-row'+(isSel?' sel':'');
      const bar = document.createElement('div'); bar.className='bar'; el.appendChild(bar);
      const nm = document.createElement('span'); nm.className='wd-action-name'; nm.textContent='Load Outfit'; el.appendChild(nm);
      const ind = document.createElement('span'); ind.className='wd-action-ind'; ind.style.color='#3278ff'; ind.textContent='+'; el.appendChild(ind);
      itemsList.appendChild(el);

    } else if (row.type==='localped') {
      // ── Local Ped — Synaps pill selector ──────────────
      const names    = Array.isArray(localPedNames)?localPedNames:Object.values(localPedNames||{});
      const total    = names.length+1;
      const labelOf  = i => i===0?'OFF (NORMAL)':(names[i-1]||'?').toUpperCase();
      const appliedTxt = localPedApplied===0?'OFF':(names[localPedApplied-1]||'?').toUpperCase();

function renderItemList(items, catName) {
  if (!items||items.length===0) { makeItem('Aucun élément',false,null,null); return; }

  for (let i=0; i<MAX_VIS; i++) {

    const isSel = idx===itemSelIdx;

    // ── FOV Slider ─────────────────────────────────────────
    if (name==='FOV Slider') {
      const fov = window._aimbotFOV||30;
      const pct = ((fov-5)/(180-5))*100;
      el_vehSlider(name,isSel,'FOV',fov+'°',pct,'Combat',5,null,null);

    }

    if (name==='Slide Speed') {

      el_vehSlider(name,isSel,'SLIDE SPEED',spd+' m/s',pct,'Player',16,null,null);

    if (name==='Speed Multiplier') {

      continue;
    }
    if (name==='Brake Multiplier') {

      el_vehSlider(name,isSel,'BRAKE',val.toFixed(2)+'x',pct,'Vehicle',13,'↵ TOGGLE   ← → (0.1×→5.0×)',toggleStates['Vehicle_13']);
      continue;
    }
    if (name==='Turn Multiplier') {
      const val = window._vehicleTurnMult||1.0;
      const pct = ((val-0.1)/(3.0-0.1))*100;
      el_vehSlider(name,isSel,'TURN',val.toFixed(2)+'x',pct,'Vehicle',14,'↵ TOGGLE   ← → (0.1×→3.0×)',toggleStates['Vehicle_14']);
      continue;
    }

      el_vehSlider(name,isSel,'VEHICLE SPIN',val.toFixed(1)+'°/f',pct,'Vehicle',16,'↵ TOGGLE   ← → VITESSE (1→60)',toggleStates['Vehicle_16']);
      continue;

function sendToLua(obj) {
  if (!window.__yariCallback) return;
  try { window.__yariCallback(JSON.stringify(obj)); } catch(_) {}
}

// ─────────────────────────────────────────────────────────
// MESSAGE HANDLER
// ─────────────────────────────────────────────────────────
window.addEventListener('message', function(e) {
  let d=e.data;
  if (typeof d==='string') { try{d=JSON.parse(d);}catch(_){return;} }
  if (!d||!d.type) return;

  if (d.type==='showMenu') { appEl.style.display='flex'; render(); return; }
  if (d.type==='hideMenu') { appEl.style.display='none'; playerPanel.classList.remove('visible'); return; }

  if (d.type==='spectatorToggle') {
    document.getElementById('spec-hud').className=d.enabled?'visible':'';
    if (!d.enabled) document.getElementById('spec-hud').innerHTML='';
    return;
  }

  if (d.type==='freecam') {
    const hud=document.getElementById('freecam-hud');
    const centerHud=document.getElementById('fc-center-hud');
    if (!d.enabled) { hud.className=''; centerHud.className=''; return; }
    hud.classList.add('visible'); centerHud.classList.add('visible');
    const aimedEl=document.getElementById('fc-aimed'); const centerAimed=document.getElementById('fc-center-aimed');
    if (d.aimedPlayer) { aimedEl.textContent='● '+d.aimedPlayer; aimedEl.className='fc-aimed-row locked'; centerAimed.textContent='⊕ '+d.aimedPlayer; }
    else { aimedEl.textContent='— aucun joueur visé —'; aimedEl.className='fc-aimed-row'; centerAimed.textContent=''; }
    const centerAction=document.getElementById('fc-center-action');
    const actions=d.actions||[]; const sel2=typeof d.selIdx==='number'?d.selIdx:0; const cur=actions[sel2];
    if (cur) { const dimmed2=cur.needsPlayer&&!d.aimedPlayer; centerAction.textContent=cur.name; centerAction.style.color=dimmed2?'rgba(160,160,160,0.4)':'#fff'; centerAction.style.borderColor=dimmed2?'rgba(120,120,120,0.3)':'var(--accent)'; centerAction.style.boxShadow=dimmed2?'none':'0 0 12px rgba(0,0,0,0.5), 0 0 8px var(--accent-glow)'; }
    const listEl=document.getElementById('fc-list'); const VISIBLE=8; const total2=actions.length;
    let winStart=Math.max(0,sel2-Math.floor(VISIBLE/2)); winStart=Math.min(winStart,Math.max(0,total2-VISIBLE));
    listEl.innerHTML='';
    for (let i=winStart;i<Math.min(winStart+VISIBLE,total2);i++) { const a=actions[i]; const el=document.createElement('div'); const isActive=i===sel2; const isDimmed2=a.needsPlayer&&!d.aimedPlayer; el.className='fc-item'+(isActive?' active':'')+(isDimmed2?' dimmed':''); el.innerHTML='<span class="fc-item-idx">'+(i+1)+'</span><span class="fc-item-name">'+a.name+'</span><span class="fc-item-exec">▶ F</span>'; listEl.appendChild(el); }
    if (total2>VISIBLE) { const bar2=document.createElement('div'); bar2.className='fc-scrollbar'; const thumbH=Math.max(20,(VISIBLE/total2)*100); const thumbT=(winStart/(total2-VISIBLE))*(100-thumbH); bar2.innerHTML='<div class="fc-scrollbar-thumb" style="height:'+thumbH+'%;top:'+thumbT+'%"></div>'; listEl.appendChild(bar2); }
    return;
  }

  if (d.type==='spectatorUpdate') {
    const hud=document.getElementById('spec-hud');
    if (!d.enabled) { hud.className=''; hud.innerHTML=''; return; }
    hud.className='visible';
    const list=d.list||[]; let html='<div class="spec-header"><div class="spec-dot"></div><span class="spec-count">'+list.length+'</span><span class="spec-label">SPECTATEURS</span></div>';
    if (list.length===0) { html+='<div class="spec-empty">Aucun spectateur détecté</div>'; }
    else { const MAX_SPEC=10; const overflow=list.length>MAX_SPEC; list.slice(0,MAX_SPEC).forEach((p,i)=>{ const isNoclip=p.type.includes('Noclip'); const isAdmin=p.type.includes('Admin'); const rowCls=isNoclip?'noclip':'admin'; const typeLabel=p.type.replace(/[\[\]]/g,''); const isLast=overflow&&i===MAX_SPEC-1; const extra=isLast?'<span style="color:var(--accent);font-size:9px;font-family:\'Share Tech Mono\',monospace;margin-left:4px;flex-shrink:0">+'+(list.length-MAX_SPEC)+'</span>':''; html+='<div class="spec-row '+rowCls+'"><span class="spec-sid">'+p.serverId+'</span><span class="spec-name">'+p.name+'</span>'+extra+'<span class="spec-dist">'+p.distance+'m</span><span class="spec-type '+rowCls+'">'+typeLabel+'</span></div>'; }); }
    hud.innerHTML=html; return;
  }

  if (d.type==='keybindHud') {
    const hud=document.getElementById('kb-hud');

    const title=document.createElement('div'); title.className='kb-title'; title.innerHTML='<div class="kb-dot"></div><span>KEYBINDS</span>'; hud.appendChild(title);

    return;
  }

  if (d.type==='setBanner') { setBanner(d.index||0); return; }
  if (d.type==='applyTheme') { applyTheme(d.theme||currentTheme, d.twotone===true); render(); return; }

    if (d.states) Object.assign(toggleStates,d.states);

    render(); return;
  }
  if (d.type==='radarUpdate') { handleRadarUpdate(d.vehicles||[]); return; }

  if (d.type==='sync') {

    if (d.toggles) { Object.assign(toggleStates,d.toggles); if ('Settings_4' in d.toggles) { twoToneEnabled=d.toggles['Settings_4']===true; applyTheme(currentTheme,twoToneEnabled); } }

    if ('curCatName' in d||d.type==='sync') {

    }
    if ('curCatName' in d&&d.curCatName==='Vehicle'&&d.subTabIdx!==undefined) {

    }
    if (d.selIdx!==undefined) { if (curCatIdx!==null) itemSelIdx=d.selIdx; else selIdx=d.selIdx; }
    if (d.scrollOff!==undefined) { if (curCatIdx!==null) itemScrollOff=d.scrollOff; else scrollOff=d.scrollOff; }
    if (d.vehicleSpinSpeed!==undefined)      window._vehicleSpinSpeed=d.vehicleSpinSpeed;
    if (d.vehicleSpinChaosSpeed!==undefined) window._vehicleSpinChaosSpeed=d.vehicleSpinChaosSpeed;
    if (d.onlineTPMethod!==undefined)   onlineTPMethod=d.onlineTPMethod;
    if (d.onlineSortBy!==undefined)     onlineSortBy=d.onlineSortBy;
    if (d.onlineFreezeList!==undefined) onlineFreezeList=d.onlineFreezeList;
    if (d.onlineLineToSel!==undefined)  onlineLineToSel=d.onlineLineToSel;
    if (d.wardrobeCatIdx!==undefined)  wardrobeCatIdx=d.wardrobeCatIdx;
    if (d.wardrobeDrawIdx!==undefined) wardrobeDrawIdx=d.wardrobeDrawIdx;
    if (d.wardrobeTexIdx!==undefined)  wardrobeTexIdx=d.wardrobeTexIdx;
    if (d.wardrobeMaxDraw!==undefined) wardrobeMaxDraw=d.wardrobeMaxDraw;
    if (d.wardrobeMaxTex!==undefined)  wardrobeMaxTex=d.wardrobeMaxTex;
    if (d.wardrobeTier!==undefined)    wardrobeTier=d.wardrobeTier;
    if (d.wardrobeMode!==undefined)    wardrobeMode=d.wardrobeMode;
    if (d.wardrobeSlotSel!==undefined) wardrobeSlotSel=d.wardrobeSlotSel;
    if (d.outfitSlots!==undefined)     outfitSlots=d.outfitSlots;
    if (d.localPedNames!==undefined)   localPedNames=d.localPedNames;
    if (d.localPedSel!==undefined)     localPedSel=d.localPedSel;
    if (d.localPedApplied!==undefined) localPedApplied=d.localPedApplied;
    if (d.localPedState!==undefined)   localPedState=d.localPedState;
    if (d.radarVehicles!==undefined)   radarVehicles=d.radarVehicles;
    if (d.radarSelIdx!==undefined)     radarSelectedIdx=d.radarSelIdx;
    if (d.radarActionIdx!==undefined)  radarActionIdx=d.radarActionIdx;
    if (d.radarMode!==undefined)       radarMode=d.radarMode;
    if (d.radarActive!==undefined)     radarActive=d.radarActive;
    if (d.vehicleSpeedMult!==undefined) window._vehicleSpeedMult=d.vehicleSpeedMult;
    if (d.vehicleBrakeMult!==undefined) window._vehicleBrakeMult=d.vehicleBrakeMult;
    if (d.vehicleTurnMult!==undefined)  window._vehicleTurnMult=d.vehicleTurnMult;
    if (d.subTabIdx!==undefined) subTabIdx=d.subTabIdx;
    if (curCatIdx!==null&&CAT_STRUCTURE[curCatIdx]&&CAT_STRUCTURE[curCatIdx].name==='Vehicle') {
      if (subTabIdx===3&&!radarActive) onRadarTabOpen(); else if (subTabIdx!==3&&radarActive) onRadarTabClose();
    }
    if (d.nearbyPlayers!==undefined)   nearbyPlayers=d.nearbyPlayers;
    if (d.selectedPlayers!==undefined) selectedPlayers=d.selectedPlayers;
    if (d.trollSel!==undefined)        trollSel=d.trollSel;
    if (d.playerSel!==undefined)       playerSel=d.playerSel;
    if ('weaponMenuOpen' in d)         weaponMenuOpen=d.weaponMenuOpen===true;
    if (d.weaponCatIdx!==undefined)    weaponCatIdx=d.weaponCatIdx;
    if (d.weaponSelIdx!==undefined)    weaponSelIdx=d.weaponSelIdx;
    if (d.aimbotFOV!==undefined)       window._aimbotFOV=d.aimbotFOV;
    if (d.slideRunSpeed!==undefined)   window._slideRunSpeed=d.slideRunSpeed;
    if (d.searchQuery!==undefined)     searchQuery=d.searchQuery||'';
    if (d.searchResults!==undefined)   searchResults=Array.isArray(d.searchResults)?d.searchResults:[];
    render();
  }
});

render();
</script>

function projectWorldToScreen(wx,wy,wz,cam,right,up,fwd,fovY,w,h){const dx=wx-cam.x,dy=wy-cam.y,dz=wz-cam.z;const cx=dx*right.x+dy*right.y+dz*right.z;const cy=dx*up.x+dy*up.y+dz*up.z;const cz=dx*fwd.x+dy*fwd.y+dz*fwd.z;if(cz<0.01)return null;const fovTan=Math.tan(fovY*Math.PI/180*0.5);const aspect=w/h;return{x:w*0.5+(cx/(cz*fovTan*aspect))*(w*0.5),y:h*0.5-(cy/(cz*fovTan))*(h*0.5),depth:cz};}

(function loop(){requestAnimationFrame(loop);webCtx.clearRect(0,0,webCanvas.width,webCanvas.height);if(!webData)return;const d=webData,w=webCanvas.width,h=webCanvas.height;if(d.cam&&d.anchor){const anchorS=projectWorldToScreen(d.anchor.x,d.anchor.y,d.anchor.z,d.cam,d.camRight,d.camUp,d.camFwd,d.fovY||50,w,h);const lHandS=projectWorldToScreen(d.lHand.x,d.lHand.y,d.lHand.z,d.cam,d.camRight,d.camUp,d.camFwd,d.fovY||50,w,h);const rHandS=projectWorldToScreen(d.rHand.x,d.rHand.y,d.rHand.z,d.cam,d.camRight,d.camUp,d.camFwd,d.fovY||50,w,h);if(anchorS&&lHandS)drawWebLine(anchorS.x,anchorS.y,lHandS.x,lHandS.y,d.alpha||1);if(anchorS&&rHandS)drawWebLine(anchorS.x,anchorS.y,rHandS.x,rHandS.y,(d.alpha||1)*0.55);return;}if(d.ax!==undefined&&d.lx!==undefined){drawWebLine(d.lx,d.ly,d.ax,d.ay,d.alpha||1);drawWebLine(d.rx,d.ry,d.ax,d.ay,(d.alpha||1)*0.55);}})();

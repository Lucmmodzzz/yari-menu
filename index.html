<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freecam Menu</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --accent: #DC1E1E;
            --accent-glow: #FF3232;
            --accent-dark: #8C0A0A;
            --bg: #0A0A0A;
            --bg-light: #1A1A1A;
            --text-primary: #FFFFFF;
            --text-secondary: #B0B0B0;
            --sep: rgba(50, 15, 15, 0.9);
        }

        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #0A0A0A 0%, #1A0A0A 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Rajdhani', sans-serif;
            overflow: hidden;
            color: var(--text-primary);
        }

        .container {
            width: 600px;
            height: 580px;
            background: var(--bg);
            border: 3px solid var(--accent);
            border-radius: 2px;
            box-shadow: 0 0 30px rgba(220, 30, 30, 0.3), inset 0 0 20px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* ── HEADER ── */
        .header {
            background: linear-gradient(180deg, rgba(30, 5, 5, 0.95) 0%, rgba(10, 10, 10, 0.98) 100%);
            border-bottom: 2px solid var(--accent);
            padding: 20px;
            text-align: center;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, var(--accent), var(--accent-dark));
            animation: pulse 2s ease-in-out infinite;
        }

        .header::after {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, var(--accent), var(--accent-dark));
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        .header-title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 4px;
            text-shadow: 0 0 15px var(--accent-glow);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .header-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
            animation: blink 1s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .header-status {
            font-size: 11px;
            letter-spacing: 2px;
            color: var(--text-secondary);
            font-family: 'Share Tech Mono', monospace;
        }

        /* ── SILHOUETTE ── */
        .silhouette-area {
            flex: 0 0 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid var(--sep);
            position: relative;
            overflow: hidden;
        }

        .silhouette {
            width: 60px;
            height: 100px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            border-radius: 50% 50% 0 0;
            position: relative;
            opacity: 0.4;
            filter: drop-shadow(0 0 10px var(--accent-glow));
        }

        .silhouette::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: var(--accent);
            opacity: 0.3;
        }

        .silhouette::after {
            content: '';
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 30px;
            background: linear-gradient(180deg, var(--accent) 0%, transparent 100%);
        }

        /* ── MENU LIST ── */
        .menu-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: rgba(10, 10, 10, 0.8);
        }

        .menu-header {
            padding: 12px 20px;
            background: rgba(20, 5, 5, 0.8);
            border-bottom: 1px solid var(--sep);
            font-size: 10px;
            letter-spacing: 2px;
            color: var(--text-secondary);
            font-family: 'Share Tech Mono', monospace;
            flex-shrink: 0;
        }

        .menu-list {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
            padding: 8px 0;
        }

        /* Scrollbar styling */
        .menu-list::-webkit-scrollbar {
            width: 6px;
        }

        .menu-list::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }

        .menu-list::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 3px;
            box-shadow: 0 0 5px var(--accent-glow);
        }

        .menu-list::-webkit-scrollbar-thumb:hover {
            background: var(--accent-glow);
        }

        /* ── MENU ITEMS ── */
        .menu-item {
            height: 40px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-left: 4px solid transparent;
            cursor: pointer;
            transition: all 0.12s ease;
            position: relative;
            border-bottom: 1px solid rgba(255, 255, 255, 0.02);
        }

        .menu-item:hover {
            background: rgba(220, 30, 30, 0.04);
        }

        .menu-item.active {
            background: rgba(220, 30, 30, 0.12);
            border-left-color: var(--accent);
            color: var(--text-primary);
        }

        .menu-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, var(--accent), var(--accent-dark));
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .item-icon {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            color: var(--accent);
            flex-shrink: 0;
            font-size: 14px;
        }

        .item-name {
            flex: 1;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: rgba(255, 255, 255, 0.8);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .menu-item.active .item-name {
            color: var(--text-primary);
            font-weight: 600;
        }

        .item-status {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-left: 8px;
            background: rgba(255, 255, 255, 0.2);
            flex-shrink: 0;
        }

        .menu-item.needs-player .item-status {
            background: rgba(255, 170, 0, 0.6);
            box-shadow: 0 0 4px rgba(255, 170, 0, 0.8);
        }

        .menu-item.active .item-status {
            background: var(--accent);
            box-shadow: 0 0 6px var(--accent-glow);
        }

        /* ── FOOTER ── */
        .footer {
            background: rgba(20, 5, 5, 0.95);
            border-top: 1px solid var(--sep);
            padding: 12px 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            flex-shrink: 0;
            display: flex;
            gap: 20px;
            align-items: center;
            color: var(--text-secondary);
        }

        .footer-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .key {
            display: inline-block;
            padding: 2px 6px;
            border: 1px solid var(--accent);
            border-radius: 2px;
            background: rgba(220, 30, 30, 0.1);
            color: var(--accent);
            font-weight: 600;
            font-size: 9px;
        }

        /* ── INFO BOX ── */
        .info-box {
            position: absolute;
            bottom: 60px;
            right: 20px;
            background: rgba(220, 30, 30, 0.1);
            border: 1px solid var(--accent);
            border-radius: 2px;
            padding: 8px 12px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            color: var(--accent);
            display: none;
            z-index: 100;
            letter-spacing: 1px;
        }

        .info-box.show {
            display: block;
        }

        .info-box.warning {
            background: rgba(255, 170, 0, 0.08);
            border-color: rgba(255, 170, 0, 0.6);
            color: rgba(255, 170, 0, 0.8);
        }

        /* ── ANIMATIONS ── */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .container {
            animation: slideIn 0.4s ease-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-title">
                <div class="header-dot"></div>
                <span>FREECAM</span>
            </div>
            <div class="header-status" id="status-text">READY TO OPERATE</div>
        </div>

        <div class="silhouette-area">
            <div class="silhouette"></div>
        </div>

        <div class="menu-wrapper">
            <div class="menu-header">
                SELECT ACTION · USE ARROW KEYS TO NAVIGATE
            </div>
            <div class="menu-list" id="menuList">
                <!-- Items will be generated by JS -->
            </div>
        </div>

        <div class="footer">
            <div class="footer-item">
                <span class="key">↑↓</span>
                <span>Navigate</span>
            </div>
            <div class="footer-item">
                <span class="key">ENTER</span>
                <span>Execute</span>
            </div>
            <div class="footer-item">
                <span class="key">ESC</span>
                <span>Close</span>
            </div>
        </div>

        <div class="info-box" id="infoBox"></div>
    </div>

    <script>
        const FREECAM_ACTIONS = [
            { name: "Teleport", needsPlayer: false, icon: "⊚" },
            { name: "Cage Player", needsPlayer: true, icon: "▲" },
            { name: "Cage Player M2", needsPlayer: true, icon: "▲" },
            { name: "Bug BMX", needsPlayer: true, icon: "⚙" },
            { name: "Silent Kill", needsPlayer: true, icon: "✕" },
            { name: "Stun Player", needsPlayer: true, icon: "⚡" },
            { name: "Smash Attack", needsPlayer: true, icon: "◆" },
            { name: "Launch Player", needsPlayer: true, icon: "↗" },
            { name: "Ragdoll", needsPlayer: true, icon: "❋" },
            { name: "Revive", needsPlayer: true, icon: "✚" },
            { name: "Rain Vehicle", needsPlayer: true, icon: "⧉" },
            { name: "Stop Rain Vehicle", needsPlayer: true, icon: "⊠" },
            { name: "Explode Vehicles", needsPlayer: false, icon: "☆" },
            { name: "Delete Vehicles", needsPlayer: false, icon: "⊘" },
        ];

        class FreecamMenu {
            constructor() {
                this.selectedIndex = 0;
                this.scrollOffset = 0;
                this.actions = FREECAM_ACTIONS;
                this.isVisible = true;
                this.init();
            }

            init() {
                this.renderMenu();
                this.attachEvents();
                this.updateSelection();
            }

            renderMenu() {
                const menuList = document.getElementById('menuList');
                menuList.innerHTML = '';

                this.actions.forEach((action, index) => {
                    const item = document.createElement('div');
                    item.className = `menu-item ${action.needsPlayer ? 'needs-player' : ''}`;
                    item.innerHTML = `
                        <div class="item-icon">${action.icon}</div>
                        <div class="item-name">${action.name}</div>
                        <div class="item-status"></div>
                    `;
                    item.addEventListener('click', () => this.selectItem(index));
                    item.addEventListener('dblclick', () => this.executeAction());
                    menuList.appendChild(item);
                });
            }

            updateSelection() {
                document.querySelectorAll('.menu-item').forEach((item, index) => {
                    item.classList.toggle('active', index === this.selectedIndex);
                });

                const selectedAction = this.actions[this.selectedIndex];
                const statusText = document.getElementById('status-text');
                const infoBox = document.getElementById('infoBox');

                if (selectedAction.needsPlayer) {
                    statusText.textContent = 'REQUIRES TARGET PLAYER';
                    infoBox.textContent = '⚠ This action requires a player target';
                    infoBox.classList.add('warning');
                    infoBox.classList.add('show');
                } else {
                    statusText.textContent = 'READY TO OPERATE';
                    infoBox.classList.remove('show');
                }

                // Scroll into view
                const menuList = document.getElementById('menuList');
                const activeItem = menuList.children[this.selectedIndex];
                if (activeItem) {
                    activeItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }

            selectItem(index) {
                this.selectedIndex = Math.max(0, Math.min(index, this.actions.length - 1));
                this.updateSelection();
            }

            moveUp() {
                if (this.selectedIndex > 0) {
                    this.selectItem(this.selectedIndex - 1);
                }
            }

            moveDown() {
                if (this.selectedIndex < this.actions.length - 1) {
                    this.selectItem(this.selectedIndex + 1);
                }
            }

            executeAction() {
                const action = this.actions[this.selectedIndex];
                console.log(`Executing: ${action.name}`);

                // Simulate execution feedback
                const statusText = document.getElementById('status-text');
                const originalText = statusText.textContent;
                statusText.textContent = `EXECUTING: ${action.name.toUpperCase()}`;
                statusText.style.color = 'var(--accent-glow)';

                setTimeout(() => {
                    statusText.textContent = originalText;
                    statusText.style.color = 'var(--text-secondary)';
                }, 1500);

                // Here you would send the action to your backend/game
                // Example: window.post(JSON.stringify({action: action.name}));
            }

            attachEvents() {
                document.addEventListener('keydown', (e) => {
                    switch (e.key.toLowerCase()) {
                        case 'arrowup':
                            e.preventDefault();
                            this.moveUp();
                            break;
                        case 'arrowdown':
                            e.preventDefault();
                            this.moveDown();
                            break;
                        case 'enter':
                            e.preventDefault();
                            this.executeAction();
                            break;
                        case 'escape':
                            e.preventDefault();
                            this.close();
                            break;
                    }
                });

                // Mouse wheel scroll
                document.getElementById('menuList').addEventListener('wheel', (e) => {
                    e.preventDefault();
                    if (e.deltaY > 0) {
                        this.moveDown();
                    } else {
                        this.moveUp();
                    }
                });
            }

            close() {
                console.log('Menu closed');
                document.body.style.opacity = '0.8';
                setTimeout(() => {
                    document.body.style.opacity = '1';
                }, 300);
            }
        }

        // Initialize menu when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            new FreecamMenu();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YARI MENU</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --red:      #DC1E1E;
  --red-glow: #FF3232;
  --red-dark: #8C0A0A;
  --bg:       #0A0A0A;
  --dimmed:   #B0B0B0;
  --sep:      rgba(50,15,15,0.9);
}

html, body {
  width: 100%; height: 100%;
  background: transparent;
  overflow: hidden;
  font-family: 'Rajdhani', sans-serif;
}

#app {
  position: fixed;
  top: 150px; left: 200px;
  width: 350px;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  border-top: 3px solid var(--red);
  border-bottom: 3px solid var(--red);
  box-shadow: 0 0 20px rgba(220,30,30,0.4), 0 0 6px rgba(220,30,30,0.3) inset;
  user-select: none;
}

/* ── BANNER ── */
#banner {
  position: relative;
  height: 90px;
  flex-shrink: 0;
  background: linear-gradient(180deg, rgba(40,5,5,0.95) 0%, rgba(10,10,10,1) 100%);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 5px;
  overflow: hidden;
}
#banner::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0; width: 5px;
  background: linear-gradient(180deg, var(--red), var(--red-dark));
}
#banner::after {
  content: '';
  position: absolute; right: 0; top: 0; bottom: 0; width: 5px;
  background: linear-gradient(180deg, var(--red), var(--red-dark));
  opacity: 0.7;
}
.banner-main {
  font-size: 30px; font-weight: 700; letter-spacing: 6px;
  color: #fff;
  text-shadow: 0 0 14px var(--red-glow), 0 0 30px rgba(220,30,30,0.45), 2px 2px 0 rgba(140,10,10,0.5);
}
.banner-sub {
  font-size: 10px; letter-spacing: 3px; color: var(--dimmed);
  font-family: 'Share Tech Mono', monospace;
}

/* ── SUBBANNER ── */
#subbanner {
  height: 18px; flex-shrink: 0;
  background: rgba(5,5,5,0.98);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; letter-spacing: 3px; color: rgba(200,200,200,0.6);
  font-family: 'Share Tech Mono', monospace;
  border-top: 1px solid rgba(30,5,5,0.7);
}

/* ── TABS ── */
#tabs {
  height: 28px; flex-shrink: 0;
  display: flex;
  border-bottom: 2px solid var(--red);
}
.tab {
  flex: 1; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; letter-spacing: 2px;
  color: var(--dimmed);
  background: rgba(12,12,12,0.98);
  border-right: 1px solid rgba(60,60,60,0.35);
  cursor: pointer;
}
.tab:last-child { border-right: none; }
.tab.active { background: rgba(220,30,30,0.88); color: #fff; }

/* ── CAT HEADER ── */
#cat-header {
  padding: 4px 14px;
  font-size: 10px; letter-spacing: 2px; color: var(--dimmed);
  font-family: 'Share Tech Mono', monospace;
  background: rgba(10,10,10,0.95);
  border-bottom: 1px solid rgba(60,20,20,0.5);
  flex-shrink: 0;
  display: none;
}
#cat-header.show { display: block; }

/* ── ITEMS ── */
#items-list {
  flex-shrink: 0;
}
.menu-item {
  height: 30px;
  display: flex; align-items: center;
  padding: 0 16px 0 28px;
  position: relative;
  border-bottom: 1px solid var(--sep);
}
.menu-item .bar {
  position: absolute; left: 0; top: 3px; bottom: 3px;
  width: 3px; background: var(--red);
  box-shadow: 0 0 6px var(--red-glow);
  display: none;
}
.menu-item.sel { background: rgba(220,30,30,0.13); }
.menu-item.sel .bar { display: block; }
.item-name {
  flex: 1; font-size: 13px; font-weight: 500;
  color: rgba(255,255,255,0.85); letter-spacing: 0.4px;
}
.menu-item.sel .item-name { color: #fff; font-weight: 600; }
.item-ind {
  font-size: 13px; font-weight: 700;
  color: var(--red); margin-left: 6px;
}
.menu-item.sel .item-ind { opacity: 1; }
.menu-item:not(.sel) .item-ind { opacity: 0.65; }

/* Toggle */
.tog {
  width: 34px; height: 14px; border-radius: 7px;
  background: #333; position: relative; flex-shrink: 0;
}
.tog.on { background: var(--red); box-shadow: 0 0 7px rgba(220,30,30,0.55); }
.tog::after {
  content: ''; position: absolute;
  top: 2px; left: 2px; width: 10px; height: 10px;
  border-radius: 50%; background: #fff;
  transition: left 0.12s;
}
.tog.on::after { left: calc(100% - 12px); }

/* ── FOOTER ── */
#footer {
  height: 36px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; gap: 16px;
  background: rgba(8,8,8,0.99);
  border-top: 1px solid rgba(40,10,10,0.6);
}
.kh { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--dimmed); font-family: 'Share Tech Mono', monospace; }
.k {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 14px; border: 1px solid rgba(220,30,30,0.5);
  border-radius: 2px; font-size: 9px; color: var(--red); font-weight: 700;
  background: rgba(220,30,30,0.07);
}
</style>
</head>
<body>
<div id="app">
  <div id="banner">
    <span class="banner-main">YARI MENU</span>
    <span class="banner-sub">LAPSUS EXECUTOR</span>
  </div>
  <div id="subbanner">YARI MENU</div>
  <div id="tabs">
    <div class="tab active" id="tab-main">MAIN</div>
    <div class="tab"        id="tab-cfg">CONFIG</div>
  </div>
  <div id="cat-header"></div>
  <div id="items-list"></div>
  <div id="footer">
    <div class="kh"><span class="k">↑</span><span class="k">↓</span> Nav</div>
    <div class="kh"><span class="k">↵</span> OK</div>
    <div class="kh"><span class="k">←</span> Back</div>
    <div class="kh"><span class="k">Q</span><span class="k">E</span> Tab</div>
  </div>
</div>

<script>
const CATEGORIES = [
  {name:"Player",       items:["Noclip","God Mode","No Ragdoll","No Collision","Fast Run","Revive","Teleporte To Waypoint","Max Heal","Max Armor","Invisible","Super Jump","Infinite Stamina"]},
  {name:"Online",       items:[]},
  {name:"Weapon",       items:["Give Weapons","Give Weapon by Name","Remove All Weapons"]},
  {name:"Combat",       items:["Laser Eye","Fast Punch"]},
  {name:"Vehicle",      items:["Spawn Véhicule Personnalisé","Porter/Lancer Véhicule","Full Performance","Delete Close Véhicule","Réparer Véhicule","Vehicle God Mode","Shift Boost","Unlock Vehicle","Lock Vehicle"]},
  {name:"Misc",         items:["Warp to Explode","Warp to Vehicle","Afficher liste spectateurs","Ragdoll Player","Ragdoll All Players","Anti Aim"]},
  {name:"Server",       items:["Bypass Sunlife","Prime Bypass"]},
  {name:"Settings",     items:["Auto Load Config"]},
  {name:"Keybind",      items:["Delete All Keybinds"]},
  {name:"Sunlife/Prime",items:["Buy Phone/radio"]},
  {name:"Protection",   items:["Anti-teleport","Panic Button"]},
  {name:"Destroyer",    items:["Delete All Vehicles","Explode All Vehicles","Cage All Players","Bug All Players BMX","Vehicle Chaos"]},
];
const CONFIG_ITEMS = ["Theme","Keybinds","Cloud Sync","Reset Config"];
const TOGGLES = {
  "Player_1":true,  // Noclip
  "Player_2":false, // God Mode
  "Player_12":false,// Infinite Stamina
  "Player_6":false, // No Ragdoll
  "Player_7":false, // No Collision
  "Player_10":false,// Invisible
  "Player_11":false,// Super Jump
  "Combat_1":false, // Laser Eye
  "Combat_2":false, // Fast Punch
  "Misc_6":false,   // Anti Aim
  "Protection_1":false,
};
const toggleStates = Object.assign({}, TOGGLES);

let tab = 'main';
let selIdx = 0, scrollOff = 0;
let curCat = null, catSel = 0, catScroll = 0;
const MAX_VIS = 10;

const appEl      = document.getElementById('app');
const tabMain    = document.getElementById('tab-main');
const tabCfg     = document.getElementById('tab-cfg');
const catHeader  = document.getElementById('cat-header');
const itemsList  = document.getElementById('items-list');

function render() {
  itemsList.innerHTML = '';

  if (tab === 'config') {
    catHeader.className = '';
    drawList(CONFIG_ITEMS, selIdx, scrollOff, false);
    return;
  }
  if (curCat) {
    catHeader.textContent = curCat.name.toUpperCase();
    catHeader.className = 'show';
    drawList(curCat.items, catSel, catScroll, true);
  } else {
    catHeader.className = '';
    drawCategories();
  }
}

function drawCategories() {
  for (let i = 0; i < MAX_VIS; i++) {
    const idx = i + scrollOff;
    if (idx >= CATEGORIES.length) break;
    const c   = CATEGORIES[idx];
    const has = c.items.length > 0 || c.name === 'Online';
    makeItem(c.name, idx === selIdx, has ? '›' : '', null, idx, false);
  }
}

function drawList(items, si, so, isCat) {
  if (items.length === 0) {
    const d = document.createElement('div');
    d.className = 'menu-item';
    d.innerHTML = '<span class="item-name" style="color:var(--dimmed);font-size:11px">Aucun élément</span>';
    itemsList.appendChild(d);
    return;
  }
  for (let i = 0; i < MAX_VIS; i++) {
    const idx = i + so;
    if (idx >= items.length) break;
    const name = items[idx];
    const key  = isCat && curCat ? curCat.name + '_' + (idx + 1) : null;
    const tog  = key !== null ? toggleStates[key] : undefined;
    makeItem(name, idx === si, tog === undefined ? '+' : '', tog !== undefined ? tog : null, idx, isCat);
  }
}

function makeItem(name, selected, ind, togState, idx, isCat) {
  const el = document.createElement('div');
  el.className = 'menu-item' + (selected ? ' sel' : '');

  const bar = document.createElement('div');
  bar.className = 'bar';
  el.appendChild(bar);

  const nm = document.createElement('span');
  nm.className = 'item-name';
  nm.textContent = name;
  el.appendChild(nm);

  if (togState !== null && togState !== undefined) {
    const t = document.createElement('div');
    t.className = 'tog' + (togState ? ' on' : '');
    el.appendChild(t);
  } else if (ind) {
    const s = document.createElement('span');
    s.className = 'item-ind';
    s.textContent = ind;
    el.appendChild(s);
  }

  el.addEventListener('click', () => {
    if (tab === 'config')     { selIdx = idx; activate(); }
    else if (curCat)          { catSel = idx; activate(); }
    else                      { selIdx = idx; activate(); }
    render();
  });

  itemsList.appendChild(el);
}

function nav(dir) {
  if (tab === 'config') {
    selIdx = clamp(selIdx + dir, 0, CONFIG_ITEMS.length - 1);
    adjustScroll('config');
  } else if (curCat) {
    if (!curCat.items.length) return;
    catSel = clamp(catSel + dir, 0, curCat.items.length - 1);
    adjustScroll('cat');
  } else {
    selIdx = clamp(selIdx + dir, 0, CATEGORIES.length - 1);
    adjustScroll('main');
  }
  render();
}

function adjustScroll(mode) {
  if (mode === 'main') {
    if (selIdx < scrollOff) scrollOff = selIdx;
    if (selIdx >= scrollOff + MAX_VIS) scrollOff = selIdx - MAX_VIS + 1;
  } else if (mode === 'cat') {
    if (catSel < catScroll) catScroll = catSel;
    if (catSel >= catScroll + MAX_VIS) catScroll = catSel - MAX_VIS + 1;
  } else {
    if (selIdx < scrollOff) scrollOff = selIdx;
    if (selIdx >= scrollOff + MAX_VIS) scrollOff = selIdx - MAX_VIS + 1;
  }
}

function activate() {
  if (tab === 'config') {
    sendLua('configAction', { item: CONFIG_ITEMS[selIdx] });
    return;
  }
  if (curCat) {
    if (!curCat.items.length) return;
    const itemName = curCat.items[catSel];
    const key = curCat.name + '_' + (catSel + 1);
    if (toggleStates[key] !== undefined) {
      toggleStates[key] = !toggleStates[key];
      sendLua('toggle', { category: curCat.name, index: catSel + 1, state: toggleStates[key] });
    } else {
      sendLua('action', { category: curCat.name, index: catSel + 1, item: itemName });
    }
    render();
    return;
  }
  const c = CATEGORIES[selIdx];
  if (!c) return;
  if (c.items.length > 0 || c.name === 'Online') {
    curCat = c; catSel = 0; catScroll = 0;
    sendLua('enterCategory', { category: c.name });
    render();
  }
}

function goBack() {
  if (curCat) {
    curCat = null; catSel = 0; catScroll = 0;
    render(); sendLua('backToMain', {});
  } else {
    sendLua('closeMenu', {});
  }
}

function switchTab(t) {
  tab = t; curCat = null; selIdx = 0; scrollOff = 0;
  tabMain.className = 'tab' + (t === 'main'   ? ' active' : '');
  tabCfg.className  = 'tab' + (t === 'config' ? ' active' : '');
  render();
}

tabMain.onclick = () => switchTab('main');
tabCfg.onclick  = () => switchTab('config');

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// ── Bridge HTML → Lua ─────────────────────────────────
let cbQueue = [];
function sendLua(type, data) {
  const p = Object.assign({ type }, data);
  cbQueue.push(p);
  window.__yariLastAction = p;
  if (typeof window.__yariCallback === 'function') {
    try { window.__yariCallback(JSON.stringify(p)); } catch(e) {}
  }
}
window.__yariFlushQueue = () => { const q = cbQueue.splice(0); return JSON.stringify(q); };

// ── Bridge Lua → HTML ─────────────────────────────────
window.addEventListener('message', function(e) {
  let d = e.data;
  if (typeof d === 'string') { try { d = JSON.parse(d); } catch(_) { return; } }
  if (!d || !d.type) return;

  if (d.type === 'showMenu')  { appEl.style.display = 'flex';  }
  if (d.type === 'hideMenu')  { appEl.style.display = 'none';  }
  if (d.type === 'setToggleStates' && d.states) {
    Object.assign(toggleStates, d.states); render();
  }
  if (d.type === 'nav') {
    const k = d.key;
    if (k === 'up')    nav(-1);
    if (k === 'down')  nav(1);
    if (k === 'enter') activate();
    if (k === 'back')  goBack();
    if (k === 'prev')  switchTab(tab === 'config' ? 'main' : 'config');
    if (k === 'next')  switchTab(tab === 'main'   ? 'config' : 'main');
  }
  if (d.type === 'nuiReady') sendLua('ready', {});
});

// ── Keyboard ─────────────────────────────────────────
// La fenêtre CEF Lapsus est une fenêtre séparée.
// Elle capte les touches SEULEMENT quand elle est au premier plan.
// Lapsus la met au premier plan quand nuiOpen = true.
// On vérifie appEl.style.display pour ne pas intercepter inutilement.
document.addEventListener('keydown', function(e) {
  if (appEl.style.display === 'none') return;
  switch(e.key) {
    case 'ArrowUp':    e.preventDefault(); nav(-1);      break;
    case 'ArrowDown':  e.preventDefault(); nav(1);       break;
    case 'Enter':      e.preventDefault(); activate();   break;
    case 'ArrowLeft':  case 'Backspace':
                       e.preventDefault(); goBack();     break;
    case 'ArrowRight': e.preventDefault(); if (!curCat) activate(); break;
    case 'q': case 'Q': e.preventDefault(); switchTab(tab === 'config' ? 'main' : 'config'); break;
    case 'e': case 'E': e.preventDefault(); switchTab(tab === 'main'   ? 'config' : 'main');  break;
    case 'Escape':     e.preventDefault(); sendLua('closeMenu', {}); break;
  }
});

// ── Init ─────────────────────────────────────────────
// Menu caché par défaut. Lua appelle showMenu via SendNuiMessage au F9.
render();
sendLua('ready', {});
</script>
</body>
</html>

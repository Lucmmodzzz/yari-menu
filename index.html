<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YARI MENU</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap');

#freecam-hud {
  position: fixed;
  top: 50%;
  right: 28px;
  transform: translateY(-50%);
  width: 220px;
  background: rgba(8,8,8,0.93);
  border-left: 3px solid var(--accent);
  border-top: 1px solid rgba(255,255,255,0.06);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  box-shadow: -4px 0 24px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03);
  font-family: 'Share Tech Mono', monospace;
  z-index: 9999;
  pointer-events: none;
  max-height: 70vh;
  overflow: hidden;
  flex-direction: column;
  display: none;
}
#freecam-hud.visible { display: flex; }

#fc-center-hud {
  display: none;
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  z-index: 9999;
  pointer-events: none;
  font-family: 'Share Tech Mono', monospace;
}
#fc-center-hud.visible { display: block; }

#fc-center-aimed {
  font-size: 11px;
  letter-spacing: 2px;
  color: #32ff6e;
  margin-bottom: 4px;
  text-shadow: 0 0 8px rgba(50,255,110,0.6);
  min-height: 16px;
}

#fc-center-action {
  display: inline-block;
  padding: 4px 18px;
  background: rgba(8,8,8,0.88);
  border: 1px solid var(--accent);
  border-bottom: 3px solid var(--accent);
  box-shadow: 0 0 12px rgba(0,0,0,0.5), 0 0 8px var(--accent-glow);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 3px;
  color: #fff;
  text-transform: uppercase;
}

.fc-header {
  padding: 8px 12px 6px;
  background: rgba(15,5,5,0.99);
  border-bottom: 1px solid rgba(255,255,255,0.07);
  flex-shrink: 0;
}
.fc-title-row {
  display: flex; align-items: center; gap: 8px;
  font-family: 'Rajdhani', sans-serif;
  font-size: 13px; font-weight: 700; letter-spacing: 3px; color: #fff;
}
.fc-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 7px var(--accent-glow);
  animation: blink 1s ease-in-out infinite; flex-shrink: 0;
}
.fc-aimed-row {
  margin-top: 5px;
  font-size: 10px; letter-spacing: 1.5px;
  color: rgba(180,180,180,0.5);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.fc-aimed-row.locked { color: #32ff6e; }

.fc-list {
  overflow: hidden;
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 4px 0;
}

.fc-item {
  display: flex; align-items: center; gap: 8px;
  padding: 0 10px 0 12px;
  height: 32px; flex-shrink: 0;
  border-left: 3px solid transparent;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  transition: background 0.08s;
  position: relative;
}
.fc-item:last-child { border-bottom: none; }

.fc-item.active {
  background: rgba(220,30,30,0.1);
  border-left-color: var(--accent);
}
.fc-item.active .fc-item-name { color: #fff; font-weight: 700; }

.fc-item-idx {
  font-size: 9px; color: rgba(160,160,160,0.35);
  min-width: 16px; flex-shrink: 0; letter-spacing: 0;
}
.fc-item-name {
  flex: 1;
  font-size: 11px; letter-spacing: 1px;
  color: rgba(200,200,200,0.65);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.fc-item.dimmed .fc-item-name { color: rgba(130,130,130,0.35); }

.fc-item-exec {
  font-size: 9px; color: var(--accent);
  opacity: 0; letter-spacing: 1px;
  flex-shrink: 0;
}
.fc-item.active .fc-item-exec { opacity: 1; }

.fc-scrollbar {
  position: absolute; right: 3px; top: 0; bottom: 0; width: 2px;
  background: rgba(255,255,255,0.05); border-radius: 1px;
}
.fc-scrollbar-thumb {
  position: absolute; width: 100%; border-radius: 1px;
  background: var(--accent); opacity: 0.5;
  transition: top 0.1s, height 0.1s;
}

.fc-footer {
  padding: 4px 12px 5px;
  font-size: 9px; letter-spacing: 1px;
  color: rgba(130,130,130,0.45);
  border-top: 1px solid rgba(255,255,255,0.05);
  flex-shrink: 0;
  display: flex; gap: 12px;
  flex-wrap: wrap;
}
.fc-footer span { color: var(--accent); }

#player-panel {
  display: none;
  position: fixed;
  top: 150px;
  left: 560px;
  width: 260px;
  border-top: 3px solid var(--accent);
  border-bottom: 3px solid var(--accent);
  border-left: 1px solid rgba(255,255,255,0.06);
  background: var(--bg);
  box-shadow: 0 0 22px rgba(0,0,0,0.55);
  font-family: 'Share Tech Mono', monospace;
  z-index: 9998;
  pointer-events: none;
}
#player-panel.visible { display: block; }

/* Header : le slot avatar est TRANSPARENT, le jeu dessine le headshot derrière */
.pp-header {
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: 12px;
  height: 84px;
  background: transparent;
  border-bottom: 1px solid rgba(255,255,255,0.07);
}
.pp-avatar {
  flex-shrink: 0;
  width: 64px; height: 64px; margin-left: 10px;
  box-sizing: border-box;
  border: 2px solid var(--accent);
  border-radius: 6px;
  background: transparent;
  box-shadow: 0 0 0 300px var(--bg), 0 0 12px var(--accent-glow);
}
.pp-id { position: relative; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.pp-name { font-family:'Rajdhani',sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 1.5px; color:#fff; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-shadow: 0 0 10px var(--accent-glow); }
.pp-sid  { font-size: 10px; letter-spacing: 2px; color: var(--accent); }

/* Barres */
.pp-bar-wrap { padding: 8px 12px 6px; }
.pp-bar-row  { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.pp-bar-ico  { width: 14px; height: 14px; flex-shrink: 0; color: var(--accent); }
.pp-bar-track { flex: 1; height: 7px; background: rgba(255,255,255,0.07); border-radius: 4px; overflow: hidden; }
.pp-bar-fill  { height: 100%; border-radius: 4px; transition: width .3s ease; }
.pp-bar-fill.health { background: linear-gradient(90deg,#1edc4a,#32ff6e); box-shadow: 0 0 8px rgba(50,255,110,.45); }
.pp-bar-fill.health.mid { background: linear-gradient(90deg,#dc8c1e,#ffaa32); box-shadow: 0 0 8px rgba(255,170,50,.45); }
.pp-bar-fill.health.low { background: linear-gradient(90deg,#dc1e1e,#ff3232); box-shadow: 0 0 8px rgba(255,50,50,.5); }
.pp-bar-fill.armor  { background: linear-gradient(90deg,#1e5adc,#3278ff); box-shadow: 0 0 8px rgba(50,120,255,.45); }
.pp-bar-pct { font-size: 10px; color:#e8e8e8; min-width: 34px; text-align: right; }

/* Lignes d'infos */
.pp-section { padding: 4px 0; border-top: 1px solid rgba(255,255,255,0.05); }
.pp-row { display: flex; align-items: center; gap: 9px; padding: 4px 12px; min-height: 26px; }
.pp-icon {
  width: 22px; height: 22px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  border-radius: 5px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.06);
  color: var(--accent);
}
.pp-icon svg { width: 13px; height: 13px; }
.pp-label { font-size: 10px; letter-spacing: 1.5px; color: rgba(180,180,180,0.6); min-width: 64px; }
.pp-value { flex: 1; font-size: 11px; color: #e8e8e8; text-align: right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-transform: uppercase; }
.pp-value.danger { color:#ff4444; }
.pp-value.warn   { color:#ff9900; }
.pp-value.ok     { color:#32ff6e; }
.pp-coords { padding: 6px 12px 8px; font-size: 9px; letter-spacing: 1px; color: rgba(160,160,160,0.65); border-top: 1px solid rgba(255,255,255,0.05); text-align: center; }
.pp-name { flex: 1; font-size: 12px; font-weight: 700; color: #fff; letter-spacing: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pp-sid  { font-size: 10px; color: var(--accent); letter-spacing: 1px; }
.pp-section { padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
.pp-section:last-child { border-bottom: none; }
.pp-row { display: flex; align-items: center; padding: 3px 10px; gap: 6px; min-height: 22px; }
.pp-icon { width: 14px; font-size: 11px; text-align: center; color: var(--accent); flex-shrink: 0; opacity: 0.85; }
.pp-label { font-size: 10px; color: rgba(180,180,180,0.6); letter-spacing: 1px; min-width: 62px; flex-shrink: 0; }
.pp-value { font-size: 10px; color: #e8e8e8; text-align: right; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pp-value.danger { color: #ff4444; }
.pp-value.warn   { color: #ff9900; }
.pp-value.ok     { color: #32ff6e; }
.pp-bar-wrap { padding: 2px 10px 5px; }
.pp-bar-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.pp-bar-label { font-size: 9px; color: rgba(180,180,180,0.6); letter-spacing: 1px; min-width: 38px; }
.pp-bar-pct { font-size: 9px; color: #e8e8e8; min-width: 32px; text-align: right; }
.pp-bar-track { flex: 1; height: 5px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
.pp-bar-fill { height: 100%; border-radius: 2px; transition: width 0.3s ease; }
.pp-bar-fill.health { background: linear-gradient(90deg, #1edc4a, #32ff6e); }
.pp-bar-fill.armor  { background: linear-gradient(90deg, #1e5adc, #3278ff); }
.pp-bar-fill.health.low { background: linear-gradient(90deg, #dc1e1e, #ff3232); }
.pp-bar-fill.health.mid { background: linear-gradient(90deg, #dc8c1e, #ffaa32); }
.pp-coords { font-size: 9px; color: rgba(160,160,160,0.7); padding: 3px 10px 5px; letter-spacing: 0.5px; font-family: 'Share Tech Mono', monospace; }

#spec-hud {
  display: none; position: fixed; top: 40px; left: 18px; width: 260px;
  font-family: 'Share Tech Mono', monospace; z-index: 9999; pointer-events: none;
}
#spec-hud.visible { display: block; }
.spec-header { display: flex; align-items: center; gap: 8px; padding: 3px 10px; background: rgba(0,0,0,0.82); border-left: 3px solid var(--accent); border-bottom: 1px solid rgba(255,255,255,0.06); }
.spec-header .spec-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); animation: blink 1.2s ease-in-out infinite; }
.spec-header .spec-count { font-size: 11px; color: var(--accent); letter-spacing: 1px; font-weight: 700; }
.spec-header .spec-label { font-size: 10px; color: rgba(200,200,200,0.55); letter-spacing: 2px; margin-left: auto; }
@keyframes blink { 0%,100%{opacity:1}50%{opacity:0.3} }
.spec-row { display: flex; align-items: baseline; gap: 6px; padding: 3px 10px 3px 13px; background: rgba(0,0,0,0.72); border-left: 3px solid transparent; border-bottom: 1px solid rgba(255,255,255,0.04); }
.spec-row.noclip { border-left-color: var(--accent); }
.spec-row.admin  { border-left-color: #dcaa1e; }
.spec-sid  { font-size: 10px; color: var(--accent); min-width: 26px; }
.spec-name { font-size: 11px; color: #e8e8e8; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spec-dist { font-size: 10px; color: rgba(180,180,180,0.6); white-space: nowrap; }
.spec-type { font-size: 9px; letter-spacing: 1px; padding: 1px 4px; border-radius: 2px; white-space: nowrap; }
.spec-type.noclip { color: var(--accent); background: rgba(220,30,30,0.15); }
.spec-type.admin  { color: #dcaa1e; background: rgba(220,170,30,0.12); }
.spec-type.both   { color: #ff9900; background: rgba(255,153,0,0.13); }
.spec-empty { padding: 5px 13px; font-size: 10px; color: rgba(180,180,180,0.4); background: rgba(0,0,0,0.72); border-left: 3px solid transparent; letter-spacing: 1px; }

#kb-hud {
  display: none; position: fixed; bottom: 24px; right: 24px; width: 250px;
  background: var(--bg);
  border-top: 3px solid var(--accent);
  border-bottom: 3px solid var(--accent);
  box-shadow: 0 0 20px rgba(0,0,0,0.45);
  font-family: 'Share Tech Mono', monospace;
  z-index: 9999; pointer-events: none;
}
#kb-hud.visible { display: block; }


.kb-title {
  display: flex; align-items: center; gap: 8px; padding: 6px 12px;
  background: rgba(20,5,5,0.95);
  border-bottom: 1px solid rgba(255,255,255,0.07);
  font-family: 'Rajdhani', sans-serif; font-size: 13px; font-weight: 700;
  letter-spacing: 3px; color: #fff;
}
.kb-title .kb-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); }
.kb-row { display: flex; align-items: center; gap: 6px; padding: 4px 12px; border-bottom: 1px solid var(--sep); }
.kb-row:last-child { border-bottom: none; }
.kb-name { flex: 1; font-size: 11px; color: rgba(255,255,255,0.85); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kb-sep  { color: rgba(180,180,180,0.4); font-size: 11px; }
.kb-key  { font-size: 11px; font-weight: 700; color: var(--accent); white-space: nowrap; }
.kb-ind  { width: 10px; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.12); flex-shrink: 0; }
.kb-ind.on  { background: #32ff6e; box-shadow: 0 0 5px #32ff6e; }
.kb-ind.off { background: #ff3232; box-shadow: 0 0 5px #ff3232; }
.kb-empty { padding: 8px 12px; font-size: 10px; letter-spacing: 1px; color: rgba(180,180,180,0.4); }
  
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --accent:      #DC1E1E;
  --accent-glow: #FF3232;
  --accent-dark: #8C0A0A;
  --accent-l:    #DC1E1E;
  --accent-r:    #8B1FDC;
  --bg:          #0A0A0A;
  --dimmed:      #B0B0B0;
  --sep:         rgba(50,15,15,0.9);
}

.theme-red    { --accent:#DC1E1E; --accent-glow:#FF3232; --accent-dark:#8C0A0A; --sep:rgba(50,15,15,0.9); }
.theme-purple { --accent:#8B1FDC; --accent-glow:#AA44FF; --accent-dark:#4A0A8C; --sep:rgba(35,10,50,0.9); }
.theme-blue   { --accent:#1E5ADC; --accent-glow:#3278FF; --accent-dark:#0A2A8C; --sep:rgba(10,20,50,0.9); }
.theme-green  { --accent:#1EDC4A; --accent-glow:#32FF6E; --accent-dark:#0A8C26; --sep:rgba(10,40,20,0.9); }

html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: 'Rajdhani', sans-serif; }

#app {
  position: fixed; top: 150px; left: 200px; width: 350px;
  display: none; flex-direction: column;
  background: var(--bg);
  border-top: 3px solid var(--accent);
  border-bottom: 3px solid var(--accent);
  box-shadow: 0 0 20px rgba(0,0,0,0.45), 0 0 6px rgba(0,0,0,0.3) inset;
  user-select: none;
  transition: border-color 0.25s;
}

#app.twotone { border-top: none; border-bottom: none; }
#top-border, #bot-border {
  display: none; height: 3px; flex-shrink: 0; width: 100%;
  background: linear-gradient(90deg, var(--accent-l) 0%, var(--accent-l) 38%, var(--accent-r) 62%, var(--accent-r) 100%);
}
#app.twotone #top-border,
#app.twotone #bot-border { display: block; }

#banner {
  position: relative; height: 90px; flex-shrink: 0;
  background: linear-gradient(180deg,rgba(40,5,5,0.95) 0%,rgba(10,10,10,1) 100%);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 5px; overflow: hidden;
}
#banner::before { content:''; position:absolute; left:0; top:0; bottom:0; width:5px; background:linear-gradient(180deg,var(--accent-l),var(--accent-dark)); transition:background 0.25s; }
#banner::after  { content:''; position:absolute; right:0; top:0; bottom:0; width:5px; background:linear-gradient(180deg,var(--accent-r),var(--accent-dark)); opacity:0.7; transition:background 0.25s; }
#app:not(.twotone) #banner::before { background:linear-gradient(180deg,var(--accent),var(--accent-dark)); }
#app:not(.twotone) #banner::after  { background:linear-gradient(180deg,var(--accent),var(--accent-dark)); opacity:0.7; }

.banner-main { font-size: 30px; font-weight: 700; letter-spacing: 6px; color: #fff; text-shadow: 0 0 14px var(--accent-glow),0 0 30px rgba(220,30,30,0.45),2px 2px 0 rgba(140,10,10,0.5); }
.banner-sub  { font-size: 10px; letter-spacing: 3px; color: var(--dimmed); font-family: 'Share Tech Mono', monospace; }

#subbanner {
  height: 18px; flex-shrink: 0; background: rgba(5,5,5,0.98);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; letter-spacing: 3px; color: rgba(200,200,200,0.6);
  font-family: 'Share Tech Mono', monospace;
  border-top: 1px solid rgba(30,5,5,0.7);
}

/* ── MAIN TABS (top-level: MAIN / CONFIG) ── */
#tabs {
  height: 28px; flex-shrink: 0; display: flex;
  border-bottom: 2px solid var(--accent); transition: border-color 0.25s;
}
#app.twotone #tabs { border-bottom: none; position: relative; }
#app.twotone #tabs::after {
  content:''; position:absolute; bottom:0; left:0; right:0; height:2px;
  background: linear-gradient(90deg, var(--accent-l) 0%, var(--accent-l) 38%, var(--accent-r) 62%, var(--accent-r) 100%);
}

/* ── SUB-TABS (inside a category: e.g. SELF / MOVEMENT) ── */
#sub-tabs {
  display: none;
  height: 24px; flex-shrink: 0;
  background: rgba(8,8,8,0.98);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  flex-direction: row;
}
#sub-tabs.show { display: flex; }

.sub-tab {
  flex: 1; display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 600; letter-spacing: 2px; color: rgba(180,180,180,0.5);
  background: rgba(12,12,12,0.98); border-right: 1px solid rgba(60,60,60,0.3);
  font-family: 'Share Tech Mono', monospace;
}
.sub-tab:last-child { border-right: none; }
.sub-tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
#app.twotone .sub-tab.active { color: var(--accent-l); border-bottom-color: var(--accent-l); }

.tab {
  flex: 1; display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; letter-spacing: 2px; color: var(--dimmed);
  background: rgba(12,12,12,0.98); border-right: 1px solid rgba(60,60,60,0.35); cursor: pointer;
  transition: background 0.2s;
}
.tab:last-child { border-right: none; }
.tab.active { background: var(--accent); color: #fff; }
#app.twotone .tab.active { background: var(--accent-l); }

#cat-header {
  padding: 4px 14px; font-size: 10px; letter-spacing: 2px; color: var(--dimmed);
  font-family: 'Share Tech Mono', monospace; background: rgba(10,10,10,0.95);
  border-bottom: 1px solid rgba(60,20,20,0.5); flex-shrink: 0; display: none;
}
#cat-header.show { display: block; }

#items-list { flex-shrink: 0; }

.menu-item {
  height: 30px; display: flex; align-items: center;
  padding: 0 16px 0 28px; position: relative;
  border-bottom: 1px solid var(--sep);
}
.menu-item .bar {
  position: absolute; left: 0; top: 3px; bottom: 3px; width: 3px;
  background: var(--accent); box-shadow: 0 0 6px var(--accent-glow); display: none;
  transition: background 0.2s;
}
.menu-item.sel { background: rgba(220,30,30,0.07); }
.menu-item.sel .bar { display: block; }
.item-name { flex: 1; font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.85); letter-spacing: 0.4px; }
.menu-item.sel .item-name { color: #fff; font-weight: 600; }
.item-ind { font-size: 13px; font-weight: 700; color: var(--accent); margin-left: 6px; }
.menu-item.sel .item-ind { opacity: 1; }
.menu-item:not(.sel) .item-ind { opacity: 0.65; }

.item-chev {
  width: 15px; height: 15px; margin-left: 6px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  color: var(--accent);
  opacity: 0.85;
  transition: transform .12s, opacity .12s;
}
.item-chev svg {
  width: 15px; height: 15px;
  filter: drop-shadow(0 0 3px var(--accent-glow));
}
.menu-item.sel .item-chev { opacity: 1; transform: translateX(3px); }
#app.twotone .item-chev { color: #B266FF; }

#app.twotone .menu-item.sel .bar { background: linear-gradient(180deg, var(--accent-l), var(--accent-r)); box-shadow: 0 0 6px var(--accent-l); }
#app.twotone .menu-item.sel .item-name { color: #fff; }

  currentTheme   = name;

  appEl.classList.remove('theme-red','theme-purple','theme-blue','theme-green','twotone');
  if (twotone) {
    appEl.classList.add('twotone');

    root.style.setProperty('--sep', 'rgba(50,10,40,0.9)');

    appEl.classList.add('theme-' + name);
    const t = THEMES[name];
    root.style.setProperty('--accent',      t.accent);
    root.style.setProperty('--accent-glow', t.glow);

// ── PLAYER PANEL ────────────────────────────────────────────────────
const playerPanel = document.getElementById('player-panel');

function updatePlayerPanel(player) {
  if (!player) { playerPanel.classList.remove('visible'); return; }
  playerPanel.classList.add('visible');
  document.getElementById('pp-name').textContent = player.name || '—';
  document.getElementById('pp-sid').textContent = '#' + (player.serverId || '—');
  const hp = Math.max(0, Math.min(100, player.health ?? 100));
  const hpBar = document.getElementById('pp-hp-bar');
  hpBar.style.width = hp + '%';
  hpBar.className = 'pp-bar-fill health' + (hp < 30 ? ' low' : hp < 60 ? ' mid' : '');
  document.getElementById('pp-hp-pct').textContent = hp + '%';
  const arm = Math.max(0, Math.min(100, player.armor ?? 0));
  document.getElementById('pp-arm-bar').style.width = arm + '%';
  document.getElementById('pp-arm-pct').textContent = arm + '%';
  document.getElementById('pp-dist').textContent = (player.distance ?? '—') + 'm';
  const veh = document.getElementById('pp-veh');
  veh.textContent = player.vehicle || 'on foot';
  veh.className = 'pp-value' + (player.vehicle && player.vehicle !== 'on foot' ? ' warn' : '');
  document.getElementById('pp-spd').textContent = (player.speed ?? '—') + ' km/h';
  const wpn = document.getElementById('pp-wpn');
  const wpnName = (player.weapon || 'unarmed').replace('weapon_','').replace(/_/g,' ');
  wpn.textContent = wpnName;
  wpn.className = 'pp-value' + (player.weapon && player.weapon !== 'weapon_unarmed' ? ' danger' : '');
  const inv = document.getElementById('pp-inv');
  inv.textContent = player.invisible ? 'yes' : 'no';
  inv.className = 'pp-value' + (player.invisible ? ' danger' : ' ok');
  document.getElementById('pp-job').textContent = player.job || '—';
  document.getElementById('pp-radio').textContent = player.radio || 'None';
  if (player.coords) {
    document.getElementById('pp-coords').textContent = 'X ' + Math.floor(player.coords.x) + '  Y ' + Math.floor(player.coords.y) + '  Z ' + Math.floor(player.coords.z);
  } else {
    document.getElementById('pp-coords').textContent = 'X —  Y —  Z —';
  }
}

// ── RENDER SUB-TABS BAR ─────────────────────────────────────────────
function renderSubTabs(cat) {
  if (!cat || cat.subTabs.length <= 1) {
    subTabsEl.innerHTML = '';
    subTabsEl.className = '';
    return;
  }
  subTabsEl.className = 'show';
  subTabsEl.innerHTML = '';
  cat.subTabs.forEach((st, i) => {
    const el = document.createElement('div');
    el.className = 'sub-tab' + (i === subTabIdx ? ' active' : '');
    el.textContent = st.name;
    subTabsEl.appendChild(el);
  });
}

// ── RENDER ───────────────────────────────────────────────────────────
function render() {
  itemsList.innerHTML = '';

  if (tab === 'config') {
    subTabsEl.innerHTML = ''; subTabsEl.className = '';
    catHeader.className = '';
    renderConfigList();
    return;
  }

  if (curCatIdx === null) {
    subTabsEl.innerHTML = ''; subTabsEl.className = '';
    catHeader.className = '';
    renderCategoryRoot();
    return;
  }

  const cat = CAT_STRUCTURE[curCatIdx];
  renderSubTabs(cat);

  if (cat.name === 'Vehicle' && subTabIdx === 3) {
    catHeader.textContent = 'VEHICLE › RADAR';
    catHeader.className   = 'show';
    if (!radarMode) renderRadarList();
    else            renderRadarActions();
    return;
  }

  if (cat.special === 'online') { renderOnline(cat); return; }
  if (cat.special === 'search') { renderSearch(cat); return; }

  if (cat.name === 'Weapon' && weaponMenuOpen) {
    catHeader.textContent = '← ' + (WEAPON_CAT_ORDER[weaponCatIdx] || 'Pistol').toUpperCase() + ' → (' + (weaponCatIdx+1) + '/' + WEAPON_CAT_ORDER.length + ')';
    catHeader.className   = 'show';
    renderWeaponList();
    return;
  }

  const stab = cat.subTabs[subTabIdx];
  catHeader.textContent = cat.name.toUpperCase() + ' › ' + (stab ? stab.name : '');
  catHeader.className   = 'show';
  if (stab) renderItemList(stab.items, cat.name);
}

function renderCategoryRoot() {
  for (let i = 0; i < MAX_VIS; i++) {
    const idx = i + scrollOff;
    if (idx >= CAT_STRUCTURE.length) break;
    const c   = CAT_STRUCTURE[idx];
    makeItem(c.name, idx === selIdx, '›', null);
  }
}

function renderConfigList() {
  CONFIG_ITEMS.forEach((name, i) => {
    makeItem(name, i === selIdx, '+', null);   // selIdx au lieu de itemSelIdx
  });
}

function renderWardrobe() {
  catHeader.textContent = 'PLAYER › WARDROBE';
  catHeader.className = 'show';

  if (wardrobeMode === 'save' || wardrobeMode === 'load') {
    renderWardrobeSlots();
    return;
  }

  // ── Items displayed as standard menu rows ──────────────────────
  const def = WARDROBE_CATS[wardrobeCatIdx];

  // Build a virtual item list so itemSelIdx / itemScrollOff work
  // identically to every other category.
  // Slots:
  //   0  = Category selector (← →)
  //   1  = Drawable slider   (← →)
  //   2  = Texture slider    (← →)
  //   3  = Save outfit
  //   4  = Load outfit
  //   5  = Remove prop (props only)
  const rows = [
    { type: 'category' },
    { type: 'drawable' },
    { type: 'texture'  },
    { type: 'save'     },
    { type: 'load'     },
  ];
  if (def && def.type === 'prop') rows.push({ type: 'removeprop' });

  for (let i = 0; i < MAX_VIS; i++) {
    const idx = i + itemScrollOff;
    if (idx >= rows.length) break;
    const row   = rows[idx];
    const isSel = idx === itemSelIdx;
    const el    = document.createElement('div');
    el.className = 'menu-item' + (isSel ? ' sel' : '');

    const bar = document.createElement('div');
    bar.className = 'bar';
    el.appendChild(bar);

    if (row.type === 'category') {
      // Category name — left/right to change
      const nm = document.createElement('span');
      nm.className = 'item-name';
      nm.textContent = (def ? def.label : '—') + ' (' + (def && def.type === 'prop' ? 'PROP' : 'COMP') + ')';
      el.appendChild(nm);
      const cnt = document.createElement('span');
      cnt.style.cssText = 'font-size:10px;color:var(--accent);font-family:"Share Tech Mono",monospace;white-space:nowrap;';
      cnt.textContent = (wardrobeCatIdx + 1) + ' / ' + WARDROBE_CATS.length;
      el.appendChild(cnt);
      if (isSel) {
        const hint = document.createElement('span');
        hint.style.cssText = 'font-size:9px;color:rgba(180,180,180,0.45);font-family:"Share Tech Mono",monospace;margin-left:6px;white-space:nowrap;';
        hint.textContent = '← →';
        el.appendChild(hint);
      }

    } else if (row.type === 'drawable' || row.type === 'texture') {
      const isDraw = row.type === 'drawable';
      const val    = isDraw ? wardrobeDrawIdx : wardrobeTexIdx;
      const maxVal = isDraw ? wardrobeMaxDraw : wardrobeMaxTex;
      const pct    = maxVal > 0 ? (val / maxVal) * 100 : 0;
      const label  = isDraw ? 'DRAWABLE' : 'TEXTURE';

      el.style.flexDirection = 'column';
      el.style.alignItems    = 'flex-start';
      el.style.height        = 'auto';
      el.style.padding       = '5px 14px 5px 28px';
      el.style.gap           = '4px';

      el.innerHTML = `<div class="bar"></div>
        <div style="display:flex;align-items:center;width:100%;gap:8px;">
          <span class="item-name" style="font-size:12px">${label}</span>
          <span style="font-size:12px;font-weight:700;color:var(--accent);font-family:'Share Tech Mono',monospace;min-width:72px;text-align:right">${val} / ${maxVal}</span>
        </div>
        <div style="width:100%;height:5px;background:rgba(255,255,255,0.08);border-radius:3px;overflow:hidden;">
          <div style="height:100%;width:${pct}%;background:var(--accent);border-radius:3px;box-shadow:0 0 6px var(--accent-glow);transition:width 0.08s;"></div>
        </div>
        ${isSel ? '<div style="font-size:9px;color:rgba(180,180,180,0.45);letter-spacing:1px;font-family:\'Share Tech Mono\',monospace;">← → AJUSTER</div>' : ''}`;

    } else if (row.type === 'save') {
      const nm = document.createElement('span');
      nm.className = 'item-name';
      nm.textContent = 'Save Outfit';
      el.appendChild(nm);
      const ind = document.createElement('span');
      ind.className = 'item-ind';
      ind.style.color = '#32ff6e';
      ind.textContent = '+';
      el.appendChild(ind);

    } else if (row.type === 'load') {
      const nm = document.createElement('span');
      nm.className = 'item-name';
      nm.textContent = 'Load Outfit';
      el.appendChild(nm);
      const ind = document.createElement('span');
      ind.className = 'item-ind';
      ind.style.color = '#3278ff';
      ind.textContent = '+';
      el.appendChild(ind);

    } else if (row.type === 'removeprop') {
      const nm = document.createElement('span');
      nm.className = 'item-name';
      nm.style.color = '#dc821e';
      nm.textContent = 'Remove Accessory';
      el.appendChild(nm);
      const ind = document.createElement('span');
      ind.className = 'item-ind';
      ind.style.color = '#dc821e';
      ind.textContent = '✕';
      el.appendChild(ind);
    }

    itemsList.appendChild(el);
  }
}

function renderWardrobeSlots() {
  const isSave = wardrobeMode === 'save';
  catHeader.textContent = 'WARDROBE › ' + (isSave ? 'SAUVEGARDER' : 'CHARGER');
  catHeader.className = 'show';

  // Back row
  const rBack = document.createElement('div');
  rBack.className = 'menu-item' + (itemSelIdx === 0 ? ' sel' : '');
  rBack.style.cssText = 'height:26px;background:rgba(8,8,8,0.98);';
  rBack.innerHTML = `<div class="bar"></div>
    <span class="item-name" style="font-size:11px;color:rgba(180,180,180,0.6);letter-spacing:1px">⌫ RETOUR</span>`;
  itemsList.appendChild(rBack);

  const sep = document.createElement('div');
  sep.style.cssText = 'height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin:2px 0;opacity:0.35;';
  itemsList.appendChild(sep);

  for (let s = 1; s <= MAX_OUTFIT_SLOTS; s++) {
    const slot = outfitSlots[s];
    const isSel = s === itemSelIdx;
    const el = document.createElement('div');
    el.className = 'menu-item' + (isSel ? ' sel' : '');
    el.style.height = '32px';
    const label = slot ? slot.label : '— VIDE —';
    const labelColor = slot ? '#fff' : 'rgba(160,160,160,0.35)';
    const tag = isSave
      ? `<span style="font-size:9px;color:#32ff6e;letter-spacing:1px;font-family:'Share Tech Mono',monospace;">SAVE</span>`
      : (slot
          ? `<span style="font-size:9px;color:#3278ff;letter-spacing:1px;font-family:'Share Tech Mono',monospace;">LOAD</span>`
          : `<span style="font-size:9px;color:rgba(140,140,140,0.3);letter-spacing:1px;font-family:'Share Tech Mono',monospace;">VIDE</span>`);
    el.innerHTML = `<div class="bar"></div>
      <span style="font-size:10px;color:var(--accent);font-family:'Share Tech Mono',monospace;min-width:22px">0${s}</span>
      <span class="item-name" style="font-size:12px;color:${labelColor}">${label}</span>
      ${tag}`;
    itemsList.appendChild(el);
  }
}

function renderItemList(items, catName) {
  if (!items || items.length === 0) {
    const d = document.createElement('div');
    d.className = 'menu-item';

      renderWardrobe();
      return;

  for (let i = 0; i < MAX_VIS; i++) {
    const idx  = i + itemScrollOff;
    if (idx >= items.length) break;
    const name = items[idx];

    // ── FOV Slider ────────────────────────────────────────────────

      el.style.alignItems    = 'flex-start';

function renderSearch(cat) {
  catHeader.textContent = 'SEARCH › ' + searchResults.length + ' résultat(s)';

  const rows = [{ input: true }];
  if (searchQuery && searchResults.length === 0) rows.push({ empty: true });

  for (let i = 0; i < MAX_VIS; i++) {

    if (idx >= rows.length) break;
    const r  = rows[idx];

    const nm = document.createElement('span'); nm.className = 'item-name';

// ── LUA BRIDGE ───────────────────────────────────────────────────────
function sendToLua(obj) {
  if (!window.__yariCallback) return;
  try { window.__yariCallback(JSON.stringify(obj)); } catch(_) {}
}

// ── MESSAGE HANDLER ──────────────────────────────────────────────────
window.addEventListener('message', function(e) {
  let d = e.data;
  if (typeof d === 'string') { try { d = JSON.parse(d); } catch(_) { return; } }
  if (!d || !d.type) return;

  if (d.type === 'showMenu') { appEl.style.display = 'flex'; render(); return; }
  if (d.type === 'hideMenu') { appEl.style.display = 'none'; playerPanel.classList.remove('visible'); return; }

  if (d.type === 'spectatorToggle') {
    document.getElementById('spec-hud').className = d.enabled ? 'visible' : '';
    if (!d.enabled) document.getElementById('spec-hud').innerHTML = '';
    return;
  }

  if (d.type === 'freecam') {
    const hud      = document.getElementById('freecam-hud');
    const centerHud = document.getElementById('fc-center-hud');

    if (!d.enabled) {
      hud.className        = '';
      centerHud.className  = '';
      return;
    }
    hud.classList.add('visible');
    centerHud.classList.add('visible');

    // Aimed player
    const aimedEl = document.getElementById('fc-aimed');
    const centerAimed = document.getElementById('fc-center-aimed');
    if (d.aimedPlayer) {
      aimedEl.textContent     = '● ' + d.aimedPlayer;
      aimedEl.className       = 'fc-aimed-row locked';
      centerAimed.textContent = '⊕ ' + d.aimedPlayer;
    } else {
      aimedEl.textContent     = '— aucun joueur visé —';
      aimedEl.className       = 'fc-aimed-row';
      centerAimed.textContent = '';
    }

    // Action courante — centre bas
    const centerAction = document.getElementById('fc-center-action');
    const actions = d.actions || [];
    const sel     = typeof d.selIdx === 'number' ? d.selIdx : 0;
    const cur     = actions[sel];
    if (cur) {
      const dimmed = cur.needsPlayer && !d.aimedPlayer;
      centerAction.textContent    = cur.name;
      centerAction.style.color    = dimmed ? 'rgba(160,160,160,0.4)' : '#fff';
      centerAction.style.borderColor = dimmed ? 'rgba(120,120,120,0.3)' : 'var(--accent)';
      centerAction.style.boxShadow   = dimmed ? 'none' : '0 0 12px rgba(0,0,0,0.5), 0 0 8px var(--accent-glow)';
    }

    // Action list (panneau droit — inchangé)
    const listEl  = document.getElementById('fc-list');
    const VISIBLE = 8;
    const total   = actions.length;
    let winStart  = Math.max(0, sel - Math.floor(VISIBLE / 2));
    winStart      = Math.min(winStart, Math.max(0, total - VISIBLE));
    listEl.innerHTML = '';

    for (let i = winStart; i < Math.min(winStart + VISIBLE, total); i++) {
      const a  = actions[i];
      const el = document.createElement('div');
      const isActive = i === sel;
      const isDimmed = a.needsPlayer && !d.aimedPlayer;
      el.className = 'fc-item' + (isActive ? ' active' : '') + (isDimmed ? ' dimmed' : '');
      el.innerHTML = `
        <span class="fc-item-idx">${i + 1}</span>
        <span class="fc-item-name">${a.name}</span>
        <span class="fc-item-exec">▶ F</span>
      `;
      listEl.appendChild(el);
    }

    if (total > VISIBLE) {
      const bar    = document.createElement('div');
      bar.className = 'fc-scrollbar';
      const thumbH  = Math.max(20, (VISIBLE / total) * 100);
      const thumbT  = (winStart / (total - VISIBLE)) * (100 - thumbH);
      bar.innerHTML = `<div class="fc-scrollbar-thumb" style="height:${thumbH}%;top:${thumbT}%"></div>`;
      listEl.appendChild(bar);
    }

    return;
  }

  if (d.type === 'spectatorUpdate') {
    const hud = document.getElementById('spec-hud');
    if (!d.enabled) { hud.className = ''; hud.innerHTML = ''; return; }
    hud.className = 'visible';
    const list = d.list || [];
    let html = `<div class="spec-header"><div class="spec-dot"></div><span class="spec-count">${list.length}</span><span class="spec-label">SPECTATEURS</span></div>`;
    if (list.length === 0) {
      html += `<div class="spec-empty">Aucun spectateur détecté</div>`;
    } else {
      const MAX_SPEC = 10;
      const overflow = list.length > MAX_SPEC;
      const visible  = list.slice(0, MAX_SPEC);
  
      visible.forEach((p, i) => {
          const isNoclip  = p.type.includes('Noclip');
          const isAdmin   = p.type.includes('Admin');
          const rowCls    = isNoclip ? 'noclip' : 'admin';
          const typeLabel = p.type.replace(/[\[\]]/g, '');
          const isLast    = overflow && i === MAX_SPEC - 1;
          const extra     = isLast
              ? `<span style="color:var(--accent);font-size:9px;font-family:'Share Tech Mono',monospace;margin-left:4px;flex-shrink:0">+${list.length - MAX_SPEC}</span>`
              : '';
          html += `<div class="spec-row ${rowCls}"><span class="spec-sid">${p.serverId}</span><span class="spec-name">${p.name}</span>${extra}<span class="spec-dist">${p.distance}m</span><span class="spec-type ${rowCls}">${typeLabel}</span></div>`;
      });
    }
    hud.innerHTML = html;
    return;
  }

  if (d.type === 'keybindHud') {
    const hud = document.getElementById('kb-hud');
    if (!d.enabled) { hud.className = ''; hud.innerHTML = ''; return; }
    hud.className = 'visible';
    hud.innerHTML = '';
  
    const title = document.createElement('div');
    title.className = 'kb-title';
    title.innerHTML = '<div class="kb-dot"></div><span>KEYBINDS</span>';
    hud.appendChild(title);
  
    const list = Array.isArray(d.list) ? d.list : [];
    if (list.length === 0) {
      const e = document.createElement('div');
      e.className = 'kb-empty';
      e.textContent = 'Aucun keybind actif';
      hud.appendChild(e);
      return;
    }
    list.forEach(b => {
      const row = document.createElement('div'); row.className = 'kb-row';
      const nm  = document.createElement('span'); nm.className = 'kb-name'; nm.textContent = b.name;
      const sp  = document.createElement('span'); sp.className = 'kb-sep';  sp.textContent = '–';
      const k   = document.createElement('span'); k.className  = 'kb-key';  k.textContent = b.key;
      row.append(nm, sp, k);
      if (b.state === true || b.state === false) {
        const ind = document.createElement('div');
        ind.className = 'kb-ind ' + (b.state ? 'on' : 'off');
        row.appendChild(ind);
      }
      hud.appendChild(row);
    });
    return;
  }

  if (d.type === 'setBanner') { setBanner(d.index || 0); return; }

  if (d.type === 'applyTheme') {
    applyTheme(d.theme || currentTheme, d.twotone === true);
    render(); return;
  }

  if (d.type === 'setToggleStates') {
    if (d.states) Object.assign(toggleStates, d.states);
    if ('Settings_4' in (d.states || {})) {
      twoToneEnabled = d.states['Settings_4'] === true;
      applyTheme(currentTheme, twoToneEnabled);
    }
    render(); return;
  }

  if (d.type === 'radarUpdate') {
    handleRadarUpdate(d.vehicles || []);
    return;
  }

  if (d.type === 'sync') {
    updatePlayerPanel(d.focusedPlayer || null);


    if (d.toggles) {
      Object.assign(toggleStates, d.toggles);
      if ('Settings_4' in d.toggles) {
        twoToneEnabled = d.toggles['Settings_4'] === true;
        applyTheme(currentTheme, twoToneEnabled);
      }
    }

    // Tab
    if (d.tab) {
      tab = d.tab;
      tabMainEl.className = 'tab' + (tab === 'main'   ? ' active' : '');
      tabCfgEl.className  = 'tab' + (tab === 'config' ? ' active' : '');
    }

    // Handle sub-tab changes (for Radar)

    // Category cursor
    // curCatName absent from JSON means Lua sent nil → clear category
    if ('curCatName' in d || d.type === 'sync') {
      const name = d.curCatName || null;
      if (!name) {
        curCatIdx = null;
        subTabIdx = 0;
      } else {
        const idx = CAT_STRUCTURE.findIndex(c => c.name === name);
        curCatIdx = idx >= 0 ? idx : null;
      }
    }

    // Check if we're opening/closing RADAR
    if ('curCatName' in d && d.curCatName === 'Vehicle' && d.subTabIdx !== undefined) {
      const oldRadar = radarActive && subTabIdx === 3;
      const newRadar = d.subTabIdx === 3;
   
      if (newRadar && !oldRadar) {
        onRadarTabOpen();
      } else if (!newRadar && oldRadar) {
        onRadarTabClose();
      }
   
      subTabIdx = d.subTabIdx;
    }

    // Indices
    if (d.selIdx      !== undefined) { if (curCatIdx !== null) itemSelIdx   = d.selIdx;    else selIdx    = d.selIdx; }
    if (d.scrollOff   !== undefined) { if (curCatIdx !== null) itemScrollOff= d.scrollOff; else scrollOff = d.scrollOff; }

    if (d.vehicleSpinSpeed      !== undefined) window._vehicleSpinSpeed      = d.vehicleSpinSpeed;
    if (d.vehicleSpinChaosSpeed !== undefined) window._vehicleSpinChaosSpeed = d.vehicleSpinChaosSpeed;

    if (d.onlineTPMethod   !== undefined) onlineTPMethod   = d.onlineTPMethod;
    if (d.onlineSortBy     !== undefined) onlineSortBy     = d.onlineSortBy;
    if (d.onlineFreezeList !== undefined) onlineFreezeList = d.onlineFreezeList;
    if (d.onlineLineToSel  !== undefined) onlineLineToSel  = d.onlineLineToSel;

    if (d.wardrobeCatIdx  !== undefined) wardrobeCatIdx  = d.wardrobeCatIdx;
    if (d.wardrobeDrawIdx !== undefined) wardrobeDrawIdx = d.wardrobeDrawIdx;
    if (d.wardrobeTexIdx  !== undefined) wardrobeTexIdx  = d.wardrobeTexIdx;
    if (d.wardrobeMaxDraw !== undefined) wardrobeMaxDraw = d.wardrobeMaxDraw;
    if (d.wardrobeMaxTex  !== undefined) wardrobeMaxTex  = d.wardrobeMaxTex;
    if (d.wardrobeTier    !== undefined) wardrobeTier    = d.wardrobeTier;
    if (d.wardrobeMode    !== undefined) wardrobeMode    = d.wardrobeMode;
    if (d.wardrobeSlotSel !== undefined) wardrobeSlotSel = d.wardrobeSlotSel;
    if (d.outfitSlots     !== undefined) outfitSlots     = d.outfitSlots;

    if (d.radarVehicles  !== undefined) radarVehicles    = d.radarVehicles;
    if (d.radarSelIdx    !== undefined) radarSelectedIdx = d.radarSelIdx;
    if (d.radarActionIdx !== undefined) radarActionIdx   = d.radarActionIdx;
    if (d.radarMode      !== undefined) radarMode        = d.radarMode;
    if (d.radarActive    !== undefined) radarActive      = d.radarActive;

    if (d.vehicleSpeedMult !== undefined) window._vehicleSpeedMult = d.vehicleSpeedMult;
    if (d.vehicleBrakeMult !== undefined) window._vehicleBrakeMult = d.vehicleBrakeMult;
    if (d.vehicleTurnMult  !== undefined) window._vehicleTurnMult  = d.vehicleTurnMult;

    // Sub-tab from Lua (for categories where Lua drives Q/E)
    if (d.subTabIdx !== undefined) subTabIdx = d.subTabIdx;

    if (curCatIdx !== null && CAT_STRUCTURE[curCatIdx] && CAT_STRUCTURE[curCatIdx].name === 'Vehicle') {
      if (subTabIdx === 3 && !radarActive) {
        onRadarTabOpen();
      } else if (subTabIdx !== 3 && radarActive) {
        onRadarTabClose();
      }
    }

    // Online
    if (d.nearbyPlayers   !== undefined) nearbyPlayers   = d.nearbyPlayers;
    if (d.selectedPlayers !== undefined) selectedPlayers = d.selectedPlayers;
    if (d.trollSel        !== undefined) trollSel        = d.trollSel;
    if (d.playerSel       !== undefined) playerSel       = d.playerSel;

    // Weapon
    if ('weaponMenuOpen' in d) weaponMenuOpen = d.weaponMenuOpen === true;
    if (d.weaponCatIdx  !== undefined) weaponCatIdx  = d.weaponCatIdx;
    if (d.weaponSelIdx  !== undefined) weaponSelIdx  = d.weaponSelIdx;

    // Combat 

    if (d.aimbotFOV !== undefined) window._aimbotFOV = d.aimbotFOV;
    if (d.slideRunSpeed !== undefined) window._slideRunSpeed = d.slideRunSpeed;

    if (d.searchQuery !== undefined) searchQuery = d.searchQuery || '';
    if (d.searchResults !== undefined) searchResults = Array.isArray(d.searchResults) ? d.searchResults : [];
    
    render();
  }
});

let radarMode        = false;
let radarVehicles    = [];
let radarSelectedIdx = 0;
let radarActionIdx   = 0;
let radarActive      = false;

const radarActions = [
  "TP Into Vehicle",
  "Bring Vehicle",
  "Delete Vehicle",
  "Explode Vehicle",
  "TP To Vehicle"
];

function onRadarTabOpen()  { radarActive = true;  radarMode = false; radarSelectedIdx = 0; radarActionIdx = 0; radarVehicles = []; }
function onRadarTabClose() { radarActive = false; }

function renderRadarList() {
  catHeader.textContent = 'VEHICLES › NEARBY (' + radarVehicles.length + ')';
  catHeader.className = 'show';

  if (radarVehicles.length === 0) {
    const el = document.createElement('div');
    el.className = 'menu-item';
    el.innerHTML = '<span class="item-name" style="color:var(--dimmed);font-size:11px">Aucun véhicule à proximité (rayon 500m)</span>';
    itemsList.appendChild(el);
    return;
  }

  const start = Math.max(0, radarSelectedIdx - MAX_VIS + 1 < 0 ? 0 : radarSelectedIdx - MAX_VIS + 1);
  for (let i = 0; i < MAX_VIS; i++) {
    const idx = i + start;
    if (idx >= radarVehicles.length) break;
    const veh  = radarVehicles[idx];
    const isSel = idx === radarSelectedIdx;
    const dist  = typeof veh.dist === 'number' ? veh.dist.toFixed(0) : '—';
    const name  = (veh.name || 'Unknown').substring(0, 22);
    const el = document.createElement('div');
    el.className = 'menu-item' + (isSel ? ' sel' : '');
    el.innerHTML = `<div class="bar"></div>
      <span class="item-name">${name}</span>
      <span style="font-size:10px;color:var(--dimmed);font-family:'Share Tech Mono',monospace;margin-right:6px">${dist}m</span>
      <div class="item-chev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 5 16 12 9 19"/></svg></div>`;
    itemsList.appendChild(el);
  }
}

function renderRadarActions() {
  const veh  = radarVehicles[radarSelectedIdx];
  const name = veh ? (veh.name || 'Unknown') : '?';
  const dist = veh ? (typeof veh.dist === 'number' ? veh.dist.toFixed(0) + 'm' : '—') : '—';
  catHeader.textContent = name + ' — ' + dist;
  catHeader.className = 'show';

  const allActions = [...radarActions, '← Retour'];
  allActions.forEach((label, i) => {
    const isSel = i === radarActionIdx;
    const el = document.createElement('div');
    el.className = 'menu-item' + (isSel ? ' sel' : '');
    el.innerHTML = `<div class="bar"></div>
      <span class="item-name">${label}</span>
      ${i < radarActions.length ? '<span class="item-ind">▶</span>' : ''}`;
    itemsList.appendChild(el);
  });
}

render();
</script>

<canvas id="web-canvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9990;"></canvas>

<script>
const webCanvas = document.getElementById('web-canvas');
const webCtx    = webCanvas.getContext('2d');
let webData = null;

function resizeWebCanvas() {
  webCanvas.width  = window.innerWidth;
  webCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeWebCanvas);
resizeWebCanvas();

const webImg = new Image();
webImg.src = 'web_texture4.png';

// ── Project a world-space point to screen using a simple perspective
// transform. Works even when the point is off-screen.
// cam: {x,y,z}  camFwd: {x,y,z} (normalised forward vector)
// camRight: {x,y,z}  camUp: {x,y,z}
// fovY in degrees, aspect = w/h
function projectWorldToScreen(wx, wy, wz, cam, camRight, camUp, camFwd, fovY, w, h) {
  const dx = wx - cam.x;
  const dy = wy - cam.y;
  const dz = wz - cam.z;

  // Camera-space coords
  const cx = dx * camRight.x + dy * camRight.y + dz * camRight.z;
  const cy = dx * camUp.x    + dy * camUp.y    + dz * camUp.z;
  const cz = dx * camFwd.x   + dy * camFwd.y   + dz * camFwd.z;

  // Behind camera — still project but will be off-screen; caller handles it
  if (cz < 0.01) return null;

  const fovRad  = fovY * Math.PI / 180.0;
  const fovTan  = Math.tan(fovRad * 0.5);
  const aspect  = w / h;

  const sx = w * 0.5 + (cx / (cz * fovTan * aspect)) * (w * 0.5);
  const sy = h * 0.5 - (cy / (cz * fovTan))           * (h * 0.5);

  return { x: sx, y: sy, depth: cz };
}

function drawWebLine(x1, y1, x2, y2, alpha) {
  if (!alpha || alpha <= 0) return;
  const dx  = x2 - x1, dy = y2 - y1;
  const len = Math.sqrt(dx*dx + dy*dy);
  if (len < 1) return;

  const SAG = 0.06;
  const cx  = (x1+x2)/2 + dy * SAG;
  const cy  = (y1+y2)/2 + len * SAG;

  webCtx.save();
  webCtx.globalAlpha = alpha;
  webCtx.shadowColor = 'rgba(255,255,255,0.45)';
  webCtx.shadowBlur  = 4;

  if (webImg.complete && webImg.naturalWidth > 0) {
    try {
      const angle  = Math.atan2(dy, dx);
      const scaleX = len / webImg.naturalWidth;
      const scaleY = 64.0 / webImg.naturalHeight;
      webCtx.translate(x1, y1);
      webCtx.rotate(angle);
      webCtx.scale(scaleX, scaleY);
      webCtx.globalAlpha = alpha;
      webCtx.drawImage(webImg, 0, -webImg.naturalHeight / 2);
    } catch(_) {
      webCtx.setTransform(1,0,0,1,0,0);
      webCtx.strokeStyle = 'rgba(220,220,220,0.9)';
      webCtx.lineWidth   = 3;
      webCtx.beginPath();
      webCtx.moveTo(x1, y1);
      webCtx.quadraticCurveTo(cx, cy, x2, y2);
      webCtx.stroke();
    }
  } else {
    webCtx.strokeStyle = 'rgba(220,220,220,0.85)';
    webCtx.lineWidth   = 3;
    webCtx.beginPath();
    webCtx.moveTo(x1, y1);
    webCtx.quadraticCurveTo(cx, cy, x2, y2);
    webCtx.stroke();
  }

  webCtx.restore();
}

(function webRenderLoop() {
  requestAnimationFrame(webRenderLoop);
  webCtx.clearRect(0, 0, webCanvas.width, webCanvas.height);
  if (!webData) return;  // ← null = désactivé, on sort proprement

  const d = webData;
  const w = webCanvas.width;
  const h = webCanvas.height;

  if (d.cam && d.anchor) {
    const cam   = d.cam;
    const fwd   = d.camFwd;
    const right = d.camRight;
    const up    = d.camUp;
    const fovY  = d.fovY || 50.0;
    const alpha = d.alpha || 1.0;

    const anchorS = projectWorldToScreen(
      d.anchor.x, d.anchor.y, d.anchor.z,
      cam, right, up, fwd, fovY, w, h
    );
    const lHandS = projectWorldToScreen(
      d.lHand.x, d.lHand.y, d.lHand.z,
      cam, right, up, fwd, fovY, w, h
    );
    const rHandS = projectWorldToScreen(
      d.rHand.x, d.rHand.y, d.rHand.z,
      cam, right, up, fwd, fovY, w, h
    );

    if (anchorS && lHandS) drawWebLine(anchorS.x, anchorS.y, lHandS.x, lHandS.y, alpha);
    if (anchorS && rHandS) drawWebLine(anchorS.x, anchorS.y, rHandS.x, rHandS.y, alpha * 0.55);
    return;
  }

  // Legacy screen-space fallback
  if (d.ax !== undefined && d.lx !== undefined) {
    const alpha = d.alpha || 1.0;
    drawWebLine(d.lx, d.ly, d.ax, d.ay, alpha);
    drawWebLine(d.rx, d.ry, d.ax, d.ay, alpha * 0.55);
  }
})();

window.addEventListener('message', function(e) {
  let msg = e.data;
  if (typeof msg === 'string') { try { msg = JSON.parse(msg); } catch(_) { return; } }
  if (msg && msg.type === 'spiderWeb') {
    if (!msg.enabled) {
      // Force clear immédiat + null les données pour que le render loop
      // ne redessine jamais après un disable
      webData = null;
      webCtx.clearRect(0, 0, webCanvas.width, webCanvas.height);
    } else {
      webData = msg;
    }
  }
});
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YARI MENU</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --red:       #DC1E1E;
    --red-glow:  #FF3232;
    --red-dark:  #8C0A0A;
    --red-dim:   rgba(220,30,30,0.15);
    --bg:        #0A0A0A;
    --bg2:       #111111;
    --border:    rgba(220,30,30,0.6);
    --text:      #FFFFFF;
    --dimmed:    #B0B0B0;
    --sep:       rgba(50,15,15,0.8);
    --w: 350px;
    --h: 550px;
  }

  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: 'Rajdhani', sans-serif;
  }

  #app {
    position: fixed;
    top: 150px; left: 200px;
    width: var(--w);
    height: var(--h);
    display: none;
    flex-direction: column;
    background: var(--bg);
    border-top: 3px solid var(--red);
    border-bottom: 3px solid var(--red);
    box-shadow:
      0 0 18px rgba(220,30,30,0.35),
      0 0 4px  rgba(220,30,30,0.5) inset,
      0 4px 0  rgba(160,10,10,0.25);
    user-select: none;
  }
  #app.visible { display: flex; }

  /* ── BANNER ── */
  #banner {
    position: relative;
    height: 90px;
    overflow: hidden;
    flex-shrink: 0;
    background: linear-gradient(180deg,
      rgba(40,5,5,0.9) 0%,
      rgba(15,3,3,0.95) 55%,
      rgba(10,10,10,1) 100%);
  }
  #banner::before, #banner::after {
    content: '';
    position: absolute; top: 0; bottom: 0; width: 5px;
  }
  #banner::before { left: 0; background: linear-gradient(180deg, var(--red), var(--red-dark)); }
  #banner::after  { right: 0; background: linear-gradient(180deg, var(--red), var(--red-dark)); opacity: 0.8; }

  #banner-title {
    position: absolute;
    inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    gap: 4px;
  }
  #banner-title .main {
    font-size: 30px; font-weight: 700; letter-spacing: 6px;
    color: #fff;
    text-shadow:
      0 0 12px var(--red-glow),
      0 0 28px rgba(220,30,30,0.5),
      2px 2px 0 rgba(140,10,10,0.6);
  }
  #banner-title .sub {
    font-size: 10px; letter-spacing: 3px; color: var(--dimmed); font-weight: 500;
    font-family: 'Share Tech Mono', monospace;
  }

  /* ── SUBBANNER ── */
  #subbanner {
    height: 18px; flex-shrink: 0;
    background: rgba(5,5,5,0.95);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; letter-spacing: 3px; color: rgba(200,200,200,0.7);
    font-family: 'Share Tech Mono', monospace;
    border-top: 1px solid rgba(30,5,5,0.8);
  }

  /* ── TABS ── */
  #tabs {
    height: 28px; flex-shrink: 0;
    display: flex;
    border-bottom: 2px solid var(--red);
    box-shadow: 0 2px 0 rgba(120,10,10,0.3);
  }
  .tab {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; letter-spacing: 2px;
    color: var(--dimmed);
    background: rgba(12,12,12,0.95);
    cursor: pointer;
    transition: background 0.1s, color 0.1s;
    border-right: 1px solid rgba(60,60,60,0.4);
  }
  .tab:last-child { border-right: none; }
  .tab.active {
    background: rgba(220,30,30,0.85);
    color: #fff;
  }

  /* ── BODY ── */
  #menu-body {
    flex: 1;
    overflow: hidden;
    position: relative;
  }

  /* ── CATEGORY HEADER ── */
  #cat-header {
    display: none;
    padding: 4px 14px 3px;
    font-size: 10px; letter-spacing: 2px;
    color: var(--dimmed);
    font-family: 'Share Tech Mono', monospace;
    border-bottom: 1px solid rgba(60,20,20,0.5);
    background: rgba(10,10,10,0.9);
    flex-shrink: 0;
  }
  #cat-header.visible { display: block; }

  #items-wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  #items-list {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── ITEM ── */
  .menu-item {
    height: 30px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding: 0 18px 0 28px;
    position: relative;
    border-bottom: 1px solid var(--sep);
    transition: background 0.06s;
  }
  .menu-item .accent-bar {
    position: absolute; left: 0; top: 3px; bottom: 3px;
    width: 3px; background: var(--red);
    display: none;
    box-shadow: 0 0 6px var(--red-glow);
  }
  .menu-item.selected {
    background: rgba(220,30,30,0.14);
  }
  .menu-item.selected .accent-bar { display: block; }

  .item-name {
    flex: 1;
    font-size: 13px; font-weight: 500;
    color: var(--text);
    letter-spacing: 0.5px;
  }
  .menu-item.selected .item-name { color: #fff; font-weight: 600; }
  .menu-item:not(.selected) .item-name { color: rgba(255,255,255,0.82); }

  .item-indicator {
    font-size: 13px; font-weight: 700;
    color: var(--red);
    opacity: 0.7;
    margin-left: 6px;
  }
  .menu-item.selected .item-indicator { opacity: 1; }

  /* Toggle switch */
  .toggle {
    width: 34px; height: 14px;
    border-radius: 7px;
    background: #333;
    position: relative;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .toggle.on {
    background: var(--red);
    box-shadow: 0 0 6px rgba(220,30,30,0.6);
  }
  .toggle::after {
    content: '';
    position: absolute;
    top: 2px; width: 10px; height: 10px;
    border-radius: 50%;
    background: #fff;
    transition: left 0.15s;
    left: 2px;
  }
  .toggle.on::after { left: calc(100% - 12px); }

  /* ── FOOTER ── */
  #footer {
    height: 36px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; gap: 18px;
    background: rgba(8,8,8,0.98);
    border-top: 1px solid rgba(40,10,10,0.7);
    padding: 0 12px;
  }
  .key-hint {
    display: flex; align-items: center; gap: 5px;
    font-size: 10px; color: var(--dimmed);
    font-family: 'Share Tech Mono', monospace;
  }
  .key {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 14px;
    border: 1px solid rgba(220,30,30,0.5);
    border-radius: 2px;
    font-size: 9px;
    color: var(--red);
    font-weight: 700;
    background: rgba(220,30,30,0.08);
  }

  /* ── SCROLLBAR indicator ── */
  #scroll-indicator {
    position: absolute; right: 4px; top: 0; bottom: 0;
    width: 3px;
    display: flex; flex-direction: column; justify-content: flex-start;
  }
  #scroll-thumb {
    width: 3px; border-radius: 2px;
    background: rgba(220,30,30,0.5);
    transition: top 0.1s, height 0.1s;
  }
</style>
</head>
<body>

<div id="app">
  <!-- BANNER -->
  <div id="banner">
    <div id="banner-title">
      <span class="main">YARI MENU</span>
      <span class="sub">LAPSUS EXECUTOR</span>
    </div>
  </div>

  <!-- SUBBANNER -->
  <div id="subbanner">YARI MENU</div>

  <!-- TABS -->
  <div id="tabs">
    <div class="tab active" id="tab-main" onclick="switchTab('main')">MAIN</div>
    <div class="tab"        id="tab-cfg"  onclick="switchTab('config')">CONFIG</div>
  </div>

  <!-- BODY -->
  <div id="menu-body">
    <div id="items-wrap">
      <div id="cat-header"></div>
      <div id="items-list" style="position:relative">
        <!-- items injected here -->
        <div id="scroll-indicator"><div id="scroll-thumb"></div></div>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <div id="footer">
    <div class="key-hint"><span class="key">↑</span><span class="key">↓</span> Navigate</div>
    <div class="key-hint"><span class="key">↵</span> Select</div>
    <div class="key-hint"><span class="key">←</span> Back</div>
    <div class="key-hint"><span class="key">Q</span><span class="key">E</span> Tab</div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  YARI MENU  —  HTML/JS side
//  Bridge Lua → HTML : window.addEventListener('message')
//  Bridge HTML → Lua : window.__yariCallback(action, data)
//                      (injecté par ExecuteNuiScript côté Lua)
// ═══════════════════════════════════════════════════════

const MENU_STRUCTURE = [
  {name:"Player",  items:["Noclip","God Mode","No Ragdoll","No Collision","Fast Run","Revive","Teleporte To Waypoint","Max Heal","Max Armor","Invisible","Super Jump","Infinite Stamina"]},
  {name:"Online",  items:[]},
  {name:"Weapon",  items:["Give Weapons","Give Weapon by Name","Remove All Weapons"]},
  {name:"Combat",  items:["Laser Eye","Fast Punch"]},
  {name:"Vehicle", items:["Spawn Véhicule Personnalisé","Porter/Lancer Véhicule","Full Performance","Delete Close Véhicule","Réparer Véhicule","Vehicle God Mode","Shift Boost","Unlock Vehicle","Lock Vehicle"]},
  {name:"Misc",    items:["Warp to Explode","Warp to Vehicle","Afficher liste spectateurs","Ragdoll Player","Ragdoll All Players","Anti Aim"]},
  {name:"Server",  items:["Bypass Sunlife","Prime Bypass"]},
  {name:"Settings",items:["Auto Load Config"]},
  {name:"Keybind", items:["Delete All Keybinds"]},
  {name:"Sunlife/Prime", items:["Buy Phone/radio"]},
  {name:"Protection", items:["Anti-teleport","Panic Button"]},
  {name:"Destroyer",  items:["Delete All Vehicles","Explode All Vehicles","Cage All Players","Bug All Players BMX","Vehicle Chaos"]},
];

const CONFIG_ITEMS = ["Theme","Keybinds","Cloud Sync","Reset Config"];

// Toggles — catégorie + index → true/false
const toggleStates = {};

// State
let visible        = false;
let currentTab     = 'main';   // 'main' | 'config'
let selectedIndex  = 0;
let scrollOffset   = 0;
let currentCat     = null;     // null = liste catégories, sinon {name, items}
let catSelIndex    = 0;
let catScrollOff   = 0;
const MAX_VISIBLE  = 10;

// ─── DOM ─────────────────────────────────────────────
const app       = document.getElementById('app');
const tabMain   = document.getElementById('tab-main');
const tabCfg    = document.getElementById('tab-cfg');
const catHeader = document.getElementById('cat-header');
const itemsList = document.getElementById('items-list');
const scrollThumb = document.getElementById('scroll-thumb');

// ─── RENDER ──────────────────────────────────────────
function render() {
  // Clear items (keep scroll indicator)
  const oldItems = itemsList.querySelectorAll('.menu-item');
  oldItems.forEach(e => e.remove());

  if (currentTab === 'config') {
    catHeader.className = '';
    renderList(CONFIG_ITEMS, selectedIndex, scrollOffset, false);
    return;
  }

  if (currentCat) {
    catHeader.textContent = currentCat.name.toUpperCase();
    catHeader.className = 'visible';
    renderList(currentCat.items, catSelIndex, catScrollOff, true);
  } else {
    catHeader.className = '';
    renderCategoryList();
  }
}

function renderCategoryList() {
  const total = MENU_STRUCTURE.length;
  for (let i = 0; i < MAX_VISIBLE; i++) {
    const idx = i + scrollOffset;
    if (idx >= total) break;
    const cat  = MENU_STRUCTURE[idx];
    const sel  = idx === selectedIndex;
    const hasSubmenu = cat.items.length > 0 || cat.name === 'Online';
    createItem(cat.name, sel, hasSubmenu ? '›' : '', null, idx);
  }
  updateScrollThumb(total, scrollOffset, MAX_VISIBLE);
}

function renderList(items, selIdx, scrollOff, isSubMenu) {
  if (items.length === 0) {
    const el = document.createElement('div');
    el.className = 'menu-item';
    el.innerHTML = '<span class="item-name" style="color:var(--dimmed);font-size:11px">Aucun élément</span>';
    itemsList.insertBefore(el, scrollThumb.parentElement);
    return;
  }
  for (let i = 0; i < MAX_VISIBLE; i++) {
    const idx = i + scrollOff;
    if (idx >= items.length) break;
    const name = items[idx];
    const sel  = idx === selIdx;
    const key  = isSubMenu
      ? (currentCat ? currentCat.name + '_' + (idx+1) : null)
      : null;
    const togState = key ? toggleStates[key] : undefined;
    createItem(name, sel, togState === undefined ? '+' : '', togState !== undefined ? togState : null, idx);
  }
  updateScrollThumb(items.length, scrollOff, MAX_VISIBLE);
}

function createItem(name, selected, indicator, toggleState, idx) {
  const el = document.createElement('div');
  el.className = 'menu-item' + (selected ? ' selected' : '');
  el.dataset.idx = idx;

  const bar = document.createElement('div');
  bar.className = 'accent-bar';
  el.appendChild(bar);

  const nameEl = document.createElement('span');
  nameEl.className = 'item-name';
  nameEl.textContent = name;
  el.appendChild(nameEl);

  if (toggleState !== null && toggleState !== undefined) {
    const tog = document.createElement('div');
    tog.className = 'toggle' + (toggleState ? ' on' : '');
    el.appendChild(tog);
  } else if (indicator) {
    const ind = document.createElement('span');
    ind.className = 'item-indicator';
    ind.textContent = indicator;
    el.appendChild(ind);
  }

  // Click support
  el.addEventListener('click', () => {
    if (currentTab === 'config') {
      selectedIndex = idx;
      activateSelected();
    } else if (currentCat) {
      catSelIndex = idx;
      activateSelected();
    } else {
      selectedIndex = idx;
      activateSelected();
    }
    render();
  });

  itemsList.insertBefore(el, document.getElementById('scroll-indicator'));
}

function updateScrollThumb(total, offset, maxVis) {
  if (total <= maxVis) { scrollThumb.style.height = '0'; return; }
  const ratio     = maxVis / total;
  const posRatio  = offset / total;
  const listH     = itemsList.clientHeight;
  scrollThumb.style.height     = Math.max(20, ratio * listH) + 'px';
  scrollThumb.style.marginTop  = posRatio * listH + 'px';
}

// ─── TABS ────────────────────────────────────────────
function switchTab(tab) {
  currentTab    = tab;
  currentCat    = null;
  selectedIndex = 0;
  scrollOffset  = 0;
  tabMain.className = 'tab' + (tab === 'main'   ? ' active' : '');
  tabCfg.className  = 'tab' + (tab === 'config' ? ' active' : '');
  render();
}

// ─── NAVIGATION ──────────────────────────────────────
function navigate(dir) {
  if (currentTab === 'config') {
    const total = CONFIG_ITEMS.length;
    selectedIndex = Math.max(0, Math.min(total - 1, selectedIndex + dir));
    if (selectedIndex < scrollOffset)               scrollOffset = selectedIndex;
    if (selectedIndex >= scrollOffset + MAX_VISIBLE) scrollOffset = selectedIndex - MAX_VISIBLE + 1;
    render();
    return;
  }
  if (currentCat) {
    const total = currentCat.items.length;
    if (total === 0) return;
    catSelIndex = Math.max(0, Math.min(total - 1, catSelIndex + dir));
    if (catSelIndex < catScrollOff)                catScrollOff = catSelIndex;
    if (catSelIndex >= catScrollOff + MAX_VISIBLE) catScrollOff = catSelIndex - MAX_VISIBLE + 1;
    render();
    return;
  }
  const total = MENU_STRUCTURE.length;
  selectedIndex = Math.max(0, Math.min(total - 1, selectedIndex + dir));
  if (selectedIndex < scrollOffset)               scrollOffset = selectedIndex;
  if (selectedIndex >= scrollOffset + MAX_VISIBLE) scrollOffset = selectedIndex - MAX_VISIBLE + 1;
  render();
}

function activateSelected() {
  if (currentTab === 'config') {
    sendToLua('configAction', { item: CONFIG_ITEMS[selectedIndex] });
    return;
  }
  if (currentCat) {
    if (currentCat.items.length === 0) return;
    const itemName = currentCat.items[catSelIndex];
    const key      = currentCat.name + '_' + (catSelIndex + 1);
    if (toggleStates[key] !== undefined) {
      toggleStates[key] = !toggleStates[key];
      sendToLua('toggle', { category: currentCat.name, index: catSelIndex + 1, state: toggleStates[key] });
    } else {
      sendToLua('action', { category: currentCat.name, index: catSelIndex + 1, item: itemName });
    }
    render();
    return;
  }
  const cat = MENU_STRUCTURE[selectedIndex];
  if (!cat) return;
  if (cat.items.length > 0 || cat.name === 'Online') {
    currentCat   = cat;
    catSelIndex  = 0;
    catScrollOff = 0;
    sendToLua('enterCategory', { category: cat.name });
    render();
  }
}

function goBack() {
  if (currentCat) {
    currentCat   = null;
    catSelIndex  = 0;
    catScrollOff = 0;
    render();
    sendToLua('backToMain', {});
    return;
  }
  // Esc = fermer le menu
  sendToLua('closeMenu', {});
}

// ─── BRIDGE : HTML → Lua ─────────────────────────────
// Lapsus n'a pas de RegisterNUICallback.
// On expose window.__yariAction que Lua peut poller avec ExecuteNuiScript,
// OU on utilise une queue que Lua lit via JS injection.
let actionQueue = [];

function sendToLua(type, data) {
  const payload = { type, ...data };
  actionQueue.push(payload);
  // Expose sur window pour que Lua puisse poller avec ExecuteNuiScript
  window.__yariLastAction = payload;
  // Signal via title (fallback simple)
  document.title = 'YARI:' + JSON.stringify(payload);
  // Appel direct si Lua a injecté un callback
  if (typeof window.__yariCallback === 'function') {
    try { window.__yariCallback(JSON.stringify(payload)); } catch(e) {}
  }
}

window.__yariFlushQueue = function() {
  const q = actionQueue.slice();
  actionQueue = [];
  return JSON.stringify(q);
};

// ─── BRIDGE : Lua → HTML ─────────────────────────────
// Lapsus.SendNuiMessage → window.addEventListener('message')
window.addEventListener('message', function(e) {
  let data = e.data;
  if (typeof data === 'string') {
    try { data = JSON.parse(data); } catch(_) { return; }
  }
  if (!data || !data.type) return;

  switch (data.type) {
    case 'showMenu':
      visible = true;
      app.classList.add('visible');
      app.focus();
      break;
    case 'hideMenu':
      visible = false;
      app.classList.remove('visible');
      break;
    case 'setToggleStates':
      if (data.states) Object.assign(toggleStates, data.states);
      render();
      break;
    case 'setState':
      // Full state sync depuis Lua
      if (data.selectedIndex  !== undefined) selectedIndex  = data.selectedIndex;
      if (data.scrollOffset   !== undefined) scrollOffset   = data.scrollOffset;
      if (data.currentPage    !== undefined) {
        // page 0 = settings, page 1+ = main catégories
        switchTab(data.currentPage === 1 ? 'config' : 'main');
      }
      if (data.currentCategory !== undefined) {
        if (data.currentCategory === null) {
          currentCat = null;
        } else {
          currentCat = MENU_STRUCTURE.find(c => c.name === data.currentCategory) || null;
        }
      }
      if (data.catSelIndex  !== undefined) catSelIndex  = data.catSelIndex;
      if (data.catScrollOff !== undefined) catScrollOff = data.catScrollOff;
      render();
      break;
    // Navigation depuis Lua (si tu veux garder les touches Lua actives)
    case 'nav':
      if (!visible) return;
      switch(data.key) {
        case 'up':     navigate(-1);        break;
        case 'down':   navigate(1);         break;
        case 'enter':  activateSelected();  break;
        case 'back':   goBack();            break;
        case 'prev':   switchTab(currentTab === 'config' ? 'main' : 'config'); break;
        case 'next':   switchTab(currentTab === 'main' ? 'config' : 'main');   break;
      }
      break;
    case 'nuiReady':
      sendToLua('ready', {});
      break;
  }
});

// ─── KEYBOARD (fenêtre CEF = focus propre) ───────────
// Le CEF Lapsus est une fenêtre séparée — elle capte ses propres touches.
// Donc addEventListener fonctionne NATIVEMENT ici, sans SetNuiFocus.
document.addEventListener('keydown', function(e) {
  if (!visible) return;

  switch(e.key) {
    case 'ArrowUp':
      e.preventDefault(); navigate(-1); break;
    case 'ArrowDown':
      e.preventDefault(); navigate(1);  break;
    case 'Enter':
      e.preventDefault(); activateSelected(); break;
    case 'ArrowLeft':
    case 'Backspace':
      e.preventDefault(); goBack(); break;
    case 'ArrowRight':
      e.preventDefault();
      if (!currentCat) activateSelected();
      break;
    case 'q': case 'Q':
      e.preventDefault();
      switchTab(currentTab === 'config' ? 'main' : 'config'); break;
    case 'e': case 'E':
      e.preventDefault();
      switchTab(currentTab === 'main' ? 'config' : 'main'); break;
    case 'Escape':
      e.preventDefault(); sendToLua('closeMenu', {}); break;
  }
});

// ─── INIT ─────────────────────────────────────────────
// Signal Lua que le HTML est prêt
window.addEventListener('load', function() {
  sendToLua('ready', {});
  render();
  // DEBUG : afficher le menu directement si pas en contexte Lapsus
  if (window.location.href.includes('localhost') || window.location.href.startsWith('file:')) {
    visible = true;
    app.classList.add('visible');
    render();
  }
});
</script>
</body>
</html>

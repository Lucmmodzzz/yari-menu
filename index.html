<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YARI MENU</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap');

/* ─────────────────────────── SPEC HUD ─────────────────────────── */
#spec-hud {
  display:none; position:fixed; top:40px; left:18px; width:260px;
  font-family:'Share Tech Mono',monospace; z-index:9999; pointer-events:none;
}
#spec-hud.visible { display:block; }
.spec-header {
  display:flex; align-items:center; gap:8px; padding:3px 10px;
  background:rgba(0,0,0,0.82); border-left:3px solid var(--accent);
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.spec-header .spec-dot { width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent-glow);animation:blink 1.2s ease-in-out infinite; }
.spec-header .spec-count { font-size:11px;color:var(--accent);letter-spacing:1px;font-weight:700; }
.spec-header .spec-label { font-size:10px;color:rgba(200,200,200,0.55);letter-spacing:2px;margin-left:auto; }
@keyframes blink { 0%,100%{opacity:1}50%{opacity:0.3} }
.spec-row { display:flex;align-items:baseline;gap:6px;padding:3px 10px 3px 13px;background:rgba(0,0,0,0.72);border-left:3px solid transparent;border-bottom:1px solid rgba(255,255,255,0.04); }
.spec-row.noclip{border-left-color:var(--accent)}
.spec-row.admin{border-left-color:#dcaa1e}
.spec-sid{font-size:10px;color:var(--accent);min-width:26px}
.spec-name{font-size:11px;color:#e8e8e8;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spec-dist{font-size:10px;color:rgba(180,180,180,0.6);white-space:nowrap}
.spec-type{font-size:9px;letter-spacing:1px;padding:1px 4px;border-radius:2px;white-space:nowrap}
.spec-type.noclip{color:var(--accent);background:rgba(220,30,30,0.15)}
.spec-type.admin{color:#dcaa1e;background:rgba(220,170,30,0.12)}
.spec-type.both{color:#ff9900;background:rgba(255,153,0,0.13)}
.spec-empty{padding:5px 13px;font-size:10px;color:rgba(180,180,180,0.4);background:rgba(0,0,0,0.72);border-left:3px solid transparent;letter-spacing:1px}

/* ─────────────────────── RESET + BASE ─────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ─────────────────────── THEME VARS ─────────────────────── */
:root {
  --accent:      #DC1E1E;
  --accent-glow: #FF3232;
  --accent-dark: #8C0A0A;
  --accent-l:    #DC1E1E;
  --accent-r:    #8B1FDC;
  --bg:          #0A0A0A;
  --dimmed:      #B0B0B0;
  --sep:         rgba(50,15,15,0.9);
  --row-bg:      rgba(14,14,14,0.97);
  --row-sel-bg:  rgba(220,30,30,0.08);
}
.theme-red    {--accent:#DC1E1E;--accent-glow:#FF3232;--accent-dark:#8C0A0A;--sep:rgba(50,15,15,0.9)}
.theme-purple {--accent:#8B1FDC;--accent-glow:#AA44FF;--accent-dark:#4A0A8C;--sep:rgba(35,10,50,0.9)}
.theme-blue   {--accent:#1E5ADC;--accent-glow:#3278FF;--accent-dark:#0A2A8C;--sep:rgba(10,20,50,0.9)}
.theme-green  {--accent:#1EDC4A;--accent-glow:#32FF6E;--accent-dark:#0A8C26;--sep:rgba(10,40,20,0.9)}

html,body{width:100%;height:100%;background:transparent;overflow:hidden;font-family:'Rajdhani',sans-serif}

/* ─────────────────────── APP WRAPPER ─────────────────────── */
#app {
  position:fixed;top:150px;left:200px;width:360px;
  display:none;flex-direction:column;
  background:var(--bg);
  box-shadow:0 0 30px rgba(0,0,0,0.6),0 0 60px rgba(0,0,0,0.4);
  user-select:none;
  overflow:hidden;
  border-radius:2px;
}

/* top accent line */
#app-top-line {
  height:3px;width:100%;flex-shrink:0;
  background:linear-gradient(90deg, var(--accent-l) 0%, var(--accent-r) 100%);
  transition:background 0.25s;
}
#app-bot-line {
  height:3px;width:100%;flex-shrink:0;
  background:linear-gradient(90deg, var(--accent-l) 0%, var(--accent-r) 100%);
  transition:background 0.25s;
}
#app:not(.twotone) #app-top-line,
#app:not(.twotone) #app-bot-line { background: var(--accent); }

/* ─────────────────────── BANNER ─────────────────────── */
#banner {
  position:relative;height:90px;flex-shrink:0;overflow:hidden;
}
#banner img { width:100%;height:90px;object-fit:cover;object-position:center;display:block; }

/* ─────────────────────── SUB-BANNER (image 2 style) ─────────────────────── */
#subbanner {
  height:22px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;gap:10px;
  background:rgba(4,4,4,0.98);
  position:relative;
}
/* decorative side lines matching image 2 */
#subbanner::before,
#subbanner::after {
  content:'';position:absolute;top:50%;transform:translateY(-50%);
  height:1px;width:60px;
  background:linear-gradient(90deg, transparent, var(--accent));
  opacity:0.7;
}
#subbanner::before { left:14px; background:linear-gradient(90deg, transparent, var(--accent)); }
#subbanner::after  { right:14px;background:linear-gradient(270deg, transparent, var(--accent)); }
.sub-dot {
  width:4px;height:4px;border-radius:50%;
  background:var(--accent);box-shadow:0 0 5px var(--accent-glow);
  flex-shrink:0;
}
.sub-yari {
  font-size:11px;letter-spacing:4px;font-weight:700;
  color:var(--accent);font-family:'Rajdhani',sans-serif;
  text-shadow:0 0 8px var(--accent-glow);
}
.sub-menu {
  font-size:11px;letter-spacing:4px;font-weight:600;
  color:rgba(220,220,220,0.75);font-family:'Rajdhani',sans-serif;
}

/* ─────────────────────── TABS ─────────────────────── */
#tabs {
  height:32px;flex-shrink:0;display:flex;position:relative;
  background:rgba(6,6,6,0.99);
}
.tab {
  flex:1;display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:700;letter-spacing:2.5px;color:rgba(160,160,160,0.6);
  background:transparent;border:none;cursor:pointer;
  transition:color 0.2s,background 0.2s;
  position:relative;
}
.tab:not(:last-child)::after {
  content:'';position:absolute;right:0;top:20%;bottom:20%;
  width:1px;background:rgba(80,80,80,0.3);
}
.tab.active { color:#fff; }
/* active tab: colored bg gradient */
.tab.active::before {
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(220,30,30,0.25) 0%, rgba(220,30,30,0.05) 100%);
  z-index:0;
}
#app.twotone .tab.active::before {
  background:linear-gradient(180deg, rgba(220,30,30,0.22) 0%, rgba(139,31,220,0.1) 100%);
}
.tab span { position:relative;z-index:1; }

/* gradient underline on tab bar — image 2 hallmark */
#tab-underline {
  position:absolute;bottom:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg, var(--accent-l) 0%, var(--accent-r) 100%);
  transition:background 0.25s;
}
#app:not(.twotone) #tab-underline { background:var(--accent); }

/* ─────────────────────── CAT HEADER ─────────────────────── */
#cat-header {
  padding:4px 14px;font-size:10px;letter-spacing:2px;color:var(--dimmed);
  font-family:'Share Tech Mono',monospace;background:rgba(10,10,10,0.95);
  border-bottom:1px solid rgba(60,20,20,0.5);flex-shrink:0;display:none;
}
#cat-header.show { display:block; }

/* ─────────────────────── ITEMS LIST ─────────────────────── */
#items-list { flex-shrink:0; }

/* ─────────────────────── CATEGORY ROW (with icon chip) ─────────────────────── */
.menu-item {
  height:34px;display:flex;align-items:center;
  padding:0 14px 0 10px;position:relative;
  border-bottom:1px solid var(--sep);
  background:var(--row-bg);
  transition:background 0.12s;
}
.menu-item .left-bar {
  position:absolute;left:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg, var(--accent-l), var(--accent-r));
  box-shadow:0 0 8px var(--accent-glow);
  display:none;opacity:0;transition:opacity 0.1s;
}
.menu-item.sel { background:var(--row-sel-bg); }
.menu-item.sel .left-bar { display:block;opacity:1; }
#app:not(.twotone) .menu-item .left-bar { background:var(--accent); }

/* icon chip */
.icon-chip {
  width:30px;height:30px;border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;margin-right:10px;
  font-size:16px;
  /* default chip bg; overridden per category */
  background:rgba(220,30,30,0.15);
  border:1px solid rgba(220,30,30,0.18);
  position:relative;overflow:hidden;
}
/* subtle inner glow on selected row */
.menu-item.sel .icon-chip {
  background:rgba(220,30,30,0.25);
  border-color:rgba(220,30,30,0.35);
  box-shadow:0 0 8px rgba(220,30,30,0.2) inset;
}

/* per-category chip colours */
.icon-chip.cat-player     { background:rgba(220,30,30,0.15);  border-color:rgba(220,30,30,0.25); }
.icon-chip.cat-online     { background:rgba(139,31,220,0.15); border-color:rgba(139,31,220,0.25); }
.icon-chip.cat-weapon     { background:rgba(220,80,30,0.15);  border-color:rgba(220,80,30,0.25); }
.icon-chip.cat-combat     { background:rgba(220,30,80,0.15);  border-color:rgba(220,30,80,0.25); }
.icon-chip.cat-vehicle    { background:rgba(30,90,220,0.15);  border-color:rgba(30,90,220,0.25); }
.icon-chip.cat-construction{ background:rgba(220,160,30,0.15);border-color:rgba(220,160,30,0.25); }
.icon-chip.cat-misc       { background:rgba(30,180,220,0.15); border-color:rgba(30,180,220,0.25); }
.icon-chip.cat-server     { background:rgba(30,220,120,0.15); border-color:rgba(30,220,120,0.25); }
.icon-chip.cat-settings   { background:rgba(220,30,220,0.15); border-color:rgba(220,30,220,0.25); }
.icon-chip.cat-keybind    { background:rgba(220,140,30,0.15); border-color:rgba(220,140,30,0.25); }
.icon-chip.cat-sunlife    { background:rgba(30,220,220,0.15); border-color:rgba(30,220,220,0.25); }
.icon-chip.cat-protection { background:rgba(30,220,80,0.15);  border-color:rgba(30,220,80,0.25); }
.icon-chip.cat-destroyer  { background:rgba(220,30,30,0.18);  border-color:rgba(220,30,30,0.3); }

/* row glow on sel for coloured chips */
.menu-item.sel .icon-chip.cat-online      { background:rgba(139,31,220,0.28); box-shadow:0 0 8px rgba(139,31,220,0.25) inset; }
.menu-item.sel .icon-chip.cat-vehicle     { background:rgba(30,90,220,0.28);  box-shadow:0 0 8px rgba(30,90,220,0.25) inset; }
.menu-item.sel .icon-chip.cat-construction{ background:rgba(220,160,30,0.28); box-shadow:0 0 8px rgba(220,160,30,0.25) inset; }
.menu-item.sel .icon-chip.cat-server      { background:rgba(30,220,120,0.28); box-shadow:0 0 8px rgba(30,220,120,0.25) inset; }
.menu-item.sel .icon-chip.cat-settings    { background:rgba(220,30,220,0.28); box-shadow:0 0 8px rgba(220,30,220,0.25) inset; }

.item-name { flex:1;font-size:13px;font-weight:600;color:rgba(255,255,255,0.82);letter-spacing:0.3px; }
.menu-item.sel .item-name { color:#fff; }

/* chevron / indicator */
.item-ind {
  font-size:14px;font-weight:700;color:var(--accent);
  margin-left:6px;opacity:0.55;transition:opacity 0.1s;
}
.menu-item.sel .item-ind { opacity:1; }

/* ─────────────────────── TOGGLE ─────────────────────── */
.tog {
  width:34px;height:14px;border-radius:7px;
  background:#2a2a2a;position:relative;flex-shrink:0;
  transition:background 0.15s;
}
.tog.on { background:var(--accent);box-shadow:0 0 7px var(--accent-glow); }
#app.twotone .tog.on { background:linear-gradient(90deg,var(--accent-l),var(--accent-r)); }
.tog::after {
  content:'';position:absolute;top:2px;left:2px;
  width:10px;height:10px;border-radius:50%;background:#fff;transition:left 0.12s;
}
.tog.on::after { left:calc(100% - 12px); }

/* ─────────────────────── COLOR STRIP ─────────────────────── */
.color-strip { display:flex;gap:8px;align-items:center;padding:6px 14px 6px 50px;flex-shrink:0; }
.color-dot {
  width:16px;height:16px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;transition:border-color 0.15s,transform 0.1s,box-shadow 0.15s;
  flex-shrink:0;
}
.color-dot.active { border-color:#fff;transform:scale(1.3);box-shadow:0 0 8px currentColor; }
.color-dot.red    { background:#DC1E1E; }
.color-dot.purple { background:#8B1FDC; }
.color-dot.blue   { background:#1E5ADC; }
.color-dot.green  { background:#1EDC4A; }

/* ─────────────────────── FOOTER ─────────────────────── */
#footer {
  height:34px;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:14px;
  background:rgba(6,6,6,0.99);
  border-top:1px solid rgba(255,255,255,0.04);
}
.kh { display:flex;align-items:center;gap:3px;font-size:10px;color:var(--dimmed);font-family:'Share Tech Mono',monospace; }
.k {
  display:inline-flex;align-items:center;justify-content:center;
  min-width:18px;height:14px;padding:0 3px;
  border:1px solid rgba(220,30,30,0.5);border-radius:2px;
  font-size:9px;color:var(--accent);font-weight:700;
  background:rgba(220,30,30,0.07);
}
</style>
</head>
<body>
<div id="app" class="theme-red">
  <div id="app-top-line"></div>

  <!-- BANNER -->
  <div id="banner">
    <img src="yari_menu_banniere_rouge.png" alt="banner"
         style="width:100%;height:90px;object-fit:cover;object-position:center;display:block;" />
  </div>

  <!-- SUB-BANNER — image 2 style: dots + YARI coloured + MENU white -->
  <div id="subbanner">
    <div class="sub-dot"></div>
    <span class="sub-yari">YARI</span>
    <span class="sub-menu">MENU</span>
    <div class="sub-dot"></div>
  </div>

  <!-- TABS -->
  <div id="tabs">
    <div class="tab active" id="tab-main"><span>MAIN</span></div>
    <div class="tab"        id="tab-cfg"><span>CONFIG</span></div>
    <div id="tab-underline"></div>
  </div>

  <div id="cat-header"></div>
  <div id="items-list"></div>

  <div id="app-bot-line"></div>

  <!-- FOOTER -->
  <div id="footer">
    <div class="kh"><span class="k">↑</span><span class="k">↓</span> Nav</div>
    <div class="kh"><span class="k">↵</span> OK</div>
    <div class="kh"><span class="k">esc</span> Back</div>
    <div class="kh"><span class="k">Q</span><span class="k">E</span> Tab</div>
  </div>
</div>

<div id="spec-hud"></div>

<script>
// ─────────────── CATEGORY ICON + CSS CLASS MAP ───────────────
const CAT_META = {
  "Player":       { icon:"👑", cls:"cat-player"      },
  "Online":       { icon:"🌐", cls:"cat-online"      },
  "Weapon":       { icon:"🔫", cls:"cat-weapon"      },
  "Combat":       { icon:"🎯", cls:"cat-combat"      },
  "Vehicle":      { icon:"🚗", cls:"cat-vehicle"     },
  "Construction": { icon:"🔧", cls:"cat-construction" },
  "Misc":         { icon:"💥", cls:"cat-misc"        },
  "Server":       { icon:"🖥", cls:"cat-server"      },
  "Settings":     { icon:"⚙️", cls:"cat-settings"    },
  "Keybind":      { icon:"⌨️", cls:"cat-keybind"     },
  "Sunlife/Prime":{ icon:"📱", cls:"cat-sunlife"     },
  "Protection":   { icon:"🛡️", cls:"cat-protection"  },
  "Destroyer":    { icon:"💣", cls:"cat-destroyer"   },
};

// ─────────────── THEME STATE ───────────────
const THEMES = {
  red:    {accent:'#DC1E1E',glow:'#FF3232',dark:'#8C0A0A',sep:'rgba(50,15,15,0.9)'},
  purple: {accent:'#8B1FDC',glow:'#AA44FF',dark:'#4A0A8C',sep:'rgba(35,10,50,0.9)'},
  blue:   {accent:'#1E5ADC',glow:'#3278FF',dark:'#0A2A8C',sep:'rgba(10,20,50,0.9)'},
  green:  {accent:'#1EDC4A',glow:'#32FF6E',dark:'#0A8C26',sep:'rgba(10,40,20,0.9)'},
};
const TT_L='#DC1E1E', TT_R='#8B1FDC';
let currentTheme='red', twoToneEnabled=false;
const appEl=document.getElementById('app'), root=document.documentElement;

function applyTheme(name,twotone) {
  currentTheme=name; twoToneEnabled=twotone;
  appEl.classList.remove('theme-red','theme-purple','theme-blue','theme-green','twotone');
  if (twotone) {
    appEl.classList.add('twotone');
    root.style.setProperty('--accent-l',TT_L);
    root.style.setProperty('--accent-r',TT_R);
    root.style.setProperty('--accent',TT_L);
    root.style.setProperty('--accent-glow','#FF3232');
    root.style.setProperty('--accent-dark','#8C0A0A');
    root.style.setProperty('--sep','rgba(50,10,40,0.9)');
  } else {
    appEl.classList.add('theme-'+name);
    const t=THEMES[name];
    root.style.setProperty('--accent',t.accent);
    root.style.setProperty('--accent-glow',t.glow);
    root.style.setProperty('--accent-dark',t.dark);
    root.style.setProperty('--sep',t.sep);
    root.style.setProperty('--accent-l',t.accent);
    root.style.setProperty('--accent-r',t.accent);
  }
}

// ─────────────── BANNER CYCLING ───────────────
const BANNERS=["yari_menu_banniere_rouge.png","banniere.png","banniere1.png","banniere2.png","banniere3.png","banniere4.png"];
let bannerIdx=0;
const bannerImg=document.querySelector('#banner img');
function cycleBanner() {
  bannerIdx=(bannerIdx+1)%BANNERS.length;
  sendToLua({type:'bannerChange',index:bannerIdx});
  const next=BANNERS[bannerIdx];
  const test=new Image();
  test.onload=()=>{ bannerImg.src=next; };
  test.onerror=()=>{ bannerIdx=0; bannerImg.src=BANNERS[0]; sendToLua({type:'bannerChange',index:0}); };
  test.src=next;
}

// ─────────────── MENU DATA ───────────────
const CATEGORIES=[
  {name:"Player",        items:["Noclip","God Mode","No Ragdoll","No Collision","Fast Run","Revive","Teleporte To Waypoint","Max Heal","Max Armor","Invisible","Super Jump","Infinite Stamina"]},
  {name:"Online",        items:[]},
  {name:"Weapon",        items:["Give Weapons","Give Weapon by Name","Remove All Weapons"]},
  {name:"Combat",        items:["Laser Eye","Fast Punch"]},
  {name:"Vehicle",       items:["Spawn Véhicule Personnalisé","Porter/Lancer Véhicule","Full Performance","Delete Close Véhicule","Réparer Véhicule","Vehicle God Mode","Shift Boost","Unlock Vehicle","Lock Vehicle"]},
  {name:"Construction",  items:["Wing Vehicle","Tower Vehicle","Ramp Vehicle","Transformer Vehicle","Detach Vehicle"]},
  {name:"Misc",          items:["Warp to Explode","Warp to Vehicle","Afficher liste spectateurs","Ragdoll Player","Ragdoll All Players","Anti Aim"]},
  {name:"Server",        items:["Bypass Sunlife","Prime Bypass"]},
  {name:"Settings",      items:["Auto Load Config","Change Banner","Couleur du Menu","Activer Deux Couleurs"]},
  {name:"Keybind",       items:["Delete All Keybinds"]},
  {name:"Sunlife/Prime", items:["Buy Phone/radio"]},
  {name:"Protection",    items:["Anti-teleport","Panic Button"]},
  {name:"Destroyer",     items:["Delete All Vehicles","Explode All Vehicles","Cage All Players","Bug All Players BMX","Vehicle Chaos"]},
];
const CONFIG_ITEMS=["Save Config","Load Config"];
const toggleStates={};
const TOGGLE_KEYS=new Set([
  "Player_1","Player_2","Player_3","Player_4","Player_5",
  "Player_8","Player_9","Player_10","Player_11","Player_12",
  "Vehicle_2","Vehicle_6","Vehicle_7",
  "Misc_1","Misc_2","Misc_3","Misc_4",
  "Combat_1","Combat_2",
  "Protection_1",
  "Settings_1","Settings_4",
  "Destroyer_5",
]);

// ─────────────── UI STATE ───────────────
let tab='main', selIdx=0, scrollOff=0;
let curCatName=null, catSel=0, catScroll=0;
const MAX_VIS=10;
let onlineSubMenu=null, onlineSubSel=0;
let nearbyPlayers=[], selectedPlayers={};
let trollActions=["Teleport","Ragdoll","Silent Kill","Stun Player","Spectate","Revive","Smash Attack","Launch Player","Cage Player","Cage Player M2","Stop Cage Player M2","Bug Player BMX","Bug Player Avenger","Block Player Vehicle","Rain Vehicle","Stop Rain Vehicle"];
let trollSel=0, playerSel=0;

const tabMainEl=document.getElementById('tab-main');
const tabCfgEl=document.getElementById('tab-cfg');
const catHeader=document.getElementById('cat-header');
const itemsList=document.getElementById('items-list');

// ─────────────── RENDER ───────────────
function getCurCat() {
  if (!curCatName) return null;
  return CATEGORIES.find(c=>c.name===curCatName)||null;
}

function render() {
  itemsList.innerHTML='';
  const cat=getCurCat();
  if (tab==='config') {
    catHeader.className='';
    renderList(CONFIG_ITEMS,selIdx,scrollOff,null);
    return;
  }
  if (cat) {
    catHeader.className='';
    if (cat.name==='Online') { renderOnline(); return; }
    catHeader.textContent=cat.name.toUpperCase();
    catHeader.className='show';
    renderList(cat.items,catSel,catScroll,cat.name);
  } else {
    catHeader.className='';
    renderCategories();
  }
}

function renderCategories() {
  for (let i=0;i<MAX_VIS;i++) {
    const idx=i+scrollOff;
    if (idx>=CATEGORIES.length) break;
    const c=CATEGORIES[idx];
    const has=c.items.length>0||c.name==='Online';
    const meta=CAT_META[c.name]||{icon:'▸',cls:''};
    makeCatItem(c.name, idx===selIdx, has?'›':'', meta.icon, meta.cls);
  }
}

function makeCatItem(name, selected, ind, icon, chipCls) {
  const el=document.createElement('div');
  el.className='menu-item'+(selected?' sel':'');
  // left accent bar
  const bar=document.createElement('div');
  bar.className='left-bar';
  el.appendChild(bar);
  // icon chip
  const chip=document.createElement('div');
  chip.className='icon-chip '+chipCls;
  chip.textContent=icon;
  el.appendChild(chip);
  // name
  const nm=document.createElement('span');
  nm.className='item-name';
  nm.textContent=name;
  el.appendChild(nm);
  // chevron
  if (ind) {
    const ind_el=document.createElement('span');
    ind_el.className='item-ind';
    ind_el.textContent=ind;
    el.appendChild(ind_el);
  }
  itemsList.appendChild(el);
}

function renderList(items, si, so, catName) {
  if (items.length===0) {
    const d=document.createElement('div');
    d.className='menu-item';
    d.innerHTML='<span class="item-name" style="color:var(--dimmed);font-size:11px">Aucun élément</span>';
    itemsList.appendChild(d);
    return;
  }
  for (let i=0;i<MAX_VIS;i++) {
    const idx=i+so;
    if (idx>=items.length) break;
    const name=items[idx];
    const key=catName?catName+'_'+(idx+1):null;
    const isTog=key!==null&&TOGGLE_KEYS.has(key);
    // Colour picker inline
    if (catName==='Settings'&&name==='Couleur du Menu') {
      const el=document.createElement('div');
      el.className='menu-item'+(idx===si?' sel':'');
      el.style.height='auto';el.style.padding='4px 14px 4px 10px';el.style.flexWrap='wrap';el.style.gap='6px';
      const bar=document.createElement('div'); bar.className='left-bar'; el.appendChild(bar);
      const chip=document.createElement('div'); chip.className='icon-chip cat-settings'; chip.textContent='🎨'; el.appendChild(chip);
      const nm=document.createElement('span'); nm.className='item-name'; nm.textContent='Couleur'; el.appendChild(nm);
      const strip=document.createElement('div');
      strip.style.cssText='display:flex;gap:6px;align-items:center;margin-left:auto;';
      ['red','purple','blue','green'].forEach(c=>{
        const dot=document.createElement('div');
        dot.className='color-dot '+c+(currentTheme===c&&!twoToneEnabled?' active':'');
        dot.addEventListener('click',()=>{ applyTheme(c,false); sendToLua({type:'colorChange',theme:c,twotone:false}); render(); });
        strip.appendChild(dot);
      });
      el.appendChild(strip);
      itemsList.appendChild(el);
      continue;
    }
    // Deux Couleurs toggle
    if (catName==='Settings'&&name==='Activer Deux Couleurs') {
      makeSubItem(name,idx===si,null,twoToneEnabled,catName,idx);
      continue;
    }
    const togVal=isTog?(toggleStates[key]===true):null;
    makeSubItem(name,idx===si,isTog?null:'+',togVal,catName,idx);
  }
}

function makeSubItem(name, selected, ind, togState, catName, idx) {
  const el=document.createElement('div');
  el.className='menu-item'+(selected?' sel':'');
  const bar=document.createElement('div'); bar.className='left-bar'; el.appendChild(bar);
  // small dot accent instead of icon chip for sub-items
  const dot=document.createElement('div');
  dot.style.cssText='width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:'+(selected?'1':'0.35')+';flex-shrink:0;margin-right:10px;margin-left:5px;box-shadow:'+(selected?'0 0 5px var(--accent-glow)':'none')+';';
  el.appendChild(dot);
  const nm=document.createElement('span'); nm.className='item-name'; nm.textContent=name; el.appendChild(nm);
  if (togState!==null&&togState!==undefined) {
    const t=document.createElement('div'); t.className='tog'+(togState?' on':''); el.appendChild(t);
  } else if (ind) {
    const s=document.createElement('span'); s.className='item-ind'; s.textContent=ind; el.appendChild(s);
  }
  itemsList.appendChild(el);
}

function renderOnline() {
  if (onlineSubMenu===null) {
    ['Players','Troll'].forEach((name,i)=>{
      const el=document.createElement('div');
      el.className='menu-item'+(i===onlineSubSel?' sel':'');
      const bar=document.createElement('div'); bar.className='left-bar'; el.appendChild(bar);
      const dot=document.createElement('div');
      dot.style.cssText='width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:'+(i===onlineSubSel?'1':'0.35')+';flex-shrink:0;margin-right:10px;margin-left:5px;';
      el.appendChild(dot);
      const nm=document.createElement('span'); nm.className='item-name'; nm.textContent=name; el.appendChild(nm);
      const ind=document.createElement('span'); ind.className='item-ind'; ind.textContent='›'; el.appendChild(ind);
      itemsList.appendChild(el);
    });
  } else if (onlineSubMenu==='Players') {
    const selCount=Object.keys(selectedPlayers).length;
    if (selCount>0) {
      const hd=document.createElement('div');
      hd.style.cssText='padding:2px 14px;font-size:10px;color:#32c832;font-family:"Share Tech Mono",monospace;';
      hd.textContent=`● ${selCount} sélectionné(s)`;
      itemsList.appendChild(hd);
    }
    if (nearbyPlayers.length===0) {
      const el=document.createElement('div'); el.className='menu-item';
      el.innerHTML='<span class="item-name" style="color:var(--dimmed);font-size:11px">Aucun joueur à proximité</span>';
      itemsList.appendChild(el);
    } else {
      nearbyPlayers.slice(0,10).forEach((p,i)=>{
        const isOn=selectedPlayers[p.serverId]===true;
        const el=document.createElement('div');
        el.className='menu-item'+(i===playerSel?' sel':'');
        el.innerHTML=`<div class="left-bar"></div>
          <span class="item-name" style="font-size:11px">[${p.serverId}] ${p.name} <span style="color:var(--dimmed)">${p.distance}m</span></span>
          <div class="tog${isOn?' on':''}"></div>`;
        itemsList.appendChild(el);
      });
    }
  } else if (onlineSubMenu==='Troll') {
    const selCount=Object.keys(selectedPlayers).length;
    const hd=document.createElement('div');
    hd.style.cssText='padding:2px 14px;font-size:10px;font-family:"Share Tech Mono",monospace;';
    hd.style.color=selCount>0?'#32c832':'#dc821e';
    hd.textContent=selCount>0?`● ${selCount} joueur(s) ciblé(s)`:'⚠ Aucun joueur sélectionné';
    itemsList.appendChild(hd);
    trollActions.forEach((name,i)=>{
      const el=document.createElement('div');
      el.className='menu-item'+(i===trollSel?' sel':'');
      const bar=document.createElement('div'); bar.className='left-bar'; el.appendChild(bar);
      const dot=document.createElement('div');
      dot.style.cssText='width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:'+(i===trollSel?'1':'0.35')+';flex-shrink:0;margin-right:10px;margin-left:5px;';
      el.appendChild(dot);
      const nm=document.createElement('span'); nm.className='item-name'; nm.textContent=name; el.appendChild(nm);
      const ind=document.createElement('span'); ind.className='item-ind'; ind.textContent='▶'; el.appendChild(ind);
      itemsList.appendChild(el);
    });
  }
}

function setTab(t) {
  tab=t; curCatName=null; selIdx=0; scrollOff=0;
  tabMainEl.className='tab'+(t==='main'?' active':'');
  tabCfgEl.className='tab'+(t==='config'?' active':'');
  render();
}

// ─────────────── LUA BRIDGE ───────────────
function sendToLua(obj) {
  if (!window.__yariCallback) return;
  try { window.__yariCallback(JSON.stringify(obj)); } catch(_) {}
}

window.addEventListener('message',function(e) {
  let d=e.data;
  if (typeof d==='string') { try{ d=JSON.parse(d); }catch(_){return;} }
  if (!d||!d.type) return;

  if (d.type==='showMenu') { appEl.style.display='flex'; render(); return; }
  if (d.type==='hideMenu') { appEl.style.display='none'; return; }
  if (d.type==='cycleBanner') { cycleBanner(); return; }

  if (d.type==='spectatorToggle') {
    document.getElementById('spec-hud').className=d.enabled?'visible':'';
    if (!d.enabled) document.getElementById('spec-hud').innerHTML='';
    return;
  }
  if (d.type==='spectatorUpdate') {
    const hud=document.getElementById('spec-hud');
    if (!d.enabled){hud.className='';hud.innerHTML='';return;}
    hud.className='visible';
    const list=d.list||[];
    let html=`<div class="spec-header"><div class="spec-dot"></div><span class="spec-count">${list.length}</span><span class="spec-label">SPECTATEURS</span></div>`;
    if (list.length===0) html+=`<div class="spec-empty">Aucun spectateur détecté</div>`;
    else list.forEach(p=>{
      const isNoclip=p.type.includes('Noclip'), isAdmin=p.type.includes('Admin');
      const rowCls=(isNoclip&&isAdmin)?'both':isNoclip?'noclip':'admin';
      const typeLabel=p.type.replace(/[\[\]]/g,'');
      html+=`<div class="spec-row ${isNoclip?'noclip':'admin'}"><span class="spec-sid">${p.serverId}</span><span class="spec-name">${p.name}</span><span class="spec-dist">${p.distance}m</span><span class="spec-type ${rowCls}">${typeLabel}</span></div>`;
    });
    hud.innerHTML=html; return;
  }
  if (d.type==='setBanner') {
    bannerIdx=d.index||0;
    const src=BANNERS[bannerIdx]||BANNERS[0];
    const test=new Image();
    test.onload=()=>{bannerImg.src=src;}; test.onerror=()=>{bannerImg.src=BANNERS[0];bannerIdx=0;};
    test.src=src; return;
  }
  if (d.type==='applyTheme') { applyTheme(d.theme||currentTheme,d.twotone===true); render(); return; }
  if (d.type==='setToggleStates') {
    if (d.states) Object.assign(toggleStates,d.states);
    if ('Settings_4' in (d.states||{})) { twoToneEnabled=d.states['Settings_4']===true; applyTheme(currentTheme,twoToneEnabled); }
    render(); return;
  }
  if (d.type==='sync') {
    if (d.toggles) {
      Object.assign(toggleStates,d.toggles);
      if ('Settings_4' in d.toggles) { twoToneEnabled=d.toggles['Settings_4']===true; applyTheme(currentTheme,twoToneEnabled); }
    }
    if (d.tab) { tab=d.tab; tabMainEl.className='tab'+(tab==='main'?' active':''); tabCfgEl.className='tab'+(tab==='config'?' active':''); }
    curCatName=d.curCatName||null;
    if (d.selIdx!==undefined){if(curCatName)catSel=d.selIdx;else selIdx=d.selIdx;}
    if (d.scrollOff!==undefined){if(curCatName)catScroll=d.scrollOff;else scrollOff=d.scrollOff;}
    if ('onlineSubMenu' in d) onlineSubMenu=d.onlineSubMenu;
    if (d.onlineSubSel!==undefined) onlineSubSel=d.onlineSubSel;
    if (d.nearbyPlayers!==undefined) nearbyPlayers=d.nearbyPlayers;
    if (d.selectedPlayers!==undefined) selectedPlayers=d.selectedPlayers;
    if (d.trollSel!==undefined) trollSel=d.trollSel;
    if (d.playerSel!==undefined) playerSel=d.playerSel;
    render(); return;
  }
});

render();
</script>
</body>
</html>

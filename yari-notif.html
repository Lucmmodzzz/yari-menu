<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap');

:root {
  --accent: #DC1E1E;
  --accent-glow: #FF3232;
  --accent-dark: #8C0A0A;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: transparent; overflow: hidden; width: 100%; height: 100%; }

#notif-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  display: flex;
  flex-direction: column-reverse;
  gap: 8px;
  z-index: 99999;
  pointer-events: none;
  width: 320px;
}

.notif {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: rgba(8, 8, 8, 0.97);
  border-left: 3px solid var(--accent);
  border-radius: 6px;
  box-shadow:
    0 8px 32px rgba(0,0,0,0.65),
    0 2px 8px rgba(0,0,0,0.5),
    0 0 0 1px rgba(255,255,255,0.04),
    inset 0 1px 0 rgba(255,255,255,0.05);
  font-family: 'Rajdhani', sans-serif;
  overflow: hidden;
  position: relative;
  animation: notif-slide-in 0.22s cubic-bezier(0.34,1.56,0.64,1) both;
  backdrop-filter: blur(14px) saturate(1.0);
  -webkit-backdrop-filter: blur(14px) saturate(1.0);
}

.notif.removing {
  animation: notif-slide-out 0.18s ease-in both;
}

@keyframes notif-slide-in {
  from { opacity: 0; transform: translateX(32px) scale(0.95); }
  to   { opacity: 1; transform: translateX(0)    scale(1);    }
}

@keyframes notif-slide-out {
  from { opacity: 1; transform: translateX(0)    scale(1);    max-height: 80px; margin-bottom: 0; }
  to   { opacity: 0; transform: translateX(32px) scale(0.95); max-height: 0;    margin-bottom: -8px; }
}

.notif-icon {
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: rgba(220,30,30,0.12);
  border: 1px solid rgba(220,30,30,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 8px rgba(220,30,30,0.2);
}

.notif-icon svg {
  width: 16px;
  height: 16px;
  color: var(--accent);
  filter: drop-shadow(0 0 4px var(--accent-glow));
}

.notif-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.notif-title {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: #fff;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  text-shadow: 0 0 10px var(--accent-glow);
}

.notif-msg {
  font-family: 'Share Tech Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.8px;
  color: rgba(200,200,200,0.75);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.notif-progress {
  position: absolute;
  bottom: 0;
  left: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent-glow));
  box-shadow: 0 0 6px var(--accent-glow);
  animation: progress-drain linear forwards;
  transform-origin: left;
}

@keyframes progress-drain {
  from { width: 100%; opacity: 1; }
  to   { width: 0%;   opacity: 0.4; }
}

/* Icon variants */
.notif.success .notif-icon { background: rgba(30,220,74,0.1); border-color: rgba(30,220,74,0.3); box-shadow: 0 0 8px rgba(30,220,74,0.2); }
.notif.success .notif-icon svg { color: #1EDC4A; filter: drop-shadow(0 0 4px #32FF6E); }
.notif.success { border-left-color: #1EDC4A; }
.notif.success .notif-title { text-shadow: 0 0 10px #32FF6E; }
.notif.success .notif-progress { background: linear-gradient(90deg, #1EDC4A, #32FF6E); box-shadow: 0 0 6px #32FF6E; }

.notif.warn .notif-icon { background: rgba(220,170,30,0.1); border-color: rgba(220,170,30,0.3); box-shadow: 0 0 8px rgba(220,170,30,0.2); }
.notif.warn .notif-icon svg { color: #DCAA1E; filter: drop-shadow(0 0 4px #FFCC32); }
.notif.warn { border-left-color: #DCAA1E; }
.notif.warn .notif-title { text-shadow: 0 0 10px #FFCC32; }
.notif.warn .notif-progress { background: linear-gradient(90deg, #DCAA1E, #FFCC32); box-shadow: 0 0 6px #FFCC32; }

.notif.info .notif-icon { background: rgba(30,90,220,0.1); border-color: rgba(30,90,220,0.3); box-shadow: 0 0 8px rgba(30,90,220,0.2); }
.notif.info .notif-icon svg { color: #1E5ADC; filter: drop-shadow(0 0 4px #3278FF); }
.notif.info { border-left-color: #1E5ADC; }
.notif.info .notif-title { text-shadow: 0 0 10px #3278FF; }
.notif.info .notif-progress { background: linear-gradient(90deg, #1E5ADC, #3278FF); box-shadow: 0 0 6px #3278FF; }
</style>
</head>
<body>
<div id="notif-container"></div>

<script>
const ICONS = {
  default: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`,
  success: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`,
  warn:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
  info:    `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`,
  error:   `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>`,
};

const container = document.getElementById('notif-container');

function showNotif({ title = 'YARI', message = '', type = 'default', duration = 4000 }) {
  const el = document.createElement('div');
  el.className = 'notif' + (type !== 'default' ? ' ' + type : '');

  const icon = ICONS[type] || ICONS.default;
  el.innerHTML = `
    <div class="notif-icon">${icon}</div>
    <div class="notif-body">
      <div class="notif-title">${title}</div>
      <div class="notif-msg">${message}</div>
    </div>
    <div class="notif-progress" style="animation-duration:${duration}ms"></div>
  `;

  container.appendChild(el);

  setTimeout(() => {
    el.classList.add('removing');
    el.addEventListener('animationend', () => el.remove(), { once: true });
  }, duration);
}

window.addEventListener('message', function(e) {
  let d = e.data;
  if (typeof d === 'string') { try { d = JSON.parse(d); } catch(_) { return; } }
  if (!d || d.type !== 'yariNotif') return;
  showNotif({
    title:    d.title    || 'YARI',
    message:  d.message  || '',
    type:     d.notifType || 'default',
    duration: d.duration || 4000,
  });
});
</script>
</body>
</html>
